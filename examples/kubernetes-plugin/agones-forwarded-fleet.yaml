apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: udp-game-forwarded
spec:
  replicas: 4
  scheduling: Distributed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: udp-game-forwarded
      annotations:
        networking.heteronetwork.io/traffic-mode: forwarded
    spec:
      ports:
        - name: game
          portPolicy: None
          containerPort: 7654
          protocol: UDP
      health:
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: udp-game-forwarded
        spec:
          containers:
            - name: simple-game-server
              image: us-docker.pkg.dev/agones-images/examples/simple-game-server:0.43
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 128Mi
