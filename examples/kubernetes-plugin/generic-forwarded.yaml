apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-forwarded
  labels:
    app.kubernetes.io/name: echo-forwarded
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-forwarded
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-forwarded
    spec:
      containers:
        - name: http
          image: nginx:1.27.5-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: echo-forwarded
  annotations:
    networking.heteronetwork.io/traffic-mode: forwarded
spec:
  type: LoadBalancer
  loadBalancerClass: heteronetwork.io/public
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: echo-forwarded
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
