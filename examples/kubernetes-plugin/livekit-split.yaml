apiVersion: v1
kind: Namespace
metadata:
  name: livekit-split
---
apiVersion: v1
kind: Secret
metadata:
  name: livekit-keys
  namespace: livekit-split
type: Opaque
stringData:
  keys.yaml: |
    example-api-key: replace-with-a-long-random-api-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: livekit-split
data:
  livekit.yaml: |
    port: 7880
    log_level: info
    key_file: /etc/livekit-secrets/keys.yaml
    redis:
      address: redis.livekit-split.svc.cluster.local:6379
    rtc:
      tcp_port: 7881
      udp_port: 7882
      use_external_ip: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: livekit-split
  labels:
    app.kubernetes.io/name: livekit
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit
        networking.heteronetwork.io/traffic-mode: direct
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 18000
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: livekit
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.1
          args:
            - --config
            - /etc/livekit/livekit.yaml
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              hostPort: 7881
              protocol: TCP
            - name: rtc-udp
              containerPort: 7882
              hostPort: 7882
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /
              port: signal
          livenessProbe:
            httpGet:
              path: /
              port: signal
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
            - name: keys
              mountPath: /etc/livekit-secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: livekit-config
        - name: keys
          secret:
            secretName: livekit-keys
            defaultMode: 0600
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-signal
  namespace: livekit-split
  annotations:
    networking.heteronetwork.io/traffic-mode: forwarded
spec:
  type: LoadBalancer
  loadBalancerClass: heteronetwork.io/public
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: signal
      protocol: TCP
      appProtocol: http
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-rtc
  namespace: livekit-split
  annotations:
    networking.heteronetwork.io/traffic-mode: direct
spec:
  type: LoadBalancer
  loadBalancerClass: heteronetwork.io/public
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: rtc-tcp
      port: 7881
      targetPort: rtc-tcp
      protocol: TCP
    - name: rtc-udp
      port: 7882
      targetPort: rtc-udp
      protocol: UDP
