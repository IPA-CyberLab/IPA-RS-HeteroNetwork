apiVersion: v1
kind: Namespace
metadata:
  name: livekit-forwarded
---
apiVersion: v1
kind: Secret
metadata:
  name: livekit-keys
  namespace: livekit-forwarded
type: Opaque
stringData:
  keys.yaml: |
    example-api-key: replace-with-a-long-random-api-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: livekit-forwarded
data:
  livekit.yaml: |
    port: 7880
    redis:
      address: redis.livekit-forwarded.svc.cluster.local:6379
    rtc:
      tcp_port: 7881
      udp_port: 7882
      use_external_ip: false
    turn:
      enabled: true
      domain: turn.example.com
      udp_port: 3478
      tls_port: 5349
      cert_file: /etc/livekit-turn/tls.crt
      key_file: /etc/livekit-turn/tls.key
      allow_restricted_peer_cidrs:
        - 10.244.0.0/16
        - 10.250.0.0/16
    logging:
      level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: livekit-forwarded
  labels:
    app.kubernetes.io/name: livekit
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit
    spec:
      terminationGracePeriodSeconds: 18000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: livekit
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.4@sha256:189f7c81b704a36642bc5c7e2d3e1ae83744627c11978a23a251bf19fbec64e0
          args:
            - --config
            - /etc/livekit/livekit.yaml
            - --key-file
            - /etc/livekit-secrets/keys.yaml
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              protocol: TCP
            - name: rtc-udp
              containerPort: 7882
              protocol: UDP
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tls
              containerPort: 5349
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: signal
          livenessProbe:
            httpGet:
              path: /
              port: signal
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
            - name: keys
              mountPath: /etc/livekit-secrets
              readOnly: true
            - name: turn-tls
              mountPath: /etc/livekit-turn
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: livekit-config
        - name: keys
          secret:
            secretName: livekit-keys
            defaultMode: 0600
        - name: turn-tls
          secret:
            secretName: livekit-turn-tls
            defaultMode: 0600
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-signal
  namespace: livekit-forwarded
  annotations:
    networking.heteronetwork.io/traffic-mode: forwarded
spec:
  type: LoadBalancer
  loadBalancerClass: heteronetwork.io/public
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: signal
      protocol: TCP
      appProtocol: http
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-turn
  namespace: livekit-forwarded
  annotations:
    networking.heteronetwork.io/traffic-mode: forwarded
spec:
  type: LoadBalancer
  loadBalancerClass: heteronetwork.io/public
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: turn-udp
      port: 3478
      targetPort: turn-udp
      protocol: UDP
    - name: turn-tls
      port: 5349
      targetPort: turn-tls
      protocol: TCP
