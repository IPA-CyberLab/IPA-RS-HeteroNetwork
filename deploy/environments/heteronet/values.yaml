image:
  repository: ghcr.io/ipa-cyberlab/heteronetwork
  tag: 03ecf80
  pullPolicy: IfNotPresent

agent:
  mode: host
  # Host-networked Kubernetes helpers use the node-local HAProxy, which keeps
  # the API path on HeteroNetwork even when the physical default route is not
  # allowed to reach the Kubernetes Service CIDR.

  overlayDns:
    enabled: true
    # The console name is synthesized by each gateway's split-DNS listener so
    # clients always connect to the gateway that currently carries their VPN.
    records:
      grafana.heteronetwork.internal:
        # Healthy host-networked replicas; gateway records put the nearest
        # endpoint first while retaining alternatives for failover.
        - 10.250.0.5
        - 10.250.0.6
      prometheus.heteronetwork.internal:
        - 10.250.0.5
        - 10.250.0.6
      argocd.heteronetwork.internal:
        - 10.250.0.4
        - 10.250.0.5
        - 10.250.0.6
      owner.heterocloud.internal:
        - 10.250.0.4
        - 10.250.0.5
        - 10.250.0.6
        - 10.250.0.8
        - 10.250.0.10
    gatewayRecords:
      grafana.heteronetwork.internal:
        10.250.0.4:
          - 10.250.0.6
          - 10.250.0.5
        10.250.0.5:
          - 10.250.0.5
          - 10.250.0.6
        10.250.0.6:
          - 10.250.0.6
          - 10.250.0.5
        10.250.0.8:
          - 10.250.0.6
          - 10.250.0.5
        10.250.0.10:
          - 10.250.0.6
          - 10.250.0.5
      prometheus.heteronetwork.internal:
        10.250.0.4: [10.250.0.6, 10.250.0.5]
        10.250.0.5: [10.250.0.5, 10.250.0.6]
        10.250.0.6: [10.250.0.6, 10.250.0.5]
        10.250.0.8: [10.250.0.6, 10.250.0.5]
        10.250.0.10: [10.250.0.6, 10.250.0.5]
      argocd.heteronetwork.internal:
        10.250.0.4: [10.250.0.4, 10.250.0.6, 10.250.0.5]
        10.250.0.5: [10.250.0.5, 10.250.0.6, 10.250.0.4]
        10.250.0.6: [10.250.0.6, 10.250.0.5, 10.250.0.4]
        10.250.0.8: [10.250.0.6, 10.250.0.5, 10.250.0.4]
      owner.heterocloud.internal:
        10.250.0.4: [10.250.0.4, 10.250.0.5, 10.250.0.6, 10.250.0.8, 10.250.0.10]
        10.250.0.5: [10.250.0.5, 10.250.0.6, 10.250.0.4, 10.250.0.8, 10.250.0.10]
        10.250.0.6: [10.250.0.6, 10.250.0.5, 10.250.0.4, 10.250.0.8, 10.250.0.10]
        10.250.0.8: [10.250.0.8, 10.250.0.10, 10.250.0.6, 10.250.0.5, 10.250.0.4]
        10.250.0.10: [10.250.0.10, 10.250.0.8, 10.250.0.6, 10.250.0.5, 10.250.0.4]

kubernetesPlugin:
  controller:
    # Remove failed public ingress addresses before the 60-second public DNS
    # TTL expires so clients converge within one cache lifetime.
    reconcileIntervalSeconds: 5
  nodeReporter:
    kubernetesServiceHost: k8s-api.heteronetwork.internal
    kubernetesServicePort: 7443

serviceExposure:
  enabled: false
