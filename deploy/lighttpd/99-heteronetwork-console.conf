server.modules += ( "mod_proxy" )

$HTTP["host"] == "console.heteronetwork.internal" {
  # The loopback Agent endpoint applies its own Host and Origin checks.
  setenv.set-request-header = (
    "Host" => "127.0.0.1:9780",
    "Origin" => "http://127.0.0.1:9780",
  )
  setenv.add-response-header = (
    "X-HeteroNetwork-Console" => "proxy",
  )
  proxy.server = (
    "" => (
      (
        "host" => "127.0.0.1",
        "port" => 9780,
      ),
    ),
  )
}
