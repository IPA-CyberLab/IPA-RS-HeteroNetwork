- name: Publish the infrastructure Git source on the existing bootstrap host
  hosts: bootstrap
  gather_facts: false
  become: true
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
  tasks:
    - name: Install the Git transport
      ansible.builtin.apt:
        name: git
        state: present
    - name: Create the public-source repository directory
      ansible.builtin.file:
        path: /var/lib/heteronetwork-gitops
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Transfer the reviewed infrastructure bundle
      ansible.builtin.copy:
        src: '{{ hnn_work_dir }}/infrastructure.bundle'
        dest: /var/lib/heteronetwork-gitops/infrastructure.bundle
        owner: root
        group: root
        mode: '0644'
    - name: Read the desired infrastructure revision
      ansible.builtin.command:
        argv: [git, bundle, list-heads, /var/lib/heteronetwork-gitops/infrastructure.bundle, 'refs/heads/{{ hnn_git_revision }}']
      register: hnn_bundle_revision
      changed_when: false
      check_mode: false
    - name: Require the selected branch in the infrastructure bundle
      ansible.builtin.assert:
        that: hnn_bundle_revision.stdout.split() | length == 2
        fail_msg: The infrastructure bundle does not contain the selected branch
    - name: Initialize the bare infrastructure repository
      ansible.builtin.command:
        argv: [git, init, --bare, /var/lib/heteronetwork-gitops/heteronetwork-infrastructure.git]
        creates: /var/lib/heteronetwork-gitops/heteronetwork-infrastructure.git/HEAD
    - name: Inspect the published infrastructure revision
      ansible.builtin.command:
        argv: [git, '--git-dir=/var/lib/heteronetwork-gitops/heteronetwork-infrastructure.git', rev-parse, --verify, 'refs/heads/{{ hnn_git_revision }}']
      register: hnn_published_revision
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Import the declared infrastructure branch
      ansible.builtin.command:
        argv: [git, '--git-dir=/var/lib/heteronetwork-gitops/heteronetwork-infrastructure.git', fetch, /var/lib/heteronetwork-gitops/infrastructure.bundle, '+refs/heads/{{ hnn_git_revision }}:refs/heads/{{ hnn_git_revision }}']
      when: hnn_published_revision.stdout != hnn_bundle_revision.stdout.split()[0]
    - name: Inspect the repository default branch
      ansible.builtin.command:
        argv: [git, '--git-dir=/var/lib/heteronetwork-gitops/heteronetwork-infrastructure.git', symbolic-ref, HEAD]
      register: hnn_published_branch
      changed_when: false
      failed_when: false
      check_mode: false
    - name: Declare the repository default branch
      ansible.builtin.command:
        argv: [git, '--git-dir=/var/lib/heteronetwork-gitops/heteronetwork-infrastructure.git', symbolic-ref, HEAD, 'refs/heads/{{ hnn_git_revision }}']
      when: hnn_published_branch.stdout != 'refs/heads/' + hnn_git_revision
    - name: Configure read-only Git serving on the HeteroNetwork address
      ansible.builtin.copy:
        dest: /etc/systemd/system/heteronetwork-gitops-source.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Read-only infrastructure Git source on HeteroNetwork
          Requires=heteronetwork-agent.service
          After=heteronetwork-agent.service network-online.target
          [Service]
          Type=simple
          DynamicUser=yes
          ExecStart=/usr/bin/git -c safe.directory=/var/lib/heteronetwork-gitops/heteronetwork-infrastructure.git daemon --reuseaddr --export-all --strict-paths --base-path=/var/lib/heteronetwork-gitops --listen=10.250.0.2 --port=19419 /var/lib/heteronetwork-gitops/heteronetwork-infrastructure.git
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=yes
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=yes
          ReadOnlyPaths=/var/lib/heteronetwork-gitops
          RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
          CapabilityBoundingSet=
          [Install]
          WantedBy=multi-user.target
      notify: Restart Git source
    - name: Enable the Git source
      ansible.builtin.systemd_service:
        name: heteronetwork-gitops-source.service
        daemon_reload: true
        state: started
        enabled: true
  handlers:
    - name: Restart Git source
      ansible.builtin.systemd_service:
        name: heteronetwork-gitops-source.service
        daemon_reload: true
        state: restarted
