- name: Stage the secondary public gateway without enabling traffic
  hosts: bootstrap
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
  tasks:
    - name: Stage the declarative base, separate from generated certificates
      ansible.builtin.template:
        src: templates/public-gateway-secondary.Caddyfile.j2
        dest: /etc/heteronetwork/public-gateway-base.candidate.Caddyfile
        owner: root
        group: root
        mode: '0644'
    - name: Install the locked base-file validator
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/scripts/install-public-gateway-base.py"
        dest: /opt/heteronetwork/libexec/install-public-gateway-base.py
        owner: root
        group: root
        mode: '0755'
    - name: Validate with current certificate blocks before publishing the base
      ansible.builtin.command:
        argv: [/usr/bin/python3, /opt/heteronetwork/libexec/install-public-gateway-base.py]
      register: public_gateway_base
      changed_when: (public_gateway_base.stdout | from_json).changed
