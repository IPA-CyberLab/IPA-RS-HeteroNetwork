- name: Stage the secondary public gateway without enabling traffic
  hosts: bootstrap
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
  tasks:
    - name: Install the declarative base, separate from generated certificates
      ansible.builtin.template:
        src: templates/public-gateway-secondary.Caddyfile.j2
        dest: /etc/heteronetwork/public-gateway-base.Caddyfile
        owner: root
        group: root
        mode: '0644'
    - name: Create the effective file only on initial provisioning
      ansible.builtin.copy:
        src: /etc/heteronetwork/public-gateway-base.Caddyfile
        dest: /etc/heteronetwork/public-gateway-extra.Caddyfile
        remote_src: true
        force: false
        owner: root
        group: root
        mode: '0644'
