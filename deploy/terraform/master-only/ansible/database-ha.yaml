- name: Validate the protected recovery authority before changing a host
  hosts: bootstrap
  gather_facts: false
  become: true
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
    hnn_database_bundle: /etc/heteronetwork/postgres-autopilot/bundle
    hnn_database_archive: /etc/heteronetwork/postgres-autopilot/bundle.tar.gz
    hnn_database_proxy_archive: /etc/heteronetwork/postgres-autopilot/proxy-bundle.tar.gz
    hnn_database_authority_backup: /var/backups/heteronetwork/iac-database-ha/authority
  tasks:
    - name: Inspect the protected database recovery authority without exposing it
      ansible.builtin.script:
        cmd: >-
          {{ hnn_repo_root }}/scripts/recover-database-authority.py
          --bundle {{ hnn_database_bundle }}
          --archive {{ hnn_database_archive }}
          --backup-dir {{ hnn_database_authority_backup }}
        executable: /usr/bin/python3
      register: hnn_database_recovery_audit
      changed_when: false
      check_mode: false
      no_log: true

    - name: Record the sanitized protected authority audit
      ansible.builtin.set_fact:
        hnn_database_recovery_state: "{{ hnn_database_recovery_audit.stdout | from_json }}"
      no_log: true

    - name: "Require the reviewed recovery state ({{ hnn_database_recovery_state.result }}, retired={{ hnn_database_recovery_state.retired_members }})"
      ansible.builtin.assert:
        that:
          - hnn_database_recovery_state.result in ['unchanged', 'migration-required']
          - >-
            (hnn_database_recovery_state.result == 'unchanged' and
             hnn_database_recovery_state.retired_members == 0) or
            (hnn_database_recovery_state.result == 'migration-required' and
             hnn_database_recovery_state.retired_members == 4)
        fail_msg: Protected database recovery authority is outside the reviewed migration state

    - name: Retire the reviewed obsolete database authority entries
      when: hnn_database_recovery_state.result == 'migration-required'
      block:
        - name: Pause automatic database topology reconciliation
          ansible.builtin.systemd_service:
            name: heteronetwork-postgres-autopilot.service
            state: stopped

        - name: Apply the transactional protected authority recovery
          ansible.builtin.script:
            cmd: >-
              {{ hnn_repo_root }}/scripts/recover-database-authority.py
              --bundle {{ hnn_database_bundle }}
              --archive {{ hnn_database_archive }}
              --backup-dir {{ hnn_database_authority_backup }}
              --apply
            executable: /usr/bin/python3
          register: hnn_database_recovery_apply
          changed_when: (hnn_database_recovery_apply.stdout | from_json).result == 'changed'
          no_log: true
      always:
        - name: Resume automatic database topology reconciliation
          ansible.builtin.systemd_service:
            name: heteronetwork-postgres-autopilot.service
            state: started
            enabled: true

    - name: Verify the recovered database authority without exposing it
      ansible.builtin.script:
        cmd: >-
          {{ hnn_repo_root }}/scripts/recover-database-authority.py
          --bundle {{ hnn_database_bundle }}
          --archive {{ hnn_database_archive }}
          --backup-dir {{ hnn_database_authority_backup }}
        executable: /usr/bin/python3
      register: hnn_database_recovery_acceptance
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the protected authority to contain only db-b and db-e
      ansible.builtin.assert:
        that:
          - (hnn_database_recovery_acceptance.stdout | from_json).result == 'unchanged'
          - (hnn_database_recovery_acceptance.stdout | from_json).retired_members == 0
        fail_msg: Protected database authority did not converge to the recovered topology

    - name: Publish the current least-privilege proxy credential bundle
      ansible.builtin.script:
        cmd: >-
          {{ hnn_repo_root }}/scripts/recover-database-authority.py
          --bundle {{ hnn_database_bundle }}
          --archive {{ hnn_database_archive }}
          --backup-dir {{ hnn_database_authority_backup }}
          --proxy-archive {{ hnn_database_proxy_archive }}
          --apply
        executable: /usr/bin/python3
      register: hnn_database_proxy_publication
      changed_when: (hnn_database_proxy_publication.stdout | from_json).proxy_bundle == 'changed'
      no_log: true

    - name: Require the current proxy credential bundle
      ansible.builtin.assert:
        that:
          - (hnn_database_proxy_publication.stdout | from_json).result == 'unchanged'
          - (hnn_database_proxy_publication.stdout | from_json).retired_members == 0
          - (hnn_database_proxy_publication.stdout | from_json).proxy_bundle in ['changed', 'unchanged']
        fail_msg: Current database proxy credential bundle was not published

- name: Maintain the recovered PostgreSQL HA topology
  hosts: postgres_members:postgres_dcs_only
  gather_facts: false
  become: true
  serial: 1
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
    hnn_database_state: /var/backups/heteronetwork/iac-database-ha
    hnn_database_bundle: /etc/heteronetwork/postgres-autopilot/bundle
  tasks:
    - name: Create protected database reconciliation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ hnn_database_state }}"
        - "{{ hnn_database_state }}/dcs-bundle"
        - "{{ hnn_database_state }}/dcs-bundle/ca"
        - "{{ hnn_database_state }}/dcs-bundle/nodes"
        - "{{ hnn_database_state }}/dcs-bundle/nodes/{{ postgres_name }}"

    - name: Install the versioned PostgreSQL HA helper
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/scripts/postgres-ha-node.sh"
        dest: /opt/heteronetwork/libexec/postgres-ha-node.sh
        owner: root
        group: root
        mode: '0755'
      register: hnn_database_helper

    - name: Inspect PostgreSQL member service state
      ansible.builtin.stat:
        path: /etc/systemd/system/heteronetwork-db.service
      register: hnn_database_member_unit

    - name: Inspect DCS voter service state
      ansible.builtin.stat:
        path: /etc/systemd/system/heteronetwork-db-dcs.service
      register: hnn_database_dcs_unit

    - name: Read the protected member bundle from the recovery authority
      ansible.builtin.slurp:
        src: /etc/heteronetwork/postgres-autopilot/bundle.tar.gz
      delegate_to: uc-k8sp5
      register: hnn_database_member_bundle_source
      no_log: true
      check_mode: false
      when: postgres_role == 'member'

    - name: Transfer the protected member bundle
      ansible.builtin.copy:
        content: "{{ hnn_database_member_bundle_source.content | b64decode }}"
        dest: "{{ hnn_database_state }}/bundle.tar.gz"
        owner: root
        group: root
        mode: '0600'
      register: hnn_database_member_bundle
      no_log: true
      when: postgres_role == 'member'

    - name: Create the full member bundle directory
      ansible.builtin.file:
        path: "{{ hnn_database_bundle }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: postgres_role == 'member'

    - name: Expand the reviewed member bundle
      ansible.builtin.unarchive:
        src: "{{ hnn_database_state }}/bundle.tar.gz"
        dest: "{{ hnn_database_bundle }}"
        remote_src: true
        owner: root
        group: root
      no_log: true
      when:
        - postgres_role == 'member'
        - not ansible_check_mode
        - hnn_database_member_bundle.changed or not hnn_database_member_unit.stat.exists

    - name: Remove an obsolete client-only bundle marker
      ansible.builtin.file:
        path: "{{ hnn_database_bundle }}/.proxy-only"
        state: absent
      when: postgres_role == 'member'

    - name: Render the declared primary proxy configuration
      ansible.builtin.shell: |
        set -a
        source "{{ hnn_database_bundle }}/manifest.env"
        set +a
        export HETERONETWORK_DB_BUNDLE_DIR="{{ hnn_database_bundle }}"
        export HETERONETWORK_DB_NODE_NAME="{{ postgres_name }}"
        export HETERONETWORK_DB_NODE_ADDRESS="{{ tailscale_ip }}"
        export HETERONETWORK_DB_INTERFACE=tailscale0
        export HETERONETWORK_DB_CLIENT_LISTEN_ADDRESS="{{ vpn_ip }}"
        export HETERONETWORK_DB_PROXY_LISTEN_ADDRESS="{{ vpn_ip }}"
        /opt/heteronetwork/libexec/postgres-ha-node.sh render-proxy-config
      args:
        executable: /bin/bash
      register: hnn_database_declared_proxy
      changed_when: false
      no_log: true
      when: postgres_role == 'member'

    - name: Read the active primary proxy configuration
      ansible.builtin.slurp:
        src: /etc/heteronetwork/postgres-ha/haproxy.cfg
      register: hnn_database_active_proxy
      no_log: true
      failed_when: false
      when: postgres_role == 'member'

    - name: Detect database proxy topology drift
      ansible.builtin.set_fact:
        hnn_database_proxy_drift: >-
          {{ not (hnn_database_active_proxy.content is defined) or
             (hnn_database_active_proxy.content | b64decode) !=
             (hnn_database_declared_proxy.stdout ~ '\n') }}
      no_log: true
      when: postgres_role == 'member'

    - name: Select DCS credentials needed by this voter
      ansible.builtin.set_fact:
        hnn_database_dcs_files:
          - {src: manifest.env, mode: '0600'}
          - {src: ca/ca.crt, mode: '0644'}
          - {src: "nodes/{{ postgres_name }}/ca.crt", mode: '0644'}
          - {src: "nodes/{{ postgres_name }}/node.crt", mode: '0644'}
          - {src: "nodes/{{ postgres_name }}/node.key", mode: '0600'}
      when: postgres_role == 'dcs-only'

    - name: Read protected DCS credentials from the recovery authority
      ansible.builtin.slurp:
        src: "/etc/heteronetwork/postgres-autopilot/bundle/{{ item.src }}"
      loop: "{{ hnn_database_dcs_files | default([]) }}"
      delegate_to: uc-k8sp5
      register: hnn_database_dcs_source
      no_log: true
      check_mode: false
      when: postgres_role == 'dcs-only'

    - name: Transfer only this voter's protected DCS credentials
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "{{ hnn_database_state }}/dcs-bundle/{{ item.item.src }}"
        owner: root
        group: root
        mode: "{{ item.item.mode }}"
      loop: "{{ hnn_database_dcs_source.results | default([]) }}"
      register: hnn_database_dcs_bundle
      no_log: true
      when: postgres_role == 'dcs-only'

    - name: Reconcile the declared PostgreSQL or DCS role
      ansible.builtin.shell: |
        set -a
        if [[ "{{ postgres_role }}" == member ]]; then
          source "{{ hnn_database_bundle }}/manifest.env"
          export HETERONETWORK_DB_BUNDLE_DIR="{{ hnn_database_bundle }}"
          export HETERONETWORK_DB_CLIENT_LISTEN_ADDRESS="{{ vpn_ip }}"
          export HETERONETWORK_DB_PROXY_LISTEN_ADDRESS="{{ vpn_ip }}"
        else
          source "{{ hnn_database_state }}/dcs-bundle/manifest.env"
          export HETERONETWORK_DB_BUNDLE_DIR="{{ hnn_database_state }}/dcs-bundle"
        fi
        set +a
        export HETERONETWORK_DB_NODE_NAME="{{ postgres_name }}"
        export HETERONETWORK_DB_NODE_ADDRESS="{{ tailscale_ip }}"
        export HETERONETWORK_DB_INTERFACE=tailscale0
        export HETERONETWORK_DB_DCS_INITIAL_CLUSTER_STATE=existing
        if [[ "{{ postgres_role }}" == member ]]; then
          /opt/heteronetwork/libexec/postgres-ha-node.sh reconfigure-node
        else
          /opt/heteronetwork/libexec/postgres-ha-node.sh install-dcs-only
        fi
      args:
        executable: /bin/bash
      register: hnn_database_reconcile
      changed_when: true
      no_log: true
      when: >-
        not ansible_check_mode and (
          hnn_database_helper.changed or
          (postgres_role == 'member' and (
            hnn_database_member_bundle.changed or
            not hnn_database_member_unit.stat.exists or
            hnn_database_proxy_drift | default(true) | bool
          )) or
          (postgres_role == 'dcs-only' and (
            hnn_database_dcs_bundle.results | default([]) |
            selectattr('changed') | list | length > 0 or
            not hnn_database_dcs_unit.stat.exists
          ))
        )

    - name: Restart a reconfigured DCS voter one at a time
      ansible.builtin.systemd_service:
        name: heteronetwork-db-dcs.service
        state: restarted
        enabled: true
        daemon_reload: true
      when: hnn_database_reconcile.changed | default(false)

    - name: Require the declared DCS voter to be healthy
      ansible.builtin.command:
        argv:
          - /opt/heteronetwork/postgres-ha/etcdctl
          - "--endpoints=https://{{ tailscale_ip }}:12379"
          - --dial-timeout=3s
          - --command-timeout=10s
          - --cacert=/etc/heteronetwork/postgres-ha/pki/ca.crt
          - --cert=/etc/heteronetwork/postgres-ha/pki/node.crt
          - --key=/etc/heteronetwork/postgres-ha/pki/node.key
          - endpoint
          - health
      changed_when: false
      check_mode: false

    - name: Require the declared PostgreSQL member services
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - heteronetwork-db.service
          - heteronetwork-db-proxy.service
      changed_when: false
      check_mode: false
      when: postgres_role == 'member'

- name: Demote the retired enrollment database member to a proxy-only client
  hosts: enrollment_issuer
  gather_facts: false
  become: true
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
    hnn_database_bundle: /etc/heteronetwork/postgres-autopilot/bundle
    hnn_database_member_archive: /etc/heteronetwork/postgres-autopilot/bundle.tar.gz
    hnn_database_proxy_archive: /etc/heteronetwork/postgres-autopilot/proxy-bundle.tar.gz
    hnn_database_proxy_recovery: /var/backups/heteronetwork/iac-database-ha/proxy-client
  tasks:
    - name: Require the declared enrollment proxy address
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'ichikawap1'
          - vpn_ip == '10.250.0.10'

    - name: Create the protected proxy-client directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ hnn_database_proxy_recovery }}"
        - /var/backups/heteronetwork/iac-standard

    - name: Install the reviewed proxy-client recovery helpers
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - src: "{{ hnn_repo_root }}/scripts/recover-database-proxy-client.py"
          dest: /opt/heteronetwork/libexec/recover-database-proxy-client.py
        - src: "{{ hnn_repo_root }}/scripts/postgres-ha-node.sh"
          dest: /opt/heteronetwork/libexec/postgres-ha-node.sh
        - src: "{{ hnn_repo_root }}/deploy/terraform/master-only/ansible/standard-proxy.py"
          dest: /opt/heteronetwork/libexec/standard-proxy.py

    - name: Read the sanitized proxy bundle from the recovery authority
      ansible.builtin.slurp:
        src: /etc/heteronetwork/postgres-autopilot/proxy-bundle.tar.gz
      delegate_to: uc-k8sp5
      register: hnn_database_proxy_source
      no_log: true
      check_mode: false

    - name: Transfer only the proxy-client database credential bundle
      ansible.builtin.copy:
        content: "{{ hnn_database_proxy_source.content | b64decode }}"
        dest: "{{ hnn_database_proxy_recovery }}/proxy-bundle.tar.gz"
        owner: root
        group: root
        mode: '0600'
      register: hnn_database_proxy_transfer
      no_log: true

    - name: Audit the retired database member without exposing credentials
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /opt/heteronetwork/libexec/recover-database-proxy-client.py
          - --bundle
          - "{{ hnn_database_bundle }}"
          - --archive
          - "{{ hnn_database_proxy_recovery }}/proxy-bundle.tar.gz"
          - --agent-state
          - /var/lib/heteronetwork/agent.json
          - --backup-dir
          - "{{ hnn_database_proxy_recovery }}/backup"
          - --retired-archive
          - "{{ hnn_database_member_archive }}"
      register: hnn_database_proxy_audit
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Record the bounded proxy-client audit result
      ansible.builtin.set_fact:
        hnn_database_proxy_rejection: >-
          {{ ((hnn_database_proxy_audit.stderr | from_json).reason | default('unexpected-input'))
             if hnn_database_proxy_audit.rc != 0 else 'passed' }}

    - name: "Require the retired database audit to pass ({{ hnn_database_proxy_rejection }})"
      ansible.builtin.assert:
        that: hnn_database_proxy_audit.rc == 0
        fail_msg: Retired database credentials did not pass the bounded audit

    - name: Record the sanitized proxy-client recovery state
      ansible.builtin.set_fact:
        hnn_database_proxy_state: "{{ hnn_database_proxy_audit.stdout | from_json }}"
      no_log: true

    - name: Require a reviewed proxy-client recovery state
      ansible.builtin.assert:
        that:
          - hnn_database_proxy_state.result in ['unchanged', 'migration-required']
          - hnn_database_proxy_state.mode in ['retired-member', 'proxy-only', 'missing']
          - hnn_database_proxy_state.members == ['db-b', 'db-e']
        fail_msg: Enrollment database client is outside the reviewed recovery state

    - name: Reconcile the retired database member as a proxy-only client
      block:
        - name: Pause enrollment database and control-plane reconciliation
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
          loop:
            - heteronetwork-control-plane.service
            - heteronetwork-postgres-autopilot.service
          when: hnn_database_proxy_state.result == 'migration-required'

        - name: Stop retired database member services
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            state: stopped
            enabled: false
          loop:
            - heteronetwork-db.service
            - heteronetwork-db-dcs.service
            - heteronetwork-db-underlay-health.service
          failed_when: false
          when: hnn_database_proxy_state.result == 'migration-required'

        - name: Apply the transactional proxy-client recovery
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - /opt/heteronetwork/libexec/recover-database-proxy-client.py
              - --bundle
              - "{{ hnn_database_bundle }}"
              - --archive
              - "{{ hnn_database_proxy_recovery }}/proxy-bundle.tar.gz"
              - --agent-state
              - /var/lib/heteronetwork/agent.json
              - --backup-dir
              - "{{ hnn_database_proxy_recovery }}/backup"
              - --retired-archive
              - "{{ hnn_database_member_archive }}"
              - --apply
          register: hnn_database_proxy_apply
          changed_when: (hnn_database_proxy_apply.stdout | from_json).result == 'changed'
          no_log: true
          when: hnn_database_proxy_state.result == 'migration-required'

        - name: Retain the current proxy bundle for automatic reconciliation
          ansible.builtin.copy:
            src: "{{ hnn_database_proxy_recovery }}/proxy-bundle.tar.gz"
            remote_src: true
            dest: "{{ hnn_database_proxy_archive }}"
            owner: root
            group: root
            mode: '0600'
          no_log: true

        - name: Reconcile the enrollment database client proxy
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - /opt/heteronetwork/libexec/standard-proxy.py
              - --ip
              - "{{ vpn_ip }}"
          register: hnn_database_proxy_install
          changed_when: (hnn_database_proxy_install.stdout | from_json).changed
          no_log: true

        - name: Keep the enrollment database client proxy running
          ansible.builtin.systemd_service:
            name: heteronetwork-db-proxy.service
            state: started
            enabled: true

        - name: Verify the enrollment proxy configuration is converged
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - /opt/heteronetwork/libexec/standard-proxy.py
              - --ip
              - "{{ vpn_ip }}"
              - --check
          register: hnn_database_proxy_check
          changed_when: false
          failed_when: (hnn_database_proxy_check.stdout | from_json).changed
          no_log: true

        - name: Audit the installed proxy-only credential bundle
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - /opt/heteronetwork/libexec/recover-database-proxy-client.py
              - --bundle
              - "{{ hnn_database_bundle }}"
              - --archive
              - "{{ hnn_database_proxy_recovery }}/proxy-bundle.tar.gz"
              - --agent-state
              - /var/lib/heteronetwork/agent.json
              - --backup-dir
              - "{{ hnn_database_proxy_recovery }}/backup"
              - --retired-archive
              - "{{ hnn_database_member_archive }}"
          register: hnn_database_proxy_acceptance
          changed_when: false
          check_mode: false

        - name: Require the installed proxy-only credentials to be current
          ansible.builtin.assert:
            that:
              - (hnn_database_proxy_acceptance.stdout | from_json).result == 'unchanged'
              - (hnn_database_proxy_acceptance.stdout | from_json).mode == 'proxy-only'
              - (hnn_database_proxy_acceptance.stdout | from_json).members == ['db-b', 'db-e']
            fail_msg: Enrollment database proxy credentials did not converge
      always:
        - name: Resume enrollment database topology reconciliation
          ansible.builtin.systemd_service:
            name: heteronetwork-postgres-autopilot.service
            state: started
            enabled: true
          when: hnn_database_proxy_state.result == 'migration-required'

    - name: Start the enrollment control plane with the recovered database client
      ansible.builtin.systemd_service:
        name: heteronetwork-control-plane.service
        state: started
      when: not ansible_check_mode

    - name: Require the enrollment control plane to use the recovered proxy
      ansible.builtin.uri:
        url: 'http://{{ vpn_ip }}:19088/healthz'
        status_code: 200
        timeout: 3
      register: hnn_database_enrollment_control_plane
      until: hnn_database_enrollment_control_plane.status | default(0) == 200
      retries: 30
      delay: 2
      when: not ansible_check_mode

- name: Verify the recovered topology and restore the enrollment control plane
  hosts: bootstrap
  gather_facts: false
  become: true
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
    hnn_database_bundle: /etc/heteronetwork/postgres-autopilot/bundle
  tasks:
    - name: Require the declared bootstrap database identity
      ansible.builtin.assert:
        that:
          - postgres_role == 'member'
          - postgres_name == 'db-b'
          - tailscale_ip == '100.96.127.54'

    - name: Verify DCS quorum, primary selection, replication, and synchronous writes
      ansible.builtin.shell: |
        set -a
        source "{{ hnn_database_bundle }}/manifest.env"
        set +a
        export HETERONETWORK_DB_BUNDLE_DIR="{{ hnn_database_bundle }}"
        export HETERONETWORK_DB_NODE_NAME="{{ postgres_name }}"
        export HETERONETWORK_DB_NODE_ADDRESS="{{ tailscale_ip }}"
        export HETERONETWORK_DB_INTERFACE=tailscale0
        export HETERONETWORK_DB_CLIENT_LISTEN_ADDRESS="{{ vpn_ip }}"
        export HETERONETWORK_DB_PROXY_LISTEN_ADDRESS="{{ vpn_ip }}"
        /opt/heteronetwork/libexec/postgres-ha-node.sh verify
      args:
        executable: /bin/bash
      register: hnn_database_acceptance
      changed_when: false
      check_mode: false
      no_log: true

    - name: Require the complete database acceptance result
      ansible.builtin.assert:
        that:
          - "'HA verification passed:' in hnn_database_acceptance.stdout"
        fail_msg: Recovered PostgreSQL topology did not pass its full acceptance check

    - name: Restart enrollment control plane against the reconciled primary proxy
      ansible.builtin.systemd_service:
        name: heteronetwork-control-plane.service
        state: restarted
      when: not ansible_check_mode

    - name: Require the enrollment control plane to finish database startup
      ansible.builtin.uri:
        url: 'http://{{ vpn_ip }}:19088/healthz'
        status_code: 200
        timeout: 5
      register: hnn_database_control_plane
      until: hnn_database_control_plane.status | default(0) == 200
      retries: 60
      delay: 5
      when: not ansible_check_mode

    - name: Require automatic Keycloak placement to recover on the bootstrap edge
      ansible.builtin.uri:
        url: 'http://{{ vpn_ip }}:18079/realms/heterocloud/.well-known/openid-configuration'
        status_code: 200
        timeout: 5
      register: hnn_database_keycloak_edge
      until: hnn_database_keycloak_edge.status | default(0) == 200
      retries: 60
      delay: 5
      when: not ansible_check_mode
