- name: Prepare an SSH identity limited to reading host inventory
  hosts: bootstrap
  gather_facts: false
  become: true
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
  tasks:
    - name: Create a protected inventory identity directory
      ansible.builtin.file:
        path: /etc/heteronetwork/security
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Generate an inventory-only key without exporting it
      ansible.builtin.command:
        argv: [ssh-keygen, -t, ed25519, -N, '', -C, heteronetwork-security-inventory, -f, /etc/heteronetwork/security/inventory.key]
        creates: /etc/heteronetwork/security/inventory.key
      no_log: true
    - name: Read only the public inventory identity
      ansible.builtin.command: cat /etc/heteronetwork/security/inventory.key.pub
      register: hnn_inventory_public_key
      changed_when: false
    - name: Generate a separate read-only runtime acceptance identity
      ansible.builtin.command:
        argv: [ssh-keygen, -t, ed25519, -N, '', -C, heteronetwork-security-snapshot, -f, /etc/heteronetwork/security/snapshot.key]
        creates: /etc/heteronetwork/security/snapshot.key
      no_log: true
    - name: Read only the public acceptance identity
      ansible.builtin.command: cat /etc/heteronetwork/security/snapshot.key.pub
      register: hnn_snapshot_public_key
      changed_when: false

- name: Install host OSS/CVE collection without changing workloads
  hosts: all
  gather_facts: false
  become: true
  serial: 2
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
    hnn_security_root: /opt/heteronetwork/security
    hnn_security_policy: "{{ lookup('file', hnn_repo_root + '/deploy/security/policy.json') | from_json }}"
  tasks:
    - name: Find the inventory account home
      ansible.builtin.getent:
        database: passwd
        key: mizuame
    - name: Authorize only the forced inventory read command
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts.getent_passwd.mizuame[4] }}/.ssh/authorized_keys"
        regexp: '.* heteronetwork-security-inventory$'
        line: 'restrict,command="/bin/cat /var/lib/heteronetwork-security/host-report.json" {{ hostvars[groups["bootstrap"][0]].hnn_inventory_public_key.stdout }}'
        create: false
    - name: Create protected scanner directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ hnn_security_root }}"
        - /var/cache/heteronetwork-security
    - name: Create inventory directory readable by the inventory SSH account
      ansible.builtin.file:
        path: /var/lib/heteronetwork-security
        state: directory
        owner: root
        group: mizuame
        mode: '0750'
    - name: Fetch checksum-pinned scanner archive
      ansible.builtin.get_url:
        url: "https://github.com/aquasecurity/trivy/releases/download/v{{ hnn_security_policy.trivy.version }}/trivy_{{ hnn_security_policy.trivy.version }}_Linux-64bit.tar.gz"
        checksum: "sha256:{{ hnn_security_policy.trivy.linux_amd64_archive_sha256 }}"
        dest: "{{ hnn_security_root }}/trivy.tar.gz"
        mode: '0644'
    - name: Extract only the scanner executable
      ansible.builtin.unarchive:
        src: "{{ hnn_security_root }}/trivy.tar.gz"
        dest: "{{ hnn_security_root }}"
        remote_src: true
        include: [trivy]
        owner: root
        group: root
        mode: '0755'
    - name: Install root-owned read-only inventory code
      tags: [security_code]
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/scripts/{{ item }}"
        dest: "{{ hnn_security_root }}/{{ item }}"
        owner: root
        group: root
        mode: '0755'
      loop: [security_inventory.py, security_host_inventory.py, security_refresh_repositories.py, security_update_gate.py, security_runtime_snapshot.py, security_candidate_baseline.py]
    - name: Authorize only the forced runtime snapshot command
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts.getent_passwd.mizuame[4] }}/.ssh/authorized_keys"
        regexp: '.* heteronetwork-security-snapshot$'
        line: 'restrict,command="/usr/bin/sudo -n /opt/heteronetwork/security/security_runtime_snapshot.py" {{ hostvars[groups["bootstrap"][0]].hnn_snapshot_public_key.stdout }}'
        create: false
    - name: Permit only the argument-free read-only observer
      ansible.builtin.copy:
        dest: /etc/sudoers.d/heteronetwork-security-observer
        content: |
          mizuame ALL=(root) NOPASSWD: /opt/heteronetwork/security/security_runtime_snapshot.py ""
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
    - name: Install the declared update policy
      tags: [security_code]
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/deploy/security/policy.json"
        dest: "{{ hnn_security_root }}/policy.json"
        owner: root
        group: root
        mode: '0644'
    - name: Install host collection service and timer
      ansible.builtin.template:
        src: "{{ hnn_repo_root }}/deploy/security/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: [heteronetwork-security-host.service, heteronetwork-security-host.timer]
    - name: Enable recurring host inventory
      ansible.builtin.systemd_service:
        name: heteronetwork-security-host.timer
        enabled: true
        state: started
        daemon_reload: true
    - name: Start the first host collection asynchronously
      ansible.builtin.command: systemctl restart --no-block heteronetwork-security-host.service
      changed_when: false
    - name: Remove the superseded per-host vulnerability database
      ansible.builtin.file:
        path: /var/cache/heteronetwork-security/db
        state: absent

- name: Provision the continuous fleet security inventory
  hosts: bootstrap
  gather_facts: false
  become: true
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
  tasks:
    - name: Create the private operator directory
      ansible.builtin.file:
        path: /etc/heteronetwork/security
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Remove the superseded general operator key copy
      ansible.builtin.file:
        path: /etc/heteronetwork/security/operator.key
        state: absent
    - name: Install trusted host identities
      ansible.builtin.copy:
        src: "{{ hnn_work_dir }}/known_hosts"
        dest: /etc/heteronetwork/security/known_hosts
        owner: root
        group: root
        mode: '0600'
    - name: Declare the complete fleet inventory
      ansible.builtin.copy:
        content: "{{ groups['all'] | map('extract', hostvars) | map(attribute='inventory_hostname') | list | to_json }}"
        dest: /etc/heteronetwork/security/node-names.json
        mode: '0600'
    - name: Render SSH inventory endpoints
      ansible.builtin.copy:
        content: >-
          [{% for name in groups['all'] %}{"name":{{ name | to_json }},"ssh_host":{{ hostvars[name].ansible_host | to_json }}}{% if not loop.last %},{% endif %}{% endfor %}]
        dest: /etc/heteronetwork/security/hosts.json
        owner: root
        group: root
        mode: '0600'
    - name: Install recurring scan and VPN-only aggregate metrics
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/deploy/security/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop: [heteronetwork-security-scan.service, heteronetwork-security-scan.timer, heteronetwork-security-metrics.service]
    - name: Install signed candidate reconciliation code
      tags: [security_code]
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/scripts/security_promote.py"
        dest: /opt/heteronetwork/security/security_promote.py
        owner: root
        group: root
        mode: '0755'
    - name: Fetch the checksum-pinned attestation verifier
      ansible.builtin.get_url:
        url: https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
        checksum: sha256:bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
        dest: /opt/heteronetwork/security/gh.tar.gz
        mode: '0644'
    - name: Extract only the verification CLI
      ansible.builtin.unarchive:
        src: /opt/heteronetwork/security/gh.tar.gz
        dest: /opt/heteronetwork/security
        remote_src: true
        include: [gh_2.102.0_linux_amd64/bin/gh]
        owner: root
        group: root
    - name: Install the protected verifier executable
      ansible.builtin.copy:
        src: /opt/heteronetwork/security/gh_2.102.0_linux_amd64/bin/gh
        dest: /opt/heteronetwork/security/gh
        remote_src: true
        owner: root
        group: root
        mode: '0755'
    - name: Declare production security reconciliation targets and health checks
      tags: [security_code]
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/deploy/security/promotion-heteronet.json"
        dest: /opt/heteronetwork/security/promotion.json
        owner: root
        group: root
        mode: '0644'
    - name: Install serial production security reconciliation
      tags: [security_code]
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/deploy/security/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: [heteronetwork-security-promote.service, heteronetwork-security-promote.timer]
    - name: Enable periodic signed candidate reconciliation
      tags: [security_code]
      ansible.builtin.systemd_service:
        name: heteronetwork-security-promote.timer
        enabled: true
        state: started
        daemon_reload: true
    - name: Enable inventory and aggregate metrics
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: "{{ 'restarted' if item == 'heteronetwork-security-metrics.service' else 'started' }}"
        daemon_reload: true
      loop: [heteronetwork-security-scan.timer, heteronetwork-security-metrics.service]
    - name: Start the first deployed image/source inventory
      ansible.builtin.command: systemctl restart --no-block heteronetwork-security-scan.service
      changed_when: false
