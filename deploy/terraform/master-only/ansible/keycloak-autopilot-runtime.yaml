- name: Reconcile the Keycloak placement agent without restarting workloads
  hosts: bootstrap:enrollment_issuer:standard
  gather_facts: false
  become: true
  serial: 1
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
  tasks:
    - name: Install the validated placement reconciler
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/scripts/keycloak-autopilot.sh"
        dest: /opt/heteronetwork/libexec/keycloak-autopilot.sh
        owner: root
        group: root
        mode: '0755'
        validate: /bin/bash -n %s

    # An old client-only marker can survive promotion to a PostgreSQL member.
    # Never remove it unless the entire local authority bundle is current and
    # validates: the database autopilot interprets an unmarked bundle as full.
    - name: Inspect the legacy proxy marker
      ansible.builtin.stat:
        path: /etc/heteronetwork/postgres-autopilot/bundle/.proxy-only
        follow: false
      register: keycloak_proxy_marker
      when: postgres_role | default('') == 'member'

    - name: Verify promoted database member before clearing a stale marker
      when:
        - postgres_role | default('') == 'member'
        - keycloak_proxy_marker.stat.exists | default(false)
      vars:
        keycloak_authority_files:
          - manifest.env
          - cluster-id
          - ca/ca.crt
          - secrets/superuser.password
          - secrets/replication.password
          - secrets/rewind.password
          - secrets/application.password
          - secrets/rest-api.password
          - secrets/keycloak.password
          - secrets/keycloak-bootstrap-admin.password
      block:
        - name: Require a root-owned regular marker
          ansible.builtin.assert:
            that:
              - keycloak_proxy_marker.stat.isreg | default(false)
              - not (keycloak_proxy_marker.stat.islnk | default(true))
              - keycloak_proxy_marker.stat.uid == 0
        - name: Inspect the authoritative protected bundle
          ansible.builtin.stat:
            path: "/etc/heteronetwork/postgres-autopilot/bundle/{{ item }}"
            checksum_algorithm: sha256
            follow: false
          loop: "{{ keycloak_authority_files }}"
          delegate_to: uc-k8sp5
          register: keycloak_authority
          no_log: true
        - name: Inspect the local protected bundle
          ansible.builtin.stat:
            path: "/etc/heteronetwork/postgres-autopilot/bundle/{{ item }}"
            checksum_algorithm: sha256
            follow: false
          loop: "{{ keycloak_authority_files }}"
          register: keycloak_local_bundle
          no_log: true
        - name: Require the member bundle to match the current authority
          ansible.builtin.assert:
            that:
              - keycloak_authority.results | selectattr('stat.isreg', 'defined') | selectattr('stat.isreg') | list | length == keycloak_authority_files | length
              - keycloak_local_bundle.results | selectattr('stat.isreg', 'defined') | selectattr('stat.isreg') | list | length == keycloak_authority_files | length
              - keycloak_authority.results | map(attribute='stat.checksum') | list == keycloak_local_bundle.results | map(attribute='stat.checksum') | list
            fail_msg: Local database member authority does not match the protected source
          no_log: true
        - name: Validate full member certificates and local database services
          ansible.builtin.shell: |
            set -Eeuo pipefail
            systemctl is-active --quiet heteronetwork-db.service
            systemctl is-active --quiet heteronetwork-db-proxy.service
            set -a
            source /etc/heteronetwork/postgres-autopilot/bundle/manifest.env
            set +a
            export HETERONETWORK_DB_BUNDLE_DIR=/etc/heteronetwork/postgres-autopilot/bundle
            export HETERONETWORK_DB_NODE_NAME="{{ postgres_name }}"
            export HETERONETWORK_DB_NODE_ADDRESS="{{ tailscale_ip }}"
            export HETERONETWORK_DB_INTERFACE=tailscale0
            export HETERONETWORK_DB_DCS_INITIAL_CLUSTER_STATE=existing
            /opt/heteronetwork/libexec/postgres-ha-node.sh validate-bundle "$HETERONETWORK_DB_BUNDLE_DIR"
          args:
            executable: /bin/bash
          changed_when: false
          check_mode: false
          no_log: true
        - name: Remove the verified obsolete member marker
          ansible.builtin.file:
            path: /etc/heteronetwork/postgres-autopilot/bundle/.proxy-only
            state: absent
