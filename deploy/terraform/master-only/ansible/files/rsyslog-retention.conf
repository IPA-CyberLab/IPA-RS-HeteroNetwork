# Managed by HeteroNetwork Terraform/Ansible.
/var/log/syslog
/var/log/mail.log
/var/log/kern.log
/var/log/auth.log
/var/log/user.log
/var/log/cron.log
{
    su root adm
    daily
    maxsize 256M
    rotate 120
    maxage 28
    missingok
    notifempty
    compress
    create
    sharedscripts
    postrotate
        /usr/lib/rsyslog/rsyslog-rotate
    endscript
}
