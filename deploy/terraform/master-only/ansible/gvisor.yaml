- name: Configure and verify Flash CPU runtimes on workload workers
  hosts: standard:bootstrap
  gather_facts: true
  become: true
  serial: 1
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
    hnn_gvisor_version: '20261005.0'
    hnn_gvisor_source_commit: 23fccb36f18343bccad297d9a52455edd81999b3
    hnn_gvisor_install_sha256: 6ddb1921db7d152c40d964de2435b68d6dde3ddde8ff2dd2218b75665aa06737
    hnn_gvisor_check_sha256: 74069ea8a27ff355e542230c08678e0f995a0d44892a3ec836a8b9a31742c06e
  tasks:
    - name: Require a supported workload worker
      ansible.builtin.assert:
        that:
          - inventory_hostname not in groups['master_only']
          - ansible_distribution == 'Ubuntu'
          - ansible_architecture == 'x86_64'
          - ansible_kernel is version('5.6', '>=')
        fail_msg: Dedicated masters and unsupported hosts cannot run Flash workloads

    - name: Verify that containerd leaves existing shims running on a restart
      ansible.builtin.command: systemctl show containerd.service --property=KillMode --value
      register: hnn_gvisor_kill_mode
      changed_when: false
      check_mode: false

    - name: Require a process-only containerd service
      ansible.builtin.assert:
        that: hnn_gvisor_kill_mode.stdout == 'process'
        fail_msg: The containerd service must preserve existing workload processes

    - name: Create the managed runtime installer directory
      ansible.builtin.file:
        path: /opt/heteronetwork/libexec/flash
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Fetch the immutable verified runtime installer
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/IPA-CyberLab/IPA-RS-HeteroCloud-Flash/{{ hnn_gvisor_source_commit }}/scripts/install-gvisor.sh"
        dest: /opt/heteronetwork/libexec/flash/install-gvisor.sh
        checksum: "sha256:{{ hnn_gvisor_install_sha256 }}"
        owner: root
        group: root
        mode: '0755'

    - name: Fetch the immutable verified runtime checker
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/IPA-CyberLab/IPA-RS-HeteroCloud-Flash/{{ hnn_gvisor_source_commit }}/scripts/check-gvisor.sh"
        dest: /opt/heteronetwork/libexec/flash/check-gvisor.sh
        checksum: "sha256:{{ hnn_gvisor_check_sha256 }}"
        owner: root
        group: root
        mode: '0755'

    - name: Read current kubelet resource reservations
      ansible.builtin.slurp:
        src: /var/lib/kubelet/config.yaml
      register: hnn_gvisor_kubelet_file
      no_log: true

    - name: Preserve explicit reservations and reserve memory for host services
      ansible.builtin.set_fact:
        hnn_gvisor_kubelet_config: "{{ hnn_gvisor_kubelet_file.content | b64decode | from_yaml }}"
      no_log: true

    - name: Configure default memory reservations for native and Kubernetes services
      ansible.builtin.copy:
        content: >-
          {{ hnn_gvisor_kubelet_config | combine({
            'systemReserved': (hnn_gvisor_kubelet_config.systemReserved | default({}, true)) | combine({
              'memory': (hnn_gvisor_kubelet_config.systemReserved | default({}, true)).memory | default('3Gi')
            }),
            'kubeReserved': (hnn_gvisor_kubelet_config.kubeReserved | default({}, true)) | combine({
              'memory': (hnn_gvisor_kubelet_config.kubeReserved | default({}, true)).memory | default('1Gi')
            })
          }) | to_nice_yaml }}
        dest: /var/lib/kubelet/config.yaml
        owner: root
        group: root
        mode: '0644'
        backup: true
      notify: Reload kubelet resource reservations
      no_log: true

    - name: Upgrade generated worker command-line reservations that override the config file
      ansible.builtin.replace:
        path: /etc/default/kubelet
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
        backup: true
      loop:
        - regexp: '--system-reserved=cpu=500m,memory=512Mi(?=["\s]|$)'
          replace: '--system-reserved=cpu=500m,memory=3Gi'
        - regexp: '--kube-reserved=cpu=500m,memory=512Mi(?=["\s]|$)'
          replace: '--kube-reserved=cpu=500m,memory=1Gi'
      notify: Reload kubelet resource reservations
      no_log: true

    - name: Apply memory reservations before admitting workloads
      ansible.builtin.meta: flush_handlers

    - name: Capture ready application containers before runtime configuration
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - pods
          - --all-namespaces
          - "--field-selector=spec.nodeName={{ inventory_hostname }}"
          - '-o=jsonpath={range .items[*]}{range .status.containerStatuses[?(@.ready==true)]}{.containerID}{"\n"}{end}{end}'
      delegate_to: uc-k8sp5
      register: hnn_gvisor_existing_tasks
      changed_when: false
      check_mode: false

    - name: Install the pinned sandbox package and configure its containerd handler
      ansible.builtin.command: /bin/bash /opt/heteronetwork/libexec/flash/install-gvisor.sh
      environment:
        GVISOR_VERSION: "{{ hnn_gvisor_version }}"
      register: hnn_gvisor_install
      changed_when: "'restarted containerd because its configuration changed' in hnn_gvisor_install.stdout"
      when: not ansible_check_mode

    - name: Verify the installed runtime and effective containerd configuration
      ansible.builtin.command: /bin/bash /opt/heteronetwork/libexec/flash/check-gvisor.sh
      changed_when: false
      when: not ansible_check_mode

    - name: Verify ready application tasks remain running after runtime configuration
      ansible.builtin.shell: |
        set -Eeuo pipefail
        ctr --namespace k8s.io tasks list | awk 'NR > 1 && $3 == "RUNNING" {print $1}'
      args:
        executable: /bin/bash
      register: hnn_gvisor_current_tasks
      changed_when: false
      until: >-
        hnn_gvisor_existing_tasks.stdout_lines | map('regex_replace', '^containerd://', '') |
        difference(hnn_gvisor_current_tasks.stdout_lines) | length == 0
      retries: 5
      delay: 2
      when: not ansible_check_mode

    - name: Require existing container tasks to survive the runtime configuration
      ansible.builtin.assert:
        that: hnn_gvisor_existing_tasks.stdout_lines | map('regex_replace', '^containerd://', '') | difference(hnn_gvisor_current_tasks.stdout_lines) | length == 0
        fail_msg: An existing container task disappeared during runtime configuration
      when: not ansible_check_mode

    - name: Install the versioned sandbox acceptance probe on the Kubernetes operator
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/scripts/verify-gvisor-worker.py"
        dest: /opt/heteronetwork/libexec/verify-gvisor-worker.py
        owner: root
        group: root
        mode: '0755'
      delegate_to: uc-k8sp5

    - name: Advertise Flash capacity only after real sandbox execution succeeds
      ansible.builtin.command:
        argv:
          - python3
          - /opt/heteronetwork/libexec/verify-gvisor-worker.py
          - --kubeconfig=/etc/kubernetes/admin.conf
          - "--node={{ inventory_hostname }}"
      delegate_to: uc-k8sp5
      register: hnn_gvisor_acceptance
      changed_when: false
      when: not ansible_check_mode

  handlers:
    - name: Reload kubelet resource reservations
      ansible.builtin.systemd_service:
        name: kubelet.service
        state: restarted
