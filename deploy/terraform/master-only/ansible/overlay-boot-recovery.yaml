- name: Restore approved server bootstrap peers before the VPN agent starts
  hosts: master_only:bootstrap:enrollment_issuer:standard
  gather_facts: false
  become: true
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
  tasks:
    - name: Install the shared operator lifecycle policy reader
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/scripts/node_lifecycle.py"
        dest: /opt/heteronetwork/libexec/node_lifecycle.py
        owner: root
        group: root
        mode: '0644'

    - name: Install the shared database lifecycle reconciler
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/scripts/reconcile-node-lifecycle.py"
        dest: /opt/heteronetwork/libexec/reconcile-node-lifecycle.py
        owner: root
        group: root
        mode: '0755'

    - name: Install the bounded recovery state reconciler
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/scripts/reconcile-overlay-boot.py"
        dest: /opt/heteronetwork/libexec/reconcile-overlay-boot.py
        owner: root
        group: root
        mode: '0755'

    - name: Install the approved public recovery roster
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/deploy/terraform/master-only/overlay-boot-peers.json"
        dest: /etc/heteronetwork/overlay-boot-peers.json
        owner: root
        group: root
        mode: '0644'

    - name: Validate local identity and the proposed bootstrap map without changing the live agent
      ansible.builtin.command:
        argv: [python3, /opt/heteronetwork/libexec/reconcile-overlay-boot.py, --state, /var/lib/heteronetwork/agent.json, --roster, /etc/heteronetwork/overlay-boot-peers.json, --node, "{{ inventory_hostname }}", --check]
      changed_when: false

    - name: Apply operator stops to VPN visibility while retaining registrations
      ansible.builtin.command:
        argv:
          - python3
          - /opt/heteronetwork/libexec/reconcile-node-lifecycle.py
          - --roster
          - /etc/heteronetwork/overlay-boot-peers.json
          - --database-url-file
          - /run/credentials/heteronetwork-control-plane.service/database-url
      when: inventory_hostname == 'uc-k8sp5'
      changed_when: false

    - name: Create the agent dependency directory
      ansible.builtin.file:
        path: /etc/systemd/system/heteronetwork-agent.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Rebuild only recovery host routes before each agent boot
      ansible.builtin.copy:
        dest: /etc/systemd/system/heteronetwork-agent.service.d/92-overlay-boot-recovery.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          ExecStartPre=/usr/bin/python3 /opt/heteronetwork/libexec/reconcile-overlay-boot.py --state /var/lib/heteronetwork/agent.json --roster /etc/heteronetwork/overlay-boot-peers.json --node {{ inventory_hostname }}
      register: overlay_boot_unit

    - name: Load the next-boot policy without restarting the running VPN
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: overlay_boot_unit.changed

    - name: Install the isolated native Agent recovery E2E
      ansible.builtin.copy:
        src: "{{ hnn_repo_root }}/scripts/overlay_power_recovery_e2e.py"
        dest: /opt/heteronetwork/libexec/overlay_power_recovery_e2e.py
        owner: root
        group: root
        mode: '0755'

    - name: Create the protected infrastructure acceptance directory
      ansible.builtin.file:
        path: /var/lib/heteronetwork/acceptance
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: inventory_hostname == 'uc-k8sp5'

    - name: Test loss of all volatile VPN state with the real Agent in isolated namespaces
      ansible.builtin.command:
        argv:
          - python3
          - /opt/heteronetwork/libexec/overlay_power_recovery_e2e.py
          - --agent
          - /opt/heteronetwork/bin/iparsd
          - --reconciler
          - /opt/heteronetwork/libexec/reconcile-overlay-boot.py
          - --report
          - /var/lib/heteronetwork/acceptance/overlay-power-recovery.json
      changed_when: false
      when: inventory_hostname == 'uc-k8sp5'
