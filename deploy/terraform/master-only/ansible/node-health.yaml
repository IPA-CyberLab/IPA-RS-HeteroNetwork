- name: Tolerate brief heartbeat interruptions without fencing live storage nodes
  hosts: master_only:bootstrap:enrollment_issuer:standard
  gather_facts: false
  become: true
  serial: 1
  any_errors_fatal: true
  vars:
    ansible_become_password: "{{ lookup('env', 'HNN_IAC_BECOME_PASSWORD') }}"
    ansible_remote_tmp: /tmp/heteronetwork-ansible-mizuame
    hnn_node_health: "{{ lookup('file', hnn_repo_root ~ '/deploy/terraform/master-only/node-health-policy.json') | from_json }}"
  tasks:
    - name: Detect an existing controller manager without promoting any node
      ansible.builtin.stat:
        path: /etc/kubernetes/manifests/kube-controller-manager.yaml
      register: hnn_controller_manifest

    - name: Apply the policy only to existing control planes
      when: hnn_controller_manifest.stat.exists
      block:
        - name: Install the narrowly scoped policy reconciler
          ansible.builtin.copy:
            src: "{{ hnn_repo_root }}/scripts/reconcile-node-health.py"
            dest: /opt/heteronetwork/libexec/reconcile-node-health.py
            owner: root
            group: root
            mode: '0755'

        - name: Persist the policy for future kubeadm joins and upgrades
          ansible.builtin.command:
            argv:
              - python3
              - /opt/heteronetwork/libexec/reconcile-node-health.py
              - cluster-config
              - --seconds
              - "{{ hnn_node_health.node_monitor_grace_seconds }}"
          register: hnn_cluster_health
          changed_when: (hnn_cluster_health.stdout | from_json).changed
          until: hnn_cluster_health.rc == 0
          retries: 3
          delay: 2

        - name: Change only the local controller manager health threshold
          ansible.builtin.command:
            argv:
              - python3
              - /opt/heteronetwork/libexec/reconcile-node-health.py
              - manifest
              - --seconds
              - "{{ hnn_node_health.node_monitor_grace_seconds }}"
          register: hnn_local_health
          changed_when: (hnn_local_health.stdout | from_json).changed

        - name: Verify the new ready controller manager before the next node
          ansible.builtin.command:
            argv:
              - python3
              - /opt/heteronetwork/libexec/reconcile-node-health.py
              - verify
              - --seconds
              - "{{ hnn_node_health.node_monitor_grace_seconds }}"
              - --node
              - "{{ inventory_hostname }}"
          register: hnn_controller_ready
          changed_when: false
          until: hnn_controller_ready.rc == 0
          retries: 40
          delay: 3
