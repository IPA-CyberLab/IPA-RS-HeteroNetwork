apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: heteronetwork-control-plane-only-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !has(object.spec.nodeName) ||
        !(object.spec.nodeName in ['uc-k8sp1', 'uc-k8sp2', 'uc-k8s3p']) ||
        (request.namespace == 'kube-system' &&
         object.metadata.name.matches('^(etcd|kube-apiserver|kube-controller-manager|kube-scheduler)-') &&
         has(object.metadata.annotations) &&
         'kubernetes.io/config.mirror' in object.metadata.annotations &&
         request.userInfo.username == 'system:node:' + object.spec.nodeName) ||
        (request.namespace == 'kube-flannel' && object.metadata.name.startsWith('kube-flannel-ds-')) ||
        (request.namespace == 'kube-system' && object.metadata.name.startsWith('kube-proxy-')) ||
        (request.namespace == 'kube-system' &&
         has(object.spec.hostNetwork) && object.spec.hostNetwork &&
         ((object.metadata.name.startsWith('node-local-dns-') &&
           object.spec.serviceAccountName == 'node-local-dns') ||
          object.metadata.name.startsWith('kubernetes-service-route-') ||
          (object.metadata.name.startsWith('kube-router-network-policy-') &&
           object.spec.serviceAccountName == 'kube-router-network-policy'))) ||
        (request.namespace == 'openbao' &&
         object.metadata.name.matches('^openbao-[0-2]$') &&
         has(object.metadata.labels) &&
         object.metadata.labels['app.kubernetes.io/name'] == 'openbao' &&
         object.metadata.labels['app.kubernetes.io/instance'] == 'openbao' &&
         object.metadata.labels['component'] == 'server' &&
         object.spec.serviceAccountName == 'openbao')
      message: "This node runs only Kubernetes control-plane components, networking, and OpenBao."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: heteronetwork-control-plane-only-pods
spec:
  policyName: heteronetwork-control-plane-only-pods
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: heteronetwork-control-plane-only-bindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods/binding", "bindings"]
  validations:
    - expression: >-
        !(object.target.name in ['uc-k8sp1', 'uc-k8sp2', 'uc-k8s3p']) ||
        (request.namespace == 'kube-flannel' && object.metadata.name.startsWith('kube-flannel-ds-')) ||
        (request.namespace == 'kube-system' && object.metadata.name.startsWith('kube-proxy-')) ||
        (request.namespace == 'kube-system' &&
         (object.metadata.name.startsWith('node-local-dns-') ||
          object.metadata.name.startsWith('kubernetes-service-route-') ||
          object.metadata.name.startsWith('kube-router-network-policy-'))) ||
        (request.namespace == 'openbao' && object.metadata.name.matches('^openbao-[0-2]$'))
      message: "Only control-plane, networking, and OpenBao Pods can bind to this node."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: heteronetwork-control-plane-only-bindings
spec:
  policyName: heteronetwork-control-plane-only-bindings
  validationActions: [Deny]
