apiVersion: v1
kind: Namespace
metadata:
  name: livekit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: livekit
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/version: 1.13.4
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit
        app.kubernetes.io/version: 1.13.4
        networking.heteronetwork.io/traffic-mode: direct
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 18000
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: livekit
      initContainers:
        - name: tune-udp-buffers
          image: livekit/livekit-server:v1.13.4@sha256:189f7c81b704a36642bc5c7e2d3e1ae83744627c11978a23a251bf19fbec64e0
          imagePullPolicy: IfNotPresent
          command:
            - /sbin/sysctl
            - -w
            - net.core.rmem_max=5000000
            - net.core.wmem_max=5000000
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: true
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.4@sha256:189f7c81b704a36642bc5c7e2d3e1ae83744627c11978a23a251bf19fbec64e0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/livekit/livekit.yaml
            - --key-file
            - /etc/livekit-secrets/keys.yaml
          env:
            - name: TMPDIR
              value: /tmp
          ports:
            - name: signal
              containerPort: 7880
              protocol: TCP
            - name: rtc-tcp
              containerPort: 7881
              hostPort: 7881
              protocol: TCP
            - name: rtc-udp
              containerPort: 7882
              hostPort: 7882
              protocol: UDP
          startupProbe:
            httpGet:
              path: /
              port: signal
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: signal
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: signal
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
            - name: keys
              mountPath: /etc/livekit-secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: livekit-config
            defaultMode: 0440
        - name: keys
          secret:
            secretName: livekit-keys
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: livekit
  namespace: livekit
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-signal
  namespace: livekit
  annotations:
    networking.heteronetwork.io/traffic-mode: forwarded
    networking.heteronetwork.io/ingress-replicas: "3"
spec:
  type: LoadBalancer
  loadBalancerClass: heteronetwork.io/public
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: signal
      port: 7880
      targetPort: signal
      protocol: TCP
      appProtocol: http
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-rtc
  namespace: livekit
  annotations:
    networking.heteronetwork.io/traffic-mode: direct
    networking.heteronetwork.io/ingress-replicas: "2"
spec:
  type: LoadBalancer
  loadBalancerClass: heteronetwork.io/public
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: rtc-tcp
      port: 7881
      targetPort: rtc-tcp
      protocol: TCP
    - name: rtc-udp
      port: 7882
      targetPort: rtc-udp
      protocol: UDP
