apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dev-identity-postgres
  namespace: hetero-dev-identity
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:71eef62330076deb985c8ffb1abeb957d86779c3911a8057c0b97f3c5a30b50b
  imagePullPolicy: IfNotPresent
  enableSuperuserAccess: false
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  postgresUID: 26
  postgresGID: 26
  podSecurityContext:
    runAsUser: 26
    runAsGroup: 26
    fsGroup: 26
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [hetero-dev-1, hetero-dev-2, hetero-dev-3]
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      dataChecksums: true
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
      failoverQuorum: true
    parameters:
      shared_buffers: 256MB
      max_connections: "100"
      max_wal_size: 512MB
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 8Gi
    storageClass: dev-identity-local
    resizeInUseVolumes: false
    pvcTemplate:
      accessModes: [ReadWriteOnce]
      volumeMode: Filesystem
      storageClassName: dev-identity-local
      resources:
        requests:
          storage: 8Gi
      selector:
        matchLabels:
          heteronetwork.dev/storage-purpose: identity-postgres
