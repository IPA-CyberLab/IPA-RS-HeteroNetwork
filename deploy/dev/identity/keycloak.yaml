apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-keycloak
  namespace: hetero-dev-identity
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [hetero-dev-1, hetero-dev-2, hetero-dev-3]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/name: keycloak}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
          args: [start]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: '1', memory: 1536Mi}
          env:
            - {name: KC_DB, value: postgres}
            - name: KC_DB_URL
              value: 'jdbc:postgresql://dev-identity-postgres-rw.hetero-dev-identity.svc.cluster.local:5432/keycloak?sslmode=verify-full&sslrootcert=/var/run/postgres-ca/ca.crt&connectTimeout=5&loginTimeout=10&socketTimeout=30&tcpKeepAlive=true'
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef: {name: dev-identity-postgres-app, key: username}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: dev-identity-postgres-app, key: password}
            - {name: KC_DB_POOL_INITIAL_SIZE, value: '2'}
            - {name: KC_DB_POOL_MIN_SIZE, value: '2'}
            - {name: KC_DB_POOL_MAX_SIZE, value: '15'}
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef: {name: dev-keycloak-site, key: origin}
            - {name: KC_HOSTNAME_STRICT, value: 'true'}
            - {name: KC_HTTP_ENABLED, value: 'false'}
            - {name: KC_HTTPS_CERTIFICATE_FILE, value: /var/run/keycloak-tls/tls.crt}
            - {name: KC_HTTPS_CERTIFICATE_KEY_FILE, value: /var/run/keycloak-tls/tls.key}
            - {name: KC_HEALTH_ENABLED, value: 'true'}
            - {name: KC_METRICS_ENABLED, value: 'true'}
            - {name: KC_HTTP_MANAGEMENT_SCHEME, value: http}
            - {name: KC_CACHE, value: ispn}
            - {name: KC_CACHE_STACK, value: jdbc-ping}
            - name: KC_CACHE_EMBEDDED_NETWORK_BIND_ADDRESS
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: {name: dev-keycloak-bootstrap, key: username}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: dev-keycloak-bootstrap, key: password}
          ports:
            - {name: https, containerPort: 8443}
            - {name: management, containerPort: 9000}
            - {name: cache, containerPort: 7800}
            - {name: failure, containerPort: 57800}
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - {name: tls, mountPath: /var/run/keycloak-tls, readOnly: true}
            - {name: postgres-ca, mountPath: /var/run/postgres-ca, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: dev-keycloak-tls, defaultMode: 0440}
        - name: postgres-ca
          secret:
            secretName: dev-identity-postgres-ca
            defaultMode: 0440
            items: [{key: ca.crt, path: ca.crt}]
---
apiVersion: v1
kind: Service
metadata: {name: dev-keycloak, namespace: hetero-dev-identity}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: keycloak}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: dev-keycloak, namespace: hetero-dev-identity}
spec:
  minAvailable: 2
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: dev-keycloak, namespace: hetero-dev-identity}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: keycloak}
      ports: [{protocol: TCP, port: 7800}, {protocol: TCP, port: 57800}]
    - from:
        - namespaceSelector:
            matchLabels: {heteronetwork.dev/identity-client: 'true'}
        - ipBlock: {cidr: 10.251.0.1/32}
        - ipBlock: {cidr: 10.251.0.2/32}
        - ipBlock: {cidr: 10.251.0.3/32}
        - ipBlock: {cidr: 172.29.0.0/31}
        - ipBlock: {cidr: 172.29.1.0/31}
        - ipBlock: {cidr: 172.29.2.0/31}
      ports: [{protocol: TCP, port: 8443}]
    - from:
        - ipBlock: {cidr: 10.251.0.1/32}
        - ipBlock: {cidr: 10.251.0.2/32}
        - ipBlock: {cidr: 10.251.0.3/32}
        - ipBlock: {cidr: 172.29.0.0/31}
        - ipBlock: {cidr: 172.29.1.0/31}
        - ipBlock: {cidr: 172.29.2.0/31}
      ports: [{protocol: TCP, port: 9000}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: keycloak}
      ports: [{protocol: TCP, port: 7800}, {protocol: TCP, port: 57800}]
    - to:
        - podSelector:
            matchLabels: {cnpg.io/cluster: dev-identity-postgres}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
