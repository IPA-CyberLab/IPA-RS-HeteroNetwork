apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: heteronetwork-longhorn-share-manager-startup
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: [CREATE]
        resources: [pods]
        scope: Namespaced
  matchConditions:
    - name: longhorn-share-manager
      expression: >-
        request.namespace == 'longhorn-system' &&
        object.metadata.name.startsWith('share-manager-') &&
        has(object.metadata.labels) &&
        'longhorn.io/share-manager' in object.metadata.labels &&
        object.spec.containers.exists(c, c.name == 'share-manager')
    - name: gate-not-yet-injected
      expression: >-
        !has(object.spec.initContainers) ||
        !object.spec.initContainers.exists(c, c.name == 'wait-for-recovery-backend')
  variables:
    - name: shareManager
      expression: object.spec.containers.filter(c, c.name == 'share-manager')[0]
  mutations:
    # The network policy can take a few seconds to admit a new share manager.
    # NFS Ganesha exits on the first failed startup request to the backend.
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          (has(object.spec.initContainers) && size(object.spec.initContainers) > 0 ? [] :
            [JSONPatch{op: 'add', path: '/spec/initContainers', value: []}]) +
          [JSONPatch{op: 'add', path: '/spec/initContainers/-', value: Object.spec.initContainers{
            name: 'wait-for-recovery-backend',
            image: variables.shareManager.image,
            imagePullPolicy: variables.shareManager.imagePullPolicy,
            command: ['/bin/sh', '-c', '''
              for attempt in $(seq 1 60); do
                if curl --silent --show-error --max-time 2 --output /dev/null http://longhorn-recovery-backend:9503/; then
                  exit 0
                fi
                sleep 1
              done
              exit 1
            '''],
            resources: Object.spec.initContainers.resources{
              requests: {'cpu': '10m', 'memory': '16Mi'},
              limits: {'cpu': '100m', 'memory': '64Mi'}
            },
            securityContext: Object.spec.initContainers.securityContext{
              runAsNonRoot: true,
              runAsUser: 65534,
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: Object.spec.initContainers.securityContext.capabilities{drop: ['ALL']}
            }
          }}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: heteronetwork-longhorn-share-manager-startup
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  policyName: heteronetwork-longhorn-share-manager-startup
