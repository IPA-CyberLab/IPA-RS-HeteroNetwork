apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapshot-replica-reconcile
  namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snapshot-replica-claim-read
  namespace: openbao
rules:
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    resourceNames: [openbao-snapshots]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snapshot-replica-claim-read
  namespace: openbao
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: snapshot-replica-claim-read
subjects:
  - kind: ServiceAccount
    name: snapshot-replica-reconcile
    namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snapshot-replica-inventory-read
  namespace: longhorn-system
rules:
  - apiGroups: [longhorn.io]
    resources: [replicas]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snapshot-replica-inventory-read
  namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: snapshot-replica-inventory-read
subjects:
  - kind: ServiceAccount
    name: snapshot-replica-reconcile
    namespace: openbao
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: snapshot-replica-reconcile
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: snapshot-replica-reconcile
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
        - ipBlock:
            cidr: 10.250.0.0/24
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: snapshot-replica-reconcile
  namespace: openbao
spec:
  schedule: '7 3 * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 1050
      template:
        metadata:
          labels:
            app.kubernetes.io/name: snapshot-replica-reconcile
        spec:
          serviceAccountName: snapshot-replica-reconcile
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: heteronetwork.io/control-plane-only
                        operator: NotIn
                        values: ['true']
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [ichikawap1, uc-k8sp5]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: python:3.13.7-bookworm@sha256:c900d35aba5fe4c1dc1cd358408baae2902ff2a2926a1d15cc5002c6061ddb2e
              imagePullPolicy: IfNotPresent
              command: [python3, -B, /code/snapshot-replica-reconcile.py]
              resources:
                requests:
                  cpu: 5m
                  memory: 24Mi
                limits:
                  cpu: 100m
                  memory: 96Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: code
                  mountPath: /code
                  readOnly: true
                - name: snapshots
                  mountPath: /snapshots
                  readOnly: true
          volumes:
            - name: code
              configMap:
                name: snapshot-replica-reconcile
                defaultMode: 292
            - name: snapshots
              persistentVolumeClaim:
                claimName: openbao-snapshots
                readOnly: true
