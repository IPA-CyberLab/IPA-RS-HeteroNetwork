apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: heteronetwork-longhorn-recovery-backend-routing
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: [CREATE, UPDATE]
        resources: [services]
        scope: Namespaced
  matchConditions:
    - name: longhorn-recovery-backend
      expression: request.namespace == 'longhorn-system' && object.metadata.name == 'longhorn-recovery-backend'
  mutations:
    # Share managers can use the local recovery backend while a lost node's
    # endpoint still reports Ready. If there is no local backend, kube-proxy
    # can use an endpoint on another node.
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          [JSONPatch{op: 'add', path: '/spec/trafficDistribution', value: 'PreferSameNode'}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: heteronetwork-longhorn-recovery-backend-routing
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  policyName: heteronetwork-longhorn-recovery-backend-routing
