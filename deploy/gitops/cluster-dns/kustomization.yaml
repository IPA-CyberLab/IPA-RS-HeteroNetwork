apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: postgres-ha-connector
    namespace: kube-system
    files:
      - haproxy.cfg=postgres-haproxy.cfg
  - name: keycloak-ha-connector
    namespace: kube-system
    files:
      - haproxy.cfg=keycloak-haproxy.cfg
  - name: overlay-dns-service-discovery
    namespace: kube-system
    files:
      - controller.py=overlay-dns-service-discovery.py
      - services.json=overlay-dns-services.json

resources:
  - coredns.yaml
  - nodelocaldns.yaml
  - postgres-ha-connector.yaml
  - keycloak-ha-connector.yaml
  - service-route.yaml
  - overlay-dns-service-discovery.yaml
