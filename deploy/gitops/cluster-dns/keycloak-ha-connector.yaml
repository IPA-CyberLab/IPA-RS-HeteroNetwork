apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: keycloak-ha-connector
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-ha-connector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-ha-connector
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haproxy
          image: docker.io/library/haproxy:3.2.7-alpine@sha256:3b80483d47e1c7d1fc7eb4b9104f33d9a51259769be299eb675524dca2bc8157
          args: ["-f", "/usr/local/etc/haproxy/haproxy.cfg"]
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: oidc
              containerPort: 18079
          readinessProbe:
            httpGet:
              path: /connector-ready
              port: oidc
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: oidc
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: keycloak-ha-connector
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-ha-connector
  namespace: kube-system
spec:
  # Stable virtual address, not a physical node IP. OIDC Host stays unchanged.
  clusterIP: 10.96.180.79
  selector:
    app.kubernetes.io/name: keycloak-ha-connector
  ports:
    - name: oidc
      port: 18079
      targetPort: oidc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak-ha-connector
  namespace: kube-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-ha-connector
