global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 2s
    timeout client 1m
    timeout server 1m
    timeout check 1s

frontend postgres
    bind :25433
    default_backend local_postgres_ha

backend local_postgres_ha
    option tcp-check
    server local 127.0.0.1:25432 check inter 2s fall 2 rise 1
