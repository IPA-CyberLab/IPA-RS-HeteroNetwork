global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode http
    timeout connect 1s
    timeout client 60s
    timeout server 30s
    timeout check 2s
    # Do not replay single-use authorization codes or credential POSTs.
    retries 0

frontend keycloak
    bind :18079
    monitor-uri /connector-ready
    acl unavailable nbsrv(keycloak_edge) lt 1
    monitor fail if unavailable
    acl realm path_beg /realms/
    http-request deny deny_status 404 unless realm
    default_backend keycloak_edge

backend keycloak_edge
    option httpchk
    http-check send meth GET uri /realms/heterocloud/.well-known/openid-configuration hdr Host console.heteronetwork.internal:18079
    http-check expect status 200
    # Check the actual local replica, not another load balancer's cached health.
    server local_replica "${NODE_IP}:18080" check inter 2s fall 2 rise 2
