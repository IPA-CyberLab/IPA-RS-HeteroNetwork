apiVersion: v1
kind: ServiceAccount
metadata:
  name: overlay-dns-service-discovery
  namespace: kube-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: overlay-dns-service-discovery
rules:
  - apiGroups: [""]
    resources: ["nodes", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["heteronetwork-overlay-dns"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: overlay-dns-service-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: overlay-dns-service-discovery
subjects:
  - kind: ServiceAccount
    name: overlay-dns-service-discovery
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: heteronetwork-overlay-dns-effective
  namespace: kube-system
  labels:
    app.kubernetes.io/name: overlay-dns-service-discovery
    app.kubernetes.io/part-of: heteronetwork
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: overlay-dns-service-discovery-effective
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["heteronetwork-overlay-dns-effective"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: overlay-dns-service-discovery-effective
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: overlay-dns-service-discovery-effective
subjects:
  - kind: ServiceAccount
    name: overlay-dns-service-discovery
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overlay-dns-service-discovery
  namespace: kube-system
  labels:
    app.kubernetes.io/name: overlay-dns-service-discovery
    app.kubernetes.io/part-of: heteronetwork
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: overlay-dns-service-discovery
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overlay-dns-service-discovery
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: heteronetwork
    spec:
      serviceAccountName: overlay-dns-service-discovery
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: overlay-dns-service-discovery
                    app.kubernetes.io/component: controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: python:3.13.7-bookworm@sha256:c900d35aba5fe4c1dc1cd358408baae2902ff2a2926a1d15cc5002c6061ddb2e
          imagePullPolicy: IfNotPresent
          command: ["python3", "-B", "/config/controller.py", "controller"]
          env:
            - name: BASE_CONFIGMAP_NAMESPACE
              value: heteronetwork-system
            - name: BASE_CONFIGMAP_NAME
              value: heteronetwork-overlay-dns
            - name: EFFECTIVE_CONFIGMAP_NAMESPACE
              value: kube-system
            - name: EFFECTIVE_CONFIGMAP_NAME
              value: heteronetwork-overlay-dns-effective
            - name: DISCOVERY_RULES_PATH
              value: /config/services.json
            - name: RECONCILE_INTERVAL_SECONDS
              value: "5"
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,time; assert time.time()-os.stat('/tmp/last-success').st_mtime < 30"
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,time; assert time.time()-os.stat('/tmp/last-success').st_mtime < 60"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: overlay-dns-service-discovery
            defaultMode: 0444
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: overlay-dns-service-discovery
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: overlay-dns-service-discovery
      app.kubernetes.io/component: controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: overlay-dns-host-sync
  namespace: kube-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: overlay-dns-host-sync
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["heteronetwork-overlay-dns-effective"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: overlay-dns-host-sync
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: overlay-dns-host-sync
subjects:
  - kind: ServiceAccount
    name: overlay-dns-host-sync
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: overlay-dns-host-sync
  namespace: kube-system
  labels:
    app.kubernetes.io/name: overlay-dns-host-sync
    app.kubernetes.io/part-of: heteronetwork
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: overlay-dns-host-sync
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overlay-dns-host-sync
        app.kubernetes.io/part-of: heteronetwork
    spec:
      serviceAccountName: overlay-dns-host-sync
      automountServiceAccountToken: true
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/os: linux
        networking.heteronetwork.io/overlay-dns-sync: "true"
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          image: python:3.13.7-bookworm@sha256:c900d35aba5fe4c1dc1cd358408baae2902ff2a2926a1d15cc5002c6061ddb2e
          imagePullPolicy: IfNotPresent
          command: ["python3", "-B", "/config/controller.py", "sync"]
          env:
            - name: EFFECTIVE_CONFIGMAP_NAMESPACE
              value: kube-system
            - name: EFFECTIVE_CONFIGMAP_NAME
              value: heteronetwork-overlay-dns-effective
            - name: OVERLAY_DNS_DESTINATION
              value: /host/overlay-dns-records.json
            - name: RECONCILE_INTERVAL_SECONDS
              value: "5"
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,time; assert time.time()-os.stat('/tmp/last-success').st_mtime < 30"
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,time; assert time.time()-os.stat('/tmp/last-success').st_mtime < 60"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 96Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: host-state
              mountPath: /host
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: overlay-dns-service-discovery
            defaultMode: 0444
        - name: host-state
          hostPath:
            path: /var/lib/heteronetwork
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
