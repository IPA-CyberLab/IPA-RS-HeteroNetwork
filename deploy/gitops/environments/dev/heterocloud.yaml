fullnameOverride: heterocloud-dev
databaseTls:
  caSecretName: dev-postgres-ca
  caSecretKey: ca.crt
replicaCount: 3
hostNetwork: false
hostAliases: []
publicOrigin: https://${domain}
additionalOrigins: []
oidc:
  enabled: true
  issuerUrl: ${oidc_issuer}
  backchannelIssuerUrl: ""
  clientId: ${oidc_client_id}
  publicCallbackUrl: https://${domain}/api/v1/auth/oidc/callback
ownerConsole:
  enabled: true
  secureCookie: true
  replicaCount: 3
  origin: https://owner.${domain}
  oidcPublicCallbackUrl: https://owner.${domain}/api/v1/auth/oidc/callback
  email: ${owner_email}
  hostNetwork: false
  externalIPs: []
  databaseProxy:
    enabled: false
  podDisruptionBudget:
    minAvailable: 2
bootstrap:
  enabled: false
registry:
  enabled: false
flowAccess:
  issuer: heterocloud-dev
  audience: heterocloud-flow-dev-data
flowPublicEndpoints:
  - https://flow.${domain}
flowInternalEndpoint: http://heterocloud-flow-dev-api.heterocloud-flow-dev.svc.cluster.local:8080/
flashExec:
  endpoint: http://heterocloud-flash-dev-api.heterocloud-flash-dev.svc.cluster.local:8080/
  providerIssuer: heterocloud-dev
  audience: heterocloud-flash-dev
  providerKeyId: heterocloud-dev-provider-1
syouyu:
  internalEndpoint: http://heterocloud-syouyu-dev-api.heterocloud-syouyu-dev.svc.cluster.local:8080/
  accessIssuer: heterocloud-dev
  accessAudience: heterocloud-syouyu-dev-data
worker:
  replicaCount: 3
  flowEndpoint: http://heterocloud-flow-dev-api.heterocloud-flow-dev.svc.cluster.local:8080/
  flashEndpoint: http://heterocloud-flash-dev-api.heterocloud-flash-dev.svc.cluster.local:8080/
  syouyuEndpoint: http://heterocloud-syouyu-dev-api.heterocloud-syouyu-dev.svc.cluster.local:8080/
  providerIssuer: heterocloud-dev
  flowAudience: heterocloud-flow-dev
  flashAudience: heterocloud-flash-dev
  syouyuAudience: heterocloud-syouyu
  providerKeyId: heterocloud-dev-provider-1
secrets:
  runtimeSecretName: heterocloud-dev-runtime
  tlsSecretName: heterocloud-dev-tls
  flowAccessSecretName: heterocloud-dev-flow-access
  syouyuAccessSecretName: heterocloud-dev-syouyu-access
  oidcSecretName: heterocloud-dev-oidc
  providerSigningSecretName: heterocloud-dev-provider-signing
service:
  type: ClusterIP
  port: 8443
podDisruptionBudget:
  minAvailable: 2
networkPolicy:
  # Filled from the dedicated cluster site configuration by render.py.
  databaseCidrs: []
  providerCidrs: []
  registryCidrs: []
  databasePort: 5432
  oidcPort: 443
nodeSelector: {}
affinity: {}
