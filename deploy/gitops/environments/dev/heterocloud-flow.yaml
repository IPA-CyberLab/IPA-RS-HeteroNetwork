fullnameOverride: heterocloud-flow-dev
databaseTls:
  caSecretName: dev-postgres-ca
  caSecretKey: ca.crt
runtime:
  hostNetwork: false
secrets:
  create: false
  existingSecret: heterocloud-flow-dev-secrets
providerAuth:
  issuer: heterocloud-dev
  audience: heterocloud-flow-dev
principalAuth:
  issuer: heterocloud-dev
  audience: heterocloud-flow-dev-data
database:
  externalPort: 5432
  proxy:
    enabled: false
    addresses: []
    endpointNodeNames: {}
  nodeSelector: {}
  migrateOnApiStart: false
  migrationJob:
    enabled: true
api:
  replicaCount: 3
  publicUrls: ["https://flow.${domain}"]
  publicService:
    enabled: false
matchmaker:
  replicaCount: 3
signaling:
  replicaCount: 3
  publicUrls: ["wss://flow.${domain}"]
  publicService:
    enabled: false
livekit:
  replicaCount: 3
  internalUrl: http://heterocloud-flow-dev-livekit:7880
  publicUrls: ["wss://flow.${domain}"]
  existingConfigSecret: heterocloud-flow-dev-livekit-config
coturn:
  replicaCount: 3
  # Native DEV STUN owns 3478/3479 on guest 1.
  servicePort: 13478
  additionalPools: []
  realm: turn.${domain}
  publicHosts: ["turn.${domain}"]
  relayAddress:
    mode: host
    mappings: []
  performance:
    tuneHostUdpBuffers: false
redis:
  enabled: true
  fullnameOverride: heterocloud-flow-dev-redis
  architecture: replication
  auth:
    enabled: true
    sentinel: true
    existingSecret: heterocloud-flow-dev-secrets
    existingSecretPasswordKey: redis-password
  sentinel:
    enabled: true
    masterSet: flowmaster
    quorum: 2
  replica:
    replicaCount: 3
    podAntiAffinityPreset: hard
    persistence:
      enabled: true
      storageClass: ${storage_class}
      size: 8Gi
    pdb:
      create: true
      minAvailable: 2
  networkPolicy:
    enabled: true
    allowExternal: false
    allowExternalEgress: false
    extraIngress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: heterocloud-flow
        ports:
          - {port: 6379, protocol: TCP}
          - {port: 26379, protocol: TCP}
    extraEgress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - {port: 53, protocol: TCP}
externalRedis:
  address: ""
  sentinelUrls: []
  passwordSecretKey: ""
postgresql-ha:
  enabled: false
monitoring:
  prometheus:
    enabled: false
  grafana:
    enabled: false
nodeSelector: {}
