apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-router-network-policy
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-router-network-policy
    app.kubernetes.io/part-of: heteronetwork
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: cluster
        cluster:
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          server: https://kubernetes.default.svc
    users:
      - name: kube-router
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: kube-router
        context:
          cluster: cluster
          user: kube-router
    current-context: kube-router
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-router-network-policy
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-router-network-policy
    app.kubernetes.io/part-of: heteronetwork
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-router-network-policy
  labels:
    app.kubernetes.io/name: kube-router-network-policy
    app.kubernetes.io/part-of: heteronetwork
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - services
      - nodes
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-router-network-policy
  labels:
    app.kubernetes.io/name: kube-router-network-policy
    app.kubernetes.io/part-of: heteronetwork
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-router-network-policy
subjects:
  - kind: ServiceAccount
    name: kube-router-network-policy
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-router-network-policy
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-router-network-policy
    app.kubernetes.io/part-of: heteronetwork
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-router-network-policy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-router-network-policy
        app.kubernetes.io/part-of: heteronetwork
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "20246"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: kube-router-network-policy
      priorityClassName: system-node-critical
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: kube-router
          image: docker.io/cloudnativelabs/kube-router:v2.11.1@sha256:64da9a538d29e13780e256ce3897a52932a68657793bef009063bbeb2762146a
          imagePullPolicy: IfNotPresent
          args:
            - --run-router=false
            - --run-firewall=true
            - --run-service-proxy=false
            - --run-loadbalancer=false
            - --metrics-port=20246
            - --hostname-override=$(NODE_NAME)
            - --kubeconfig=/var/lib/kube-router/kubeconfig
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 20244
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: 20244
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: kubeconfig
              mountPath: /var/lib/kube-router
              readOnly: true
            - name: xtables-lock
              mountPath: /run/xtables.lock
      volumes:
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: kubeconfig
          configMap:
            name: kube-router-network-policy
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
