apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: heterocloud-edge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  project: hetero-platform
  source:
    repoURL: git://10.250.0.2:19419/heteronetwork-infrastructure.git
    targetRevision: master
    path: deploy/gitops/envoy-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: heterocloud-edge
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - group: externaldns.k8s.io
    kind: DNSEndpoint
    name: heterocloud-web-gateways
    namespace: heterocloud-dns
    jsonPointers:
    - /spec/endpoints/0/targets
    - /spec/endpoints/1/targets
    - /spec/endpoints/2/targets
    - /spec/endpoints/3/targets
    - /spec/endpoints/4/targets
    - /metadata/annotations/dns.heterocloud.io~1quorum-writer
