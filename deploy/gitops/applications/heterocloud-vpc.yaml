apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: heterocloud-vpc
spec:
  project: hetero-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: heterocloud-vpc
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jsonPointers:
    - /spec/names/categories
    - /spec/versions/0/additionalPrinterColumns
  source:
    repoURL: https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud-VPC.git
    targetRevision: 0c3ecaa7446470b3e74045056513cbdce32a6dde
    path: deploy/helm/heterocloud-vpc
    helm:
      releaseName: heterocloud-vpc
      values: |
        image: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-vpc@sha256:acf0db7827664c0b6db687faeacb7c161b2dbbc19224b379d5575f70bd37ef93
        providerPublicKeysJson: '{"heterocloud-provider-1":"-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAs9HXnx9AwepDSdl/w+k2tAYieW3aU8PhlJoQBAFo9X4=\n-----END
          PUBLIC KEY-----\n"}'
        protectedCidrs:
        - 163.220.236.0/24
        gatewaySelector:
          matchLabels: null
          matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - ichikawap1
            - uc-k8sp4
            - uc-k8sp5
        egressCertificate:
          enabled: true
          namespace: heterocloud-vpc-system
        # Host-networked provider calls use the node bridge or Flannel address.
        controlPlaneCidrs:
        - 10.244.0.0/32
        - 10.244.0.1/32
        - 10.244.1.0/32
        - 10.244.1.1/32
        - 10.244.2.0/32
        - 10.244.2.1/32
        - 10.244.4.0/32
        - 10.244.4.1/32
        - 10.244.5.0/32
        - 10.244.5.1/32
        - 10.244.6.0/32
        - 10.244.6.1/32
        - 10.250.0.2/32
        - 10.250.0.4/32
        - 10.250.0.5/32
        - 10.250.0.6/32
        - 10.250.0.10/32
        - 10.250.0.11/32
