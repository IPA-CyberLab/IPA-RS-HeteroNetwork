apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: heterocloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: hetero-platform
  source:
    repoURL: https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud.git
    targetRevision: v0.1.70
    path: deploy/helm/heterocloud
    helm:
      releaseName: heterocloud
      valueFiles:
        - ../../environments/heteronet/values.yaml
      valuesObject:
        image:
          tag: "0.1.70@sha256:ca9cbefeb0ad2573b607c92b33bcc02d29271a0d1a6ad2576ee4e33ee429f5ec"
        hostAliases:
          - ip: "10.96.180.79"
            hostnames:
              - console.heteronetwork.internal
  destination:
    server: https://kubernetes.default.svc
    namespace: heterocloud
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
