apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: heterocloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: hetero-platform
  source:
    repoURL: https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud.git
    targetRevision: b2b602ed06ff4633fa868a9aa1ab9a51d5a3d0a5
    path: deploy/helm/heterocloud
    helm:
      releaseName: heterocloud
      valueFiles:
      - ../../environments/heteronet/values.yaml
      values: |
        # Roll out on the two active workers; restore the desired replicas afterwards.
        replicaCount: 2
        workloadIdentity:
          enabled: true
          namespace: heterocloud-flash-workloads
          apiCidrs:
            - 10.96.0.1/32
            - 10.250.0.0/24
        image:
          tag: "0.1.110-ui.5@sha256:01682840c1214ca4c3c68dd616e46de4e78ffdca91bfe4e1958f610af01e0df7"
        worker:
          replicaCount: 2
          vpcEndpoint: http://heterocloud-vpc-api.heterocloud-vpc.svc.cluster.local:8080/
        ownerConsole:
          replicaCount: 2
          externalIPs:
            - 10.250.0.4
            - 10.250.0.5
            - 10.250.0.6
            - 10.250.0.10
            - 10.250.0.11
        hostAliases:
          - ip: "10.96.180.79"
            hostnames:
              - console.heteronetwork.internal
        customDomains:
          reservedNames:
            - heterocloud.mizuame.app
            - flow.heterocloud.mizuame.app
            - registry.heterocloud.mizuame.app
            - s3.heterocloud.mizuame.app
            - secrets.heterocloud.mizuame.app
          reservedSuffixes:
            - flash.heterocloud.mizuame.app
  destination:
    server: https://kubernetes.default.svc
    namespace: heterocloud
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
