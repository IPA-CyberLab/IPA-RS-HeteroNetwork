apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: heterocloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: hetero-platform
  source:
    repoURL: https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud.git
    targetRevision: 3e1619b653318a8cc5fa61a5bb85632b314c25b3
    path: deploy/helm/heterocloud
    helm:
      releaseName: heterocloud
      valueFiles:
      - ../../environments/heteronet/values.yaml
      values: |
        # Two active worker nodes remain after uc-k8sp4 was excluded. Keep both
        # available; host-port anti-affinity prevents scheduling a third.
        replicaCount: 2
        workloadIdentity:
          enabled: true
          namespace: heterocloud-flash-workloads
          apiCidrs:
            - 10.96.0.1/32
            - 10.250.0.0/24
        image:
          tag: "0.1.113-platform.1@sha256:4c316a680746c4a712e64dd6c458deee4b32559373c91d7372165e7208edcc18"
        worker:
          replicaCount: 2
          vpcEndpoint: http://heterocloud-vpc-api.heterocloud-vpc.svc.cluster.local:8080/
        ownerConsole:
          replicaCount: 2
          externalIPs:
            - 10.250.0.4
            - 10.250.0.5
            - 10.250.0.6
            - 10.250.0.10
            - 10.250.0.11
        hostAliases:
          - ip: "10.96.180.79"
            hostnames:
              - console.heteronetwork.internal
        customDomains:
          reservedNames:
            - heterocloud.mizuame.app
            - flow.heterocloud.mizuame.app
            - registry.heterocloud.mizuame.app
            - s3.heterocloud.mizuame.app
            - secrets.heterocloud.mizuame.app
          reservedSuffixes:
            - flash.heterocloud.mizuame.app
  destination:
    server: https://kubernetes.default.svc
    namespace: heterocloud
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
