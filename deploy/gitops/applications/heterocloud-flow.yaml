apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: heterocloud-flow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: hetero-platform
  source:
    repoURL: https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud-Flow.git
    targetRevision: master
    path: deploy/helm/heterocloud-flow
    helm:
      releaseName: heterocloud-flow
      valueFiles:
        - ../../environments/heteronet/values.yaml
      # Monitoring is isolated from the low-IOPS control-plane members. Three
      # host-network replicas retain one endpoint after any two node faults.
      values: |
        redis:
          sentinel:
            quorum: 2
          replica:
            # Three eligible application hosts; dedicated custodians stay excluded.
            replicaCount: 3
            pdb:
              minAvailable: 2
            extraFlags:
              # Only an incomplete tail up to 4 KiB may be recovered automatically.
              - --aof-load-corrupt-tail-max-size
              - "4096"
        monitoring:
          prometheus:
            nodeSelector:
              monitoring.heteronetwork.io/ha: "true"
            allowedNodes:
              - uc-k8sp5
              - ichikawap1
              - uc-k8sp4
          grafana:
            nodeSelector:
              monitoring.heteronetwork.io/ha: "true"
            allowedNodes:
              - uc-k8sp5
              - ichikawap1
              - uc-k8sp4
      parameters:
        # Preserve the approved security release while reconciling infrastructure.
        - name: image.tag
          value: "security-1e0ba0f806c40660ad3a2527fcea5e28676b5542-39580680976@sha256:e95afea05cf01936748872adb8af3d75da0a02f56eb17dacd883f87e73f3c090"
        - name: monitoring.prometheus.replicaCount
          value: "3"
        - name: monitoring.grafana.replicaCount
          value: "3"
  destination:
    server: https://kubernetes.default.svc
    namespace: heterocloud-flow
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
