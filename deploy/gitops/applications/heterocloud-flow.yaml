apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: heterocloud-flow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: hetero-platform
  source:
    repoURL: https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud-Flow.git
    targetRevision: master
    path: deploy/helm/heterocloud-flow
    helm:
      releaseName: heterocloud-flow
      valueFiles:
        - ../../environments/heteronet/values.yaml
      # Monitoring is isolated from the dedicated control-plane members. The
      # two available workers each host one copy; a third failure domain is
      # still needed for three-way monitoring redundancy.
      values: |
        redis:
          sentinel:
            quorum: 2
          replica:
            # Three eligible application hosts; dedicated custodians stay excluded.
            replicaCount: 3
            pdb:
              minAvailable: 2
            extraFlags:
              # Only an incomplete tail up to 4 KiB may be recovered automatically.
              - --aof-load-corrupt-tail-max-size
              - "4096"
        monitoring:
          resourceExporter:
            # Built and tested by the Flow resource-monitoring workflow.
            image: "ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flow-resource-exporter:b21d102b65e9aa2aebf6169611733f0cd733a5a1@sha256:678594846a98a622c786efe236dfddc13c694051dfaca360703cf17827f53b69"
            storageHealth:
              enabled: true
              namespace: longhorn-system
          prometheus:
            nodeSelector:
              monitoring.heteronetwork.io/ha: "true"
            allowedNodes:
              - uc-k8sp5
              - ichikawap1
          grafana:
            nodeSelector:
              monitoring.heteronetwork.io/ha: "true"
            allowedNodes:
              - uc-k8sp5
              - ichikawap1
      parameters:
        # Preserve the approved security release while reconciling infrastructure.
        - name: image.tag
          value: "security-1e0ba0f806c40660ad3a2527fcea5e28676b5542-39580680976@sha256:e95afea05cf01936748872adb8af3d75da0a02f56eb17dacd883f87e73f3c090"
        - name: monitoring.prometheus.replicaCount
          value: "2"
        - name: monitoring.grafana.replicaCount
          value: "2"
  destination:
    server: https://kubernetes.default.svc
    namespace: heterocloud-flow
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
