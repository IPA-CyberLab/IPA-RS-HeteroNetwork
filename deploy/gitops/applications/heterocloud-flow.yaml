apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: heterocloud-flow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: hetero-platform
  source:
    repoURL: https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud-Flow.git
    targetRevision: master
    path: deploy/helm/heterocloud-flow
    helm:
      releaseName: heterocloud-flow
      valueFiles:
        - ../../environments/heteronet/values.yaml
      # Monitoring is isolated from the low-IOPS bootstrap control plane.
      # Four host-network replicas with minAvailable=3 tolerate one complete
      # monitoring-node failure without competing with etcd on uc-k8sp1.
      values: |
        monitoring:
          prometheus:
            nodeSelector:
              monitoring.heteronetwork.io/ha: "true"
          grafana:
            nodeSelector:
              monitoring.heteronetwork.io/ha: "true"
      parameters:
        - name: monitoring.prometheus.replicaCount
          value: "4"
        - name: monitoring.grafana.replicaCount
          value: "4"
  destination:
    server: https://kubernetes.default.svc
    namespace: heterocloud-flow
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
