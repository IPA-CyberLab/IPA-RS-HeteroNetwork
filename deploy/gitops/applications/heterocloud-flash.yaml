apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: heterocloud-flash
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: hetero-platform
  source:
    repoURL: https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud-Flash.git
    targetRevision: b2639060d781940f9a0a04c44a7cb1f0fd4f2636
    path: deploy/helm/heterocloud-flash
    helm:
      releaseName: heterocloud-flash
      values: |
        image:
          tag: "0.1.56-observability.2@sha256:312aeebd0f08a8c6ca663dbf2e29a388ae76d17b0235224c30c0bb66cdc43c32"
        workloadHelperImage: "ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flash:0.1.41@sha256:7a9f9d668bc4eaf9056a69d9f0b520862e84fcc0761733e74e199e5a7ec807ca"
        api:
          replicaCount: 2
        publicDomain: flash.heterocloud.mizuame.app
        workloadIdentity:
          endpoint: https://heterocloud.mizuame.app/
        networkPolicy:
          vpcGuardCidrs:
            - 10.250.0.2/32
            - 10.250.0.10/32
            - 10.250.0.11/32
          additionalProtectedCidrs:
            - 163.220.236.0/24
          dnsCidrs:
            - 10.96.0.10/32
          secretManagerCidrs:
            - 10.250.0.10/32
            - 10.250.0.11/32
        capacity:
          enabled: true
          image: "ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flash-capacity:b2639060d781940f9a0a04c44a7cb1f0fd4f2636@sha256:22c9f99c15045b493524488e9d7d067b46536d056cb9fde1957fe65243a0cd8a"
          replicaCount: 2
          minFreeGiB: 10
          freePercent: 25
          imageExpansionFactor: 6
        backups:
          destinations:
            enabled: true
          offsite:
            # Enable only after independent destination credentials and recovery
            # have been verified. The primary bucket shares the cluster's site.
            enabled: false
          verification:
            enabled: true
            replicaCount: 2
            storageNodeTag: flash-backup-verification
          snapshotClass: flash-disk-backup
          storageNamespace: longhorn-system
        persistence:
          enabled: true
          storageClass: longhorn-static
        adminVolumeClaims:
          - name: escape-syouyu-workspace
            storageClass: syouyu-flash-escape
            size: 10Gi
        adminVolumeMounts:
          "01a05ad9-b529-7573-ad27-e7fe1fb447e3":
            - name: syouyu-workspace
              claimName: escape-syouyu-workspace
              mountPath: /root/syouyu
              readOnly: false
        providerAuth:
          publicKeysJson: |-
            {"heterocloud-provider-1":"-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAs9HXnx9AwepDSdl/w+k2tAYieW3aU8PhlJoQBAFo9X4=\n-----END PUBLIC KEY-----\n"}
        registry:
          enabled: true
          host: registry.heterocloud.mizuame.app
          username: admin
          authSecretName: heterocloud-registry-pull-auth
          passwordKey: password
          workloadPullSecretName: heterocloud-registry-pull
  destination:
    server: https://kubernetes.default.svc
    namespace: heterocloud-flash
  ignoreDifferences:
    - kind: ConfigMap
      name: flash-capacity-reservations
      namespace: heterocloud-flash
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: heterocloud-flash-capacity
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/names/categories
        - /spec/versions/0/additionalPrinterColumns
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: flashdomains.flash.heterocloud.io
      jsonPointers:
        # Admission omits the empty optional aliases emitted by kube-rs.
        - /spec/names/shortNames
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: flashbackups.flash.heterocloud.io
      jsonPointers:
        - /spec/names/shortNames
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
