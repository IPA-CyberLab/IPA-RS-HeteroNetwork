global:
  domain: argocd.heteronetwork.internal
  addPrometheusAnnotations: true
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity:
    podAntiAffinity: hard
  networkPolicy:
    create: true
    defaultDenyIngress: false
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

configs:
  cm:
    url: http://argocd.heteronetwork.internal:8088
  params:
    server.insecure: true

dex:
  enabled: false

notifications:
  enabled: false

redis:
  enabled: false

redis-ha:
  enabled: true
  replicas: 3
  hardAntiAffinity: true
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  persistentVolume:
    enabled: false
  exporter:
    enabled: true
  podDisruptionBudget:
    minAvailable: 2
  haproxy:
    enabled: true
    replicas: 3
    hardAntiAffinity: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    podDisruptionBudget:
      minAvailable: 2
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0

controller:
  replicas: 3
  pdb:
    enabled: true
    minAvailable: 2
  metrics:
    enabled: true

server:
  replicas: 3
  hostNetwork: false
  dnsPolicy: ClusterFirst
  containerPorts:
    server: 8088
    metrics: 8083
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  pdb:
    enabled: true
    minAvailable: 2
  service:
    type: ClusterIP
    servicePortHttp: 8088
    servicePortHttps: 443
  metrics:
    enabled: true

repoServer:
  replicas: 3
  containerPorts:
    server: 28081
    metrics: 28084
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  pdb:
    enabled: true
    minAvailable: 2
  metrics:
    enabled: true

applicationSet:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  metrics:
    enabled: true
