global:
  domain: argocd.heteronetwork.internal
  addPrometheusAnnotations: true
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity:
    podAntiAffinity: hard
  networkPolicy:
    create: true
    defaultDenyIngress: false

configs:
  cm:
    url: http://argocd.heteronetwork.internal
  params:
    server.insecure: true

dex:
  enabled: false

notifications:
  enabled: false

redis:
  enabled: false

redis-ha:
  enabled: true
  replicas: 3
  hardAntiAffinity: true
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  persistentVolume:
    enabled: false
  exporter:
    enabled: true
  podDisruptionBudget:
    minAvailable: 2
  haproxy:
    enabled: true
    replicas: 3
    hardAntiAffinity: true
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    podDisruptionBudget:
      minAvailable: 2

controller:
  replicas: 3
  pdb:
    enabled: true
    minAvailable: 2
  metrics:
    enabled: true

server:
  replicas: 3
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  extraArgs:
    - --listen-address=$(ARGOCD_NODE_IP)
  env:
    - name: ARGOCD_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
  containerPorts:
    server: 80
    metrics: 8083
  containerSecurityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
  pdb:
    enabled: true
    minAvailable: 2
  service:
    type: ClusterIP
    servicePortHttp: 80
    servicePortHttps: 443
  metrics:
    enabled: true

repoServer:
  replicas: 3
  pdb:
    enabled: true
    minAvailable: 2
  metrics:
    enabled: true

applicationSet:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  metrics:
    enabled: true
