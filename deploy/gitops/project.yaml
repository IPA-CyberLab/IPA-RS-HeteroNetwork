apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hetero-platform
  namespace: argocd
spec:
  description: HeteroNetwork and HeteroCloud production workloads
  sourceRepos:
    - https://github.com/IPA-CyberLab/IPA-RS-HeteroNetwork.git
    - https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud.git
    - https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud-Flow.git
    - docker.io/envoyproxy
  destinations:
    - namespace: kube-system
      server: https://kubernetes.default.svc
    - namespace: envoy-gateway-system
      server: https://kubernetes.default.svc
    - namespace: heterocloud-edge
      server: https://kubernetes.default.svc
    - namespace: heterocloud
      server: https://kubernetes.default.svc
    - namespace: heterocloud-flow
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
