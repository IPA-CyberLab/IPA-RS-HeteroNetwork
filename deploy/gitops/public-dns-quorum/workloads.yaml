---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-dns-voter-ichikawap1
  namespace: heterocloud-dns
  labels:
    app.kubernetes.io/name: public-dns-quorum
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: public-dns-voter-ichikawap1
subjects:
- kind: ServiceAccount
  name: public-dns-voter-ichikawap1
  namespace: heterocloud-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-dns-voter-ichikawap1
  namespace: heterocloud-dns
  labels:
    app.kubernetes.io/name: public-dns-quorum
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: public-dns-quorum
      app.kubernetes.io/component: voter
      dns.heterocloud.io/voter-id: ichikawap1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: public-dns-voter-ichikawap1
      automountServiceAccountToken: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ichikawap1
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: voter
        image: python:3.13.7-bookworm@sha256:c900d35aba5fe4c1dc1cd358408baae2902ff2a2926a1d15cc5002c6061ddb2e
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -B
        - /config/controller.py
        - voter
        - --voter-id
        - ichikawap1
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        resources:
          requests:
            cpu: 5m
            memory: 24Mi
          limits:
            cpu: 200m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - python3
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/last-success').st_mtime
              < 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - python3
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/loop-progress').st_mtime
              < 120
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          initialDelaySeconds: 30
      volumes:
      - name: config
        configMap:
          name: public-dns-quorum-runtime
          defaultMode: 292
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 4Mi
