apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: heterocloud-syouyu-s3-public
  namespace: heterocloud-syouyu
  labels:
    dns.heterocloud.io/publish: "true"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: s3.heterocloud.mizuame.app
    external-dns.alpha.kubernetes.io/gateway-hostname-source: annotation-only
    external-dns.alpha.kubernetes.io/ttl: "60"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: heterocloud-edge
      namespace: heterocloud-edge
      sectionName: http
  hostnames:
    - s3.heterocloud.mizuame.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - group: ""
          kind: Service
          name: heterocloud-syouyu-s3
          port: 3900
          weight: 1
