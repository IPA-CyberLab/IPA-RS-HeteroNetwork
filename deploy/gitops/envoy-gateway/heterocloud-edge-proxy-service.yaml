apiVersion: v1
kind: Service
metadata:
  name: heterocloud-edge-proxy
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/part-of: heterocloud-edge
spec:
  # Gateway agents run on every public node, while Envoy replicas may be
  # scheduled elsewhere. Keep cross-node forwarding available.
  internalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gateway-name: heterocloud-edge
    gateway.envoyproxy.io/owning-gateway-namespace: heterocloud-edge
  ports:
    - name: http-18081
      port: 18081
      targetPort: 18081
      protocol: TCP
