apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-rate-limit-redis-proxy
  namespace: envoy-gateway-system
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
      maxconn 2048

    defaults
      log global
      mode tcp
      timeout connect 5s
      timeout client 30s
      timeout server 30s

    resolvers kubernetes
      parse-resolv-conf
      accepted_payload_size 8192
      resolve_retries 3
      timeout resolve 1s
      timeout retry 1s
      hold valid 10s
      hold other 30s
      hold refused 30s
      hold nx 30s
      hold timeout 30s

    listen redis-primary
      bind :6379
      mode tcp
      option tcp-check
      tcp-check connect
      tcp-check send-binary 2a310d0a24340d0a494e464f0d0a
      tcp-check expect string role:master
      server redis-0 heterocloud-flow-redis-node-0.heterocloud-flow-redis-headless.heterocloud-flow.svc.cluster.local:6379 check inter 2s fall 3 rise 2 resolvers kubernetes init-addr libc,none
      server redis-1 heterocloud-flow-redis-node-1.heterocloud-flow-redis-headless.heterocloud-flow.svc.cluster.local:6379 check inter 2s fall 3 rise 2 resolvers kubernetes init-addr libc,none
      server redis-2 heterocloud-flow-redis-node-2.heterocloud-flow-redis-headless.heterocloud-flow.svc.cluster.local:6379 check inter 2s fall 3 rise 2 resolvers kubernetes init-addr libc,none
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-rate-limit-redis
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-rate-limit-redis
    app.kubernetes.io/component: rate-limit-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-rate-limit-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envoy-rate-limit-redis
        app.kubernetes.io/component: rate-limit-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: envoy-rate-limit-redis
      containers:
        - name: haproxy
          image: docker.io/library/haproxy:3.2.7-alpine@sha256:3b80483d47e1c7d1fc7eb4b9104f33d9a51259769be299eb675524dca2bc8157
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - /usr/local/etc/haproxy/haproxy.cfg
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: envoy-rate-limit-redis-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-rate-limit-redis
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-rate-limit-redis
    app.kubernetes.io/component: rate-limit-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: envoy-rate-limit-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envoy-rate-limit-redis
  namespace: envoy-gateway-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-rate-limit-redis
