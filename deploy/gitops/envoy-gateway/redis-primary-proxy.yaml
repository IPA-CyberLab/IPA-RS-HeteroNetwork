apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: envoy-rate-limit-redis
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-rate-limit-redis
    app.kubernetes.io/component: rate-limit-backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-rate-limit-redis
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envoy-rate-limit-redis
        app.kubernetes.io/component: rate-limit-backend
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 99
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haproxy
          image: docker.io/library/haproxy:3.2.7-alpine@sha256:3b80483d47e1c7d1fc7eb4b9104f33d9a51259769be299eb675524dca2bc8157
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - /usr/local/etc/haproxy/haproxy.cfg
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
            - name: health
              containerPort: 8404
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: envoy-rate-limit-redis-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-rate-limit-redis
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: envoy-rate-limit-redis
    app.kubernetes.io/component: rate-limit-backend
spec:
  type: ClusterIP
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: envoy-rate-limit-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envoy-rate-limit-redis
  namespace: envoy-gateway-system
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-rate-limit-redis
