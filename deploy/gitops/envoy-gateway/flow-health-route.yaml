apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flow-health
  namespace: heterocloud-flow
spec:
  parentRefs:
    - name: heterocloud-edge
      namespace: heterocloud-edge
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /health/live
      backendRefs:
        - name: heterocloud-flow-api
          port: 8080
