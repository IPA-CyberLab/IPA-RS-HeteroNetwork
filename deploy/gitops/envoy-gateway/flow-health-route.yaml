apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flow-health
  namespace: heterocloud-flow
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: heterocloud-edge
      namespace: heterocloud-edge
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /health/live
      backendRefs:
        - group: ""
          kind: Service
          name: heterocloud-flow-api
          port: 8080
          weight: 1
