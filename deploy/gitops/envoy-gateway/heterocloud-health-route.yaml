apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: heterocloud-health
  namespace: heterocloud
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: heterocloud-edge
      namespace: heterocloud-edge
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v1/health/live
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: heterocloud-api
          weight: 1
