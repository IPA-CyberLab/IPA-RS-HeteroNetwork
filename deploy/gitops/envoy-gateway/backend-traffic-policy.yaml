apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: heterocloud-abuse-limit
  namespace: heterocloud
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: heterocloud-public
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: heterocloud-health
  # During the node-not-ready grace period DNS can still expose a stale Pod
  # endpoint. Retry failed requests while active and passive checks eject that
  # endpoint, allowing a surviving API replica to take over immediately.
  retry:
    numRetries: 7
    perRetry:
      timeout: 3s
  healthCheck:
    panicThreshold: 0
    active:
      type: HTTP
      interval: 2s
      timeout: 1s
      healthyThreshold: 1
      unhealthyThreshold: 1
      http:
        path: /api/v1/health/live
        expectedStatuses:
          - 200
    passive:
      interval: 1s
      baseEjectionTime: 30s
      consecutive5XxErrors: 2
      consecutiveGatewayErrors: 2
      consecutiveLocalOriginFailures: 1
      maxEjectionPercent: 100
      splitExternalLocalOriginErrors: true
  timeout:
    http:
      requestTimeout: 25s
  rateLimit:
    # This per-proxy limit remains active when the global Redis-backed
    # limiter is unavailable. The global rule below still provides the
    # normal shared 200 req/s ceiling across all Envoy replicas.
    local:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
                invert: false
          limit:
            requests: 200
            unit: Second
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
                invert: false
          limit:
            requests: 200
            unit: Second
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
                invert: false
          limit:
            requests: 200
            unit: Second
          shared: true
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
                invert: false
          limit:
            requests: 200
            unit: Second
          shared: true
