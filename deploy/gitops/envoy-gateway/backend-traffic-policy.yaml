apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: heterocloud-abuse-limit
  namespace: heterocloud
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: heterocloud-public
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: heterocloud-health
  rateLimit:
    # This per-proxy limit remains active when the global Redis-backed
    # limiter is unavailable. The global rule below still provides the
    # normal shared 200 req/s ceiling across all Envoy replicas.
    local:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
                invert: false
          limit:
            requests: 200
            unit: Second
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
                invert: false
          limit:
            requests: 200
            unit: Second
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
                invert: false
          limit:
            requests: 200
            unit: Second
          shared: true
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
                invert: false
          limit:
            requests: 200
            unit: Second
          shared: true
