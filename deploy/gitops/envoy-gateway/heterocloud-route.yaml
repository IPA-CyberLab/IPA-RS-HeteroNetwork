apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: heterocloud-public
  namespace: heterocloud
  labels:
    dns.heterocloud.io/publish: "true"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: heterocloud.mizuame.app
    external-dns.alpha.kubernetes.io/gateway-hostname-source: annotation-only
    external-dns.alpha.kubernetes.io/ttl: "60"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: heterocloud-edge
      namespace: heterocloud-edge
      sectionName: http
  hostnames:
    - heterocloud.mizuame.app
    - cloud-a.heterocloud.mizuame.app
    - cloud-b.heterocloud.mizuame.app
    - cloud-c.heterocloud.mizuame.app
    - cloud-d.heterocloud.mizuame.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: heterocloud-api
          weight: 1
