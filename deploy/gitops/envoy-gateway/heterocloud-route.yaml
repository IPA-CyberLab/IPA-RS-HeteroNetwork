apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: heterocloud-public
  namespace: heterocloud
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: heterocloud-edge
      namespace: heterocloud-edge
      sectionName: http
  hostnames:
    - heterocloud.mizuame.app
    - cloud-a.heterocloud.mizuame.app
    - cloud-b.heterocloud.mizuame.app
    - cloud-c.heterocloud.mizuame.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: heterocloud-api
          weight: 1
