apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-gateway-health
  namespace: heterocloud-dns
  labels:
    dns.heterocloud.io/publish: "false"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: heterocloud-edge
      namespace: heterocloud-edge
      sectionName: http
  hostnames:
    - gateway-health.flash.heterocloud.mizuame.app
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: public-gateway-health
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: public-gateway-health
  namespace: heterocloud-dns
spec:
  directResponse:
    statusCode: 200
    contentType: text/plain
    body:
      type: Inline
      inline: "HeteroNetwork public gateway ready\n"
