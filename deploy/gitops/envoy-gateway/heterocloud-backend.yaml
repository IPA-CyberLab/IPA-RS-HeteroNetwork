apiVersion: v1
kind: Service
metadata:
  name: heterocloud-edge-backend
  namespace: heterocloud
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: heterocloud
    app.kubernetes.io/name: heterocloud
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
      appProtocol: https
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: heterocloud-api
  namespace: heterocloud
spec:
  endpoints:
    - fqdn:
        # A headless Service exposes each API Pod to Envoy independently. This
        # lets health checks eject only endpoints on failed nodes instead of
        # treating a kube-proxy ClusterIP as one indivisible backend.
        hostname: heterocloud-edge-backend.heterocloud.svc.cluster.local
        port: 8443
  tls:
    # TLS terminates at the managed Caddy edge. This is the existing private
    # HeteroCloud TLS hop; its certificate is not a public CA certificate.
    insecureSkipVerify: true
