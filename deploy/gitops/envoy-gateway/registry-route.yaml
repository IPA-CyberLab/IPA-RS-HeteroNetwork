apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: heterocloud-registry-public
  namespace: heterocloud-registry
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: heterocloud-edge
      namespace: heterocloud-edge
      sectionName: http
  hostnames:
    - registry.heterocloud.mizuame.app
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v2
        - path:
            type: PathPrefix
            value: /service/token
        - path:
            type: Exact
            value: /api/v2.0/health
      backendRefs:
        - group: ""
          kind: Service
          name: harbor
          port: 80
          weight: 1
