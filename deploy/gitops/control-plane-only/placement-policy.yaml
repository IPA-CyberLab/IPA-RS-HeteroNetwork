apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: heteronetwork-control-plane-only-pods
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods
  validations:
  - expression: "!has(object.spec.nodeName) || !(object.spec.nodeName in ['uc-k8sp1', 'uc-k8sp2', 'uc-k8s3p']) ||\
      \ (request.namespace == 'kube-system' &&\n object.metadata.name.matches('^(etcd|kube-apiserver|kube-controller-manager|kube-scheduler)-')\
      \ &&\n has(object.metadata.annotations) &&\n 'kubernetes.io/config.mirror' in object.metadata.annotations\
      \ &&\n request.userInfo.username == 'system:node:' + object.spec.nodeName) ||\n(request.namespace == 'kube-flannel'\
      \ && object.metadata.name.startsWith('kube-flannel-ds-')) || (request.namespace == 'kube-system' && object.metadata.name.startsWith('kube-proxy-'))\
      \ || (request.namespace == 'kube-system' &&\n has(object.spec.hostNetwork) && object.spec.hostNetwork &&\n\
      \ ((object.metadata.name.startsWith('node-local-dns-') &&\n   object.spec.serviceAccountName == 'node-local-dns')\
      \ ||\n  object.metadata.name.startsWith('kubernetes-service-route-') ||\n  (object.metadata.name.startsWith('kube-router-network-policy-')\
      \ &&\n   object.spec.serviceAccountName == 'kube-router-network-policy'))) ||\n(request.namespace == 'openbao'\
      \ &&\n object.metadata.name.matches('^openbao-[0-2]$') &&\n has(object.metadata.labels) &&\n object.metadata.labels['app.kubernetes.io/name']\
      \ == 'openbao' &&\n object.metadata.labels['app.kubernetes.io/instance'] == 'openbao' &&\n object.metadata.labels['component']\
      \ == 'server' &&\n object.spec.serviceAccountName == 'openbao') || (request.namespace == 'openbao' && object.metadata.name.startsWith('openbao-agent-injector-')\
      \ && has(object.metadata.labels) && object.metadata.labels['app.kubernetes.io/name'] == 'openbao-agent-injector'\
      \ && object.metadata.labels['component'] == 'webhook' && object.spec.serviceAccountName == 'openbao-agent-injector'\
      \ && size(object.spec.containers) == 1 && object.spec.containers[0].image == 'docker.io/hashicorp/vault-k8s:1.7.2')"
    message: This node runs only Kubernetes control-plane components, networking, and OpenBao.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: heteronetwork-control-plane-only-pods
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  policyName: heteronetwork-control-plane-only-pods
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: heteronetwork-control-plane-only-bindings
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods/binding
      - bindings
  validations:
  - expression: "!(object.target.name in ['uc-k8sp1', 'uc-k8sp2', 'uc-k8s3p']) || (request.namespace == 'kube-flannel'\
      \ && object.metadata.name.startsWith('kube-flannel-ds-')) || (request.namespace == 'kube-system' && object.metadata.name.startsWith('kube-proxy-'))\
      \ || (request.namespace == 'kube-system' &&\n (object.metadata.name.startsWith('node-local-dns-') ||\n  object.metadata.name.startsWith('kubernetes-service-route-')\
      \ ||\n  object.metadata.name.startsWith('kube-router-network-policy-'))) ||\n(request.namespace == 'openbao'\
      \ && object.metadata.name.matches('^openbao-[0-2]$')) || (request.namespace == 'openbao' && object.metadata.name.startsWith('openbao-agent-injector-'))"
    message: Only control-plane, networking, and OpenBao Pods can bind to this node.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: heteronetwork-control-plane-only-bindings
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  policyName: heteronetwork-control-plane-only-bindings
  validationActions:
  - Deny
