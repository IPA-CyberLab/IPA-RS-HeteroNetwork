apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: heteronetwork-control-plane-only-pods
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods
  validations:
  - expression: "!has(object.spec.nodeName) || !(object.spec.nodeName in ['uc-k8sp1',\
      \ 'uc-k8sp2', 'uc-k8s3p']) || (request.namespace == 'kube-system' &&\n object.metadata.name.matches('^(etcd|kube-apiserver|kube-controller-manager|kube-scheduler)-')\
      \ &&\n has(object.metadata.annotations) &&\n 'kubernetes.io/config.mirror' in\
      \ object.metadata.annotations &&\n request.userInfo.username == 'system:node:'\
      \ + object.spec.nodeName) ||\n(request.namespace == 'kube-flannel' && object.metadata.name.startsWith('kube-flannel-ds-'))\
      \ || (request.namespace == 'kube-system' && object.metadata.name.startsWith('kube-proxy-'))"
    message: This node runs only Kubernetes control-plane components, Flannel and
      kube-proxy.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: heteronetwork-control-plane-only-pods
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  policyName: heteronetwork-control-plane-only-pods
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: heteronetwork-control-plane-only-bindings
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods/binding
      - bindings
  validations:
  - expression: '!(object.target.name in [''uc-k8sp1'', ''uc-k8sp2'', ''uc-k8s3p''])
      || (request.namespace == ''kube-flannel'' && object.metadata.name.startsWith(''kube-flannel-ds-''))
      || (request.namespace == ''kube-system'' && object.metadata.name.startsWith(''kube-proxy-''))'
    message: Application and storage Pods cannot bind to this control-plane-only node.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: heteronetwork-control-plane-only-bindings
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  policyName: heteronetwork-control-plane-only-bindings
  validationActions:
  - Deny
