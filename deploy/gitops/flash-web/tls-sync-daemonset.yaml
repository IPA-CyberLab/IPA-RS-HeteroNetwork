apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flash-web-tls-sync
  namespace: heterocloud-dns
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flash-web-tls-sync
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flash-web-tls-sync
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        # Established by deploy/gitops/envoy-gateway/envoyproxy.yaml.
        networking.heteronetwork.io/public-ingress: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [uc-k8s3p, ichikawap1]
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sync
          # Full Debian Python image includes the OpenSSL CLI; no runtime install.
          image: python:3.13.7-bookworm@sha256:c900d35aba5fe4c1dc1cd358408baae2902ff2a2926a1d15cc5002c6061ddb2e
          imagePullPolicy: IfNotPresent
          command: [python3, -B, /code/tls-sync.py]
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,time; assert time.time()-os.stat('/tmp/last-success').st_mtime < 180"
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: host-config
              mountPath: /etc/heteronetwork
            - name: host-group
              mountPath: /host-group
              readOnly: true
            - name: tls
              mountPath: /var/run/flash-web-tls
              readOnly: true
            - name: code
              mountPath: /code
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: host-config
          hostPath:
            path: /etc/heteronetwork
            type: Directory
        - name: host-group
          hostPath:
            path: /etc/group
            type: File
        - name: tls
          secret:
            secretName: flash-web-tls
            defaultMode: 0400
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: code
          configMap:
            name: flash-web-tls-sync
            defaultMode: 0444
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
