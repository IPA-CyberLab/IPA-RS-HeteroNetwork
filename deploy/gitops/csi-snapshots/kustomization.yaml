apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crds.yaml
  - rbac.yaml
  - controller.yaml
  - backup-class.yaml
patches:
  - target:
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: retained-snapshot-metadata
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
