apiVersion: v1
kind: Service
metadata:
  name: argocd-server-overlay
  namespace: argocd
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-server-overlay
    app.kubernetes.io/part-of: argocd
spec:
  type: ClusterIP
  externalIPs:
    - 10.250.0.4
    - 10.250.0.5
    - 10.250.0.6
  ports:
    - name: http
      port: 8088
      protocol: TCP
      targetPort: 8088
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-server
  sessionAffinity: None
