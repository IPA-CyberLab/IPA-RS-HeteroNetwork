apiVersion: v1
kind: Namespace
metadata:
  name: heartbeat-e2e
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: persistent-home
  namespace: heartbeat-e2e
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: persistent-web
  namespace: heartbeat-e2e
data:
  server.py: |
    import http.server, os
    from pathlib import Path
    marker = Path('/data/marker')
    if not marker.exists():
        with marker.open('w') as f:
            f.write('heartbeat-e2e-persistent-home-v1')
            f.flush()
            os.fsync(f.fileno())
    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                body = marker.read_bytes()
                # Exercise the RWX data path for every HTTP request.
                with Path('/data/last-read').open('w') as f:
                    f.write(self.path)
                    f.flush()
                    os.fsync(f.fileno())
                self.send_response(200)
                self.end_headers()
                self.wfile.write(body)
            except OSError:
                self.send_error(503)
        def log_message(self, *args): pass
    http.server.ThreadingHTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistent-web
  namespace: heartbeat-e2e
spec:
  replicas: 1
  selector:
    matchLabels: {app: persistent-web}
  template:
    metadata:
      labels: {app: persistent-web}
    spec:
      containers:
        - name: web
          image: python:3.12.12-alpine3.22
          command: [python3, /app/server.py]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
            timeoutSeconds: 2
          volumeMounts:
            - {name: home, mountPath: /data}
            - {name: app, mountPath: /app, readOnly: true}
      volumes:
        - name: home
          persistentVolumeClaim: {claimName: persistent-home}
        - name: app
          configMap: {name: persistent-web}
---
apiVersion: v1
kind: Service
metadata:
  name: persistent-web
  namespace: heartbeat-e2e
spec:
  selector: {app: persistent-web}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: fixture
  namespace: heartbeat-e2e
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
      envoyDeployment:
        replicas: 1
        pod:
          nodeSelector:
            kubernetes.io/hostname: hnn-heartbeat-e2e-control-plane
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: fixture
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fixture
  namespace: heartbeat-e2e
spec:
  gatewayClassName: fixture
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: fixture
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fixture
  namespace: heartbeat-e2e
spec:
  parentRefs: [{name: fixture}]
  rules:
    - backendRefs: [{name: persistent-web, port: 8080}]
