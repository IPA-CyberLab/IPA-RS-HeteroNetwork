name: macOS client

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "clients/macos/**"
      - "install-client.sh"
      - ".github/workflows/macos-client.yml"
      - ".github/workflows/macos-release-live-e2e.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "clients/macos/**"
      - "install-client.sh"
      - ".github/workflows/macos-client.yml"
      - ".github/workflows/macos-release-live-e2e.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: macos-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.client_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            client_arch: arm64
            machine_arch: arm64
          - runner: macos-15-intel
            client_arch: x64
            machine_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: 2.45.4
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_dir="$RUNNER_TEMP/xcodegen-install"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$archive" \
            | shasum --algorithm 256 --check
          ditto -x -k "$archive" "$install_dir"
          printf '%s\n' "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Install WireGuard-compatible Go toolchain
        env:
          EXPECTED_MACHINE_ARCH: ${{ matrix.machine_arch }}
          GO_VERSION: 1.20.14
          GO_AMD64_SHA256: 754363489e2244e72cb49b4ec6ddfd6a2c60b0700f8c4876e11befb1913b11c5
          GO_ARM64_SHA256: 6da3f76164b215053daf730a9b8f1d673dbbaa4c61031374a6744b75cb728641
        run: |
          set -euo pipefail
          machine_arch="$(uname -m)"
          test "$machine_arch" = "$EXPECTED_MACHINE_ARCH"
          case "$machine_arch" in
            x86_64)
              go_arch=amd64
              expected_sha256="$GO_AMD64_SHA256"
              ;;
            arm64)
              go_arch=arm64
              expected_sha256="$GO_ARM64_SHA256"
              ;;
            *)
              echo "Unsupported macOS runner architecture: $machine_arch" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/go${GO_VERSION}.darwin-${go_arch}.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            --output "$archive" \
            "https://go.dev/dl/go${GO_VERSION}.darwin-${go_arch}.tar.gz"
          printf '%s  %s\n' "$expected_sha256" "$archive" \
            | shasum --algorithm 256 --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"

      - name: Validate installer and privileged helper
        run: |
          set -euo pipefail
          sh -n install-client.sh
          sh install-client.sh --self-test
          (
            cd clients/macos/RootHelper
            test -z "$(gofmt -l .)"
            go test -mod=readonly ./...
            go vet -mod=readonly ./...
          )

      - name: Generate Xcode project
        working-directory: clients/macos
        run: ./scripts/bootstrap.sh

      - name: Run macOS client tests
        working-directory: clients/macos
        run: |
          set -euo pipefail
          xcodebuild test \
            -project HeteroNetwork.xcodeproj \
            -scheme HeteroNetwork \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/HeteroNetworkDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build and validate release application
        env:
          CLIENT_ARCH: ${{ matrix.client_arch }}
          MACHINE_ARCH: ${{ matrix.machine_arch }}
          RELEASE_TAG: v0.0.0-ci
        working-directory: clients/macos
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HeteroNetwork.xcodeproj \
            -scheme HeteroNetwork \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/HeteroNetworkDerivedData" \
            HETERONETWORK_RELEASE_TAG="$RELEASE_TAG" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          app="$RUNNER_TEMP/HeteroNetworkDerivedData/Build/Products/Release/HeteroNetwork.app"
          helper="$app/Contents/Resources/heteronetwork-root-helper"
          test -x "$app/Contents/MacOS/HeteroNetwork"
          test -x "$helper"
          test "$(/usr/libexec/PlistBuddy -c 'Print :HeteroNetworkReleaseTag' "$app/Contents/Info.plist")" \
            = "$RELEASE_TAG"
          test "$(/usr/libexec/PlistBuddy -c 'Print :HeteroNetworkReleaseFeedFallback' "$app/Contents/Info.plist")" \
            = true
          xcrun lipo "$app/Contents/MacOS/HeteroNetwork" -verify_arch "$MACHINE_ARCH"
          xcrun lipo "$helper" -verify_arch "$MACHINE_ARCH"
          "$helper" self-test
          codesign --force --sign - "$helper"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          asset="$RUNNER_TEMP/heteronetwork-client-macos-${CLIENT_ARCH}.zip"
          ditto -c -k --keepParent "$app" "$asset"
          shasum --algorithm 256 "$asset" > "$asset.sha256"
