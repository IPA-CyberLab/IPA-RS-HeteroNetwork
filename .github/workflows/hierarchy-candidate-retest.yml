name: Hierarchy candidate E2E retest

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Workflow run containing the candidate binaries
        required: true
        type: string
      candidate_sha:
        description: Full source commit of that candidate
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  retest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ && "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" |
            jq -e --arg sha "$CANDIDATE_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '.head_sha == $sha and .event == "push" and .repository.full_name == $repo' >/dev/null
      - name: Download the exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hierarchy-native-candidate-${{ inputs.candidate_sha }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Validate and unpack candidate
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          diff -u <(printf 'ipars\niparsd\n') <(tar -tzf native-bin.tar.gz | sort)
          python3 - <<'PY'
          import pathlib, re, tarfile
          lines = pathlib.Path('native-bin.sha256').read_text().splitlines()
          if len(lines) != 2 or not re.fullmatch(r'[0-9a-f]{64}  ipars', lines[0]) or not re.fullmatch(r'[0-9a-f]{64}  iparsd', lines[1]):
              raise SystemExit('invalid candidate checksum manifest')
          with tarfile.open('native-bin.tar.gz') as archive:
              entries = archive.getmembers()
              if sorted(entry.name for entry in entries) != ['ipars', 'iparsd'] or not all(entry.isfile() for entry in entries):
                  raise SystemExit('candidate contains unexpected archive entries')
          PY
          tar -xzf native-bin.tar.gz
          sha256sum -c native-bin.sha256
      - name: Install Linux networking prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iproute2 iptables iputils-ping jq kmod procps python3-cryptography wireguard-tools
          for module in wireguard nf_conntrack nf_conntrack_netlink xt_conntrack sch_netem; do sudo modprobe "$module"; done
      - name: Exercise automatic flow detection, latency and failover
        run: |
          sudo env PATH="/usr/sbin:/usr/bin:/sbin:/bin" \
            HETERONETWORK_E2E_IPARS="$RUNNER_TEMP/candidate/ipars" \
            HETERONETWORK_E2E_IPARSD="$RUNNER_TEMP/candidate/iparsd" \
            scripts/strict-hierarchy-netns-e2e.sh
      - name: Verify automatic flow detection when conntrack snapshots fail
        run: |
          sudo env PATH="/usr/sbin:/usr/bin:/sbin:/bin" \
            HETERONETWORK_E2E_IPARS="$RUNNER_TEMP/candidate/ipars" \
            HETERONETWORK_E2E_IPARSD="$RUNNER_TEMP/candidate/iparsd" \
            HETERONETWORK_E2E_REJECT_CONNTRACK_DUMPS=1 \
            HETERONETWORK_E2E_SKIP_NETEM=1 \
            scripts/strict-hierarchy-netns-e2e.sh
