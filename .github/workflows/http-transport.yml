name: HTTP transport fallback
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['crates/**', 'clients/transport/**', 'Cargo.toml', 'Cargo.lock', 'webui/src/**', 'webui/e2e/**', '.github/workflows/http-transport.yml']
  pull_request:
    paths: ['crates/**', 'clients/transport/**', 'Cargo.toml', 'Cargo.lock', 'webui/src/**', 'webui/e2e/**', '.github/workflows/http-transport.yml']
permissions:
  contents: read
concurrency:
  group: http-transport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
      - name: Format and lint
        run: |
          cargo +1.96.1 fmt --all -- --check
          cargo +1.96.1 clippy --locked --workspace --all-targets -- -D warnings
      - name: Test control plane, admission, encrypted UDP blackout and recovery
        run: cargo +1.96.1 test --locked --workspace
  native-transport:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.27.2', cache: false}
      - name: Test HTTP and verified HTTPS fallback with race detection
        working-directory: clients/transport
        run: go test -mod=readonly -race ./...
      - name: Build the actual native transport process
        working-directory: clients/transport
        run: go build -mod=readonly -trimpath ./cmd/proxy
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - run: npm ci
      - run: node webui/build-app.mjs
      - run: npm run test:webui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:webui:e2e -- --workers=2
