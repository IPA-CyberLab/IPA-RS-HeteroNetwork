name: HTTP transport fallback
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['crates/**', 'charts/**', 'docker/**', 'scripts/helm-smoke.sh', 'clients/transport/**', 'Cargo.toml', 'Cargo.lock', 'webui/src/**', 'webui/e2e/**', '.github/workflows/http-transport.yml']
  pull_request:
    paths: ['crates/**', 'charts/**', 'docker/**', 'scripts/helm-smoke.sh', 'clients/transport/**', 'Cargo.toml', 'Cargo.lock', 'webui/src/**', 'webui/e2e/**', '.github/workflows/http-transport.yml']
permissions:
  contents: read
concurrency:
  group: http-transport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
      - name: Install the pinned gateway parser for configuration tests
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, re, tarfile, urllib.request
          source = pathlib.Path('crates/ipars-control-plane-http/src/lib.rs').read_text()
          version = re.search(r'const NODE_ENROLLMENT_CADDY_VERSION: &str = "([^"]+)"', source).group(1)
          expected = re.search(r'const NODE_ENROLLMENT_CADDY_SHA256: &str =\s*"([a-f0-9]{64})"', source).group(1)
          url = f'https://github.com/caddyserver/caddy/releases/download/v{version}/caddy_{version}_linux_amd64.tar.gz'
          with urllib.request.urlopen(url, timeout=60) as response:
              archive = response.read(100 * 1024 * 1024)
          assert hashlib.sha256(archive).hexdigest() == expected, 'gateway archive checksum mismatch'
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'heteronet-test-caddy'
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              destination.write_bytes(bundle.extractfile('caddy').read())
          destination.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'HETERONETWORK_TEST_CADDY={destination}\n')
          PY
      - name: Format and lint
        run: |
          cargo +1.96.1 fmt --all -- --check
          cargo +1.96.1 clippy --locked --workspace --all-targets -- -D warnings
      - name: Test control plane, admission, encrypted UDP blackout and recovery
        run: cargo +1.96.1 test --locked --workspace
  native-transport:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.27.2', cache: false}
      - name: Test TCP, HTTP and verified HTTPS fallback with race detection
        working-directory: clients/transport
        run: go test -mod=readonly -race ./...
      - name: Build the actual native transport process
        working-directory: clients/transport
        run: go build -mod=readonly -trimpath ./cmd/proxy
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - run: npm ci
      - run: node webui/build-app.mjs
      - run: npm run test:webui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:webui:e2e -- --workers=2

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HETERONETWORK_HELM_IMAGE: alpine/helm@sha256:31ce11c4ee98c5e1e13628ead9212e665f32c3277cae63bd55ced32989089f3e
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - name: Validate chart ports and network policies
        run: scripts/helm-smoke.sh
