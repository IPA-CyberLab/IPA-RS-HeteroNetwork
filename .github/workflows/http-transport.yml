name: HTTP transport fallback
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['crates/**', 'charts/**', 'docker/**', 'scripts/helm-smoke.sh', 'scripts/http_mesh_restricted_e2e.py', 'clients/transport/**', 'clients/headless/**', 'deploy/http-mesh/**', 'Cargo.toml', 'Cargo.lock', 'webui/src/**', 'webui/e2e/**', '.github/workflows/http-transport.yml']
  pull_request:
    paths: ['crates/**', 'charts/**', 'docker/**', 'scripts/helm-smoke.sh', 'scripts/http_mesh_restricted_e2e.py', 'clients/transport/**', 'clients/headless/**', 'deploy/http-mesh/**', 'Cargo.toml', 'Cargo.lock', 'webui/src/**', 'webui/e2e/**', '.github/workflows/http-transport.yml']
permissions:
  contents: read
concurrency:
  group: http-transport-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
      - name: Install the pinned gateway parser for configuration tests
        run: |
          python3 - <<'PY'
          import hashlib, io, os, pathlib, re, tarfile, urllib.request
          source = pathlib.Path('crates/ipars-control-plane-http/src/lib.rs').read_text()
          version = re.search(r'const NODE_ENROLLMENT_CADDY_VERSION: &str = "([^"]+)"', source).group(1)
          expected = re.search(r'const NODE_ENROLLMENT_CADDY_SHA256: &str =\s*"([a-f0-9]{64})"', source).group(1)
          url = f'https://github.com/caddyserver/caddy/releases/download/v{version}/caddy_{version}_linux_amd64.tar.gz'
          with urllib.request.urlopen(url, timeout=60) as response:
              archive = response.read(100 * 1024 * 1024)
          assert hashlib.sha256(archive).hexdigest() == expected, 'gateway archive checksum mismatch'
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'heteronet-test-caddy'
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              destination.write_bytes(bundle.extractfile('caddy').read())
          destination.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'HETERONETWORK_TEST_CADDY={destination}\n')
          PY
      - name: Format and lint
        run: |
          cargo +1.96.1 fmt --all -- --check
          cargo +1.96.1 clippy --locked --workspace --all-targets -- -D warnings
      - name: Test control plane, admission, encrypted UDP blackout and recovery
        run: cargo +1.96.1 test --locked --workspace
      - name: Build the shared-store HTTP acceptance server
        run: cargo +1.96.1 build --locked -p ipars-daemon --example http_mesh_fixture
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: http-mesh-fixture
          path: target/debug/examples/http_mesh_fixture
          retention-days: 2
  native-server:
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - run: rustup toolchain install 1.96.1 --profile minimal
      - name: Build the tested native server for production rollout
        run: cargo +1.96.1 build --locked --release -p ipars-daemon --bin iparsd
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: http-mesh-native-server
          path: target/release/iparsd
          retention-days: 7

  native-transport:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: '1.27.2', cache: false}
      - name: Test TCP, HTTP and verified HTTPS fallback with race detection
        working-directory: clients/transport
        run: go test -mod=readonly -race ./...
      - name: Build the actual native transport process
        working-directory: clients/transport
        run: go build -mod=readonly -trimpath ./cmd/proxy
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - run: npm ci
      - run: node webui/build-app.mjs
      - run: npm run test:webui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:webui:e2e -- --workers=2

  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HETERONETWORK_HELM_IMAGE: alpine/helm@sha256:31ce11c4ee98c5e1e13628ead9212e665f32c3277cae63bd55ced32989089f3e
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {persist-credentials: false}
      - name: Validate chart ports and network policies
        run: scripts/helm-smoke.sh

  http-mesh:
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ipars, POSTGRES_PASSWORD: disposable-mesh-test, POSTGRES_DB: http_mesh_e2e}
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U ipars -d http_mesh_e2e' --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HTTP_MESH_TEST_DATABASE: postgresql://ipars:disposable-mesh-test@127.0.0.1:5432/http_mesh_e2e
      HTTP_MESH_SCALE_TEST: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with: {go-version: '1.27.3', cache: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: http-mesh-fixture, path: '${{ runner.temp }}/mesh-fixture'}
      - name: Prepare the actual Rust control-plane replicas
        run: |
          chmod 755 "$RUNNER_TEMP/mesh-fixture/http_mesh_fixture"
          echo "HETERONETWORK_HTTP_MESH_FIXTURE=$RUNNER_TEMP/mesh-fixture/http_mesh_fixture" >> "$GITHUB_ENV"
      - name: Race-test real VPN traffic, scale and 1000 authenticated members
        run: go -C clients/headless test -mod=readonly -race -count=1 -timeout=5m -v ./...
      - name: Verify with no root, no Linux capabilities, no TUN and no OS UDP
        run: |
          go -C clients/headless test -mod=readonly -c -o "$RUNNER_TEMP/mesh-e2e.test"
          sudo --preserve-env=HETERONETWORK_HTTP_MESH_FIXTURE,HTTP_MESH_TEST_DATABASE \
            python3 scripts/http_mesh_restricted_e2e.py "$RUNNER_TEMP/mesh-e2e.test" \
            -test.run 'TestRestrictedEnvironment|TestHTTPMeshRealWireGuardAcrossScaleAndRestart' -test.v -test.timeout=3m
      - name: Connect the physical VPN host to unprivileged HTTP cloud nodes
        run: |
          sudo --preserve-env=HETERONETWORK_HTTP_MESH_FIXTURE,HTTP_MESH_TEST_DATABASE \
            env HTTP_MESH_KERNEL_TEST=1 "$RUNNER_TEMP/mesh-e2e.test" \
            -test.run TestHTTPMeshPhysicalBridgeRoutesPrivateCloudTraffic -test.v -test.timeout=2m
      - name: Build Linux amd64 and arm64 clients
        run: |
          for architecture in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$architecture" go -C clients/headless build -mod=readonly -trimpath -o "$RUNNER_TEMP/heteronet-headless-$architecture" ./cmd/heteronet-headless
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: http-mesh-headless-linux
          path: '${{ runner.temp }}/heteronet-headless-*'
          retention-days: 7

  cloud-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: {terraform_version: '1.16.4', terraform_wrapper: false}
      - name: Validate portable cloud deployment modules without creating resources
        run: |
          terraform fmt -check -recursive deploy/http-mesh
          for module in cloud-run ecs; do
            terraform -chdir="deploy/http-mesh/$module" init -backend=false -input=false
            terraform -chdir="deploy/http-mesh/$module" validate
          done
      - name: Authenticate before any Cloudflare container lifecycle operation
        working-directory: deploy/http-mesh/cloudflare
        run: |
          npm ci --ignore-scripts
          npm test
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cloudflare-mesh"

  publish-headless:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [rust, native-transport, console, helm, http-mesh, cloud-deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - name: Publish the tested unprivileged cloud client
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/heteronet-headless:sha-$GITHUB_SHA"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file docker/http-mesh/Dockerfile --tag "$image" \
            --metadata-file "$RUNNER_TEMP/headless-image.json" --push clients/headless
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads((Path(os.environ['RUNNER_TEMP']) / 'headless-image.json').read_text())
          digest = metadata['containerimage.digest']
          image = f"ghcr.io/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/heteronet-headless@{digest}"
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f'Tested headless image: `{image}`\n')
          PY
