name: Control plane recovery set

on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 0'
  push:
    paths:
      - 'scripts/control_plane_dr*.py'
      - 'scripts/test_control_plane_dr.py'
      - 'scripts/test_control_plane_dr_postgres_source.py'
      - 'scripts/test_control_plane_dr_etcd_source.py'
      - 'docs/disaster-recovery.md'
      - '.github/workflows/control-plane-dr.yml'
  pull_request:
    paths:
      - 'scripts/control_plane_dr*.py'
      - 'scripts/test_control_plane_dr.py'
      - 'scripts/test_control_plane_dr_postgres_source.py'
      - 'scripts/test_control_plane_dr_etcd_source.py'
      - 'docs/disaster-recovery.md'
      - '.github/workflows/control-plane-dr.yml'

permissions:
  contents: read

jobs:
  encrypted-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install pinned restic
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 \
            -o "$RUNNER_TEMP/restic.bz2"
          echo 'f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  '"$RUNNER_TEMP/restic.bz2" | sha256sum --check
          bzip2 -dc "$RUNNER_TEMP/restic.bz2" > "$RUNNER_TEMP/restic"
          chmod 0755 "$RUNNER_TEMP/restic"
      - name: Test encrypted, bounded backup and safe restore
        env:
          HC_DR_TEST_RESTIC: ${{ runner.temp }}/restic
        run: python3 -B -m unittest discover -s scripts -p test_control_plane_dr.py -v
      - name: Verify PostgreSQL source rejects lag, failover and unsupported layouts
        run: python3 -B -m unittest discover -s scripts -p test_control_plane_dr_postgres_source.py -v
      - name: Verify etcd source refuses swappable snapshots and identity changes
        run: python3 -B -m unittest discover -s scripts -p test_control_plane_dr_etcd_source.py -v
      - name: Install fixture PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 socat
      - name: Restore a real isolated PostgreSQL database
        run: |
          sudo python3 -B scripts/control_plane_dr_postgres_e2e.py \
            --restic "$RUNNER_TEMP/restic" \
            --pg-bin /usr/lib/postgresql/16/bin \
            --pg-share /usr/share/postgresql/16 \
            --pg-lib /usr/lib/x86_64-linux-gnu
      - name: Install pinned etcd fixture tools
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/etcd-io/etcd/releases/download/v3.6.8/etcd-v3.6.8-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/etcd.tar.gz"
          echo 'cf9cfe91a4856cb90eed9c99e6aee4b708db2c7888b88a6f116281f04b0ea693  '"$RUNNER_TEMP/etcd.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/etcd-bin"
          tar -xzf "$RUNNER_TEMP/etcd.tar.gz" -C "$RUNNER_TEMP/etcd-bin" --strip-components=1 \
            etcd-v3.6.8-linux-amd64/etcd etcd-v3.6.8-linux-amd64/etcdctl etcd-v3.6.8-linux-amd64/etcdutl
          sudo chown -R root:root "$RUNNER_TEMP/etcd-bin"
          sudo chmod 0755 "$RUNNER_TEMP/etcd-bin"
      - name: Restore a real isolated etcd snapshot
        run: |
          sudo python3 -B scripts/control_plane_dr_etcd_e2e.py \
            --restic "$RUNNER_TEMP/restic" --etcd-bin "$RUNNER_TEMP/etcd-bin"
      - name: Install pinned site recovery fixture binaries
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          download() {
            curl --fail --silent --show-error --location --retry 3 --max-time 180 "$1" -o "$2"
            printf '%s  %s\n' "$3" "$2" | sha256sum --check
          }
          download https://github.com/keycloak/keycloak/releases/download/26.6.4/keycloak-26.6.4.tar.gz \
            keycloak.tar.gz 386b566bbea05527226e275c43e5cf6f218896ad2441ac4be5c39f1226772e8f
          download https://github.com/openbao/openbao/releases/download/v2.6.3/openbao_2.6.3_linux_amd64.tar.gz \
            openbao.tar.gz c6463ddd4fdc4214b62a7ffdeaa0fc6df170f7e6b75c6dea2c5e525bdc932ed3
          download https://github.com/coder/coder/releases/download/v2.37.3/coder_2.37.3_linux_amd64.tar.gz \
            coder.tar.gz c941bef3b2656da89e9ea9b509884085b99b7d7a08620abd8484c50d77f41eed
          download https://garagehq.deuxfleurs.fr/_releases/v2.3.0/x86_64-unknown-linux-musl/garage \
            garage f98d317942bb341151a2775162016bb50cf86b865d0108de03eb5db16e2120cd
          download https://releases.hashicorp.com/terraform/1.15.5/terraform_1.15.5_linux_amd64.zip \
            terraform.zip 702b2136af6728c8ff037f843dd2dbce2b7ad88786b7381d1d72aefa250f601c
          tar -xzf keycloak.tar.gz
          tar -xzf openbao.tar.gz bao
          tar -xzf coder.tar.gz ./coder
          unzip -o -q terraform.zip terraform
          chmod 0755 garage
      - name: Restore the owner, secrets and original Coder workspace from HTTPS S3
        run: |
          set -euo pipefail
          sudo python3 -B scripts/control_plane_dr_stack_e2e.py \
            --restic "$RUNNER_TEMP/restic" --garage "$RUNNER_TEMP/garage" --socat /usr/bin/socat \
            --keycloak "$RUNNER_TEMP/keycloak-26.6.4/bin/kc.sh" --java-home "$JAVA_HOME_21_X64" \
            --bao "$RUNNER_TEMP/bao" --coder "$RUNNER_TEMP/coder" --terraform "$RUNNER_TEMP/terraform" \
            --pg-bin /usr/lib/postgresql/16/bin | tee "$RUNNER_TEMP/site-restore-result.txt"
          printf '\n### Site recovery drill\n\n' >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 "$RUNNER_TEMP/site-restore-result.txt" | jq -er \
            'select(.passed == true) | "Restored fixture owner, secret and original Coder workspace in \(.recovery_seconds) seconds."' \
            >> "$GITHUB_STEP_SUMMARY"
