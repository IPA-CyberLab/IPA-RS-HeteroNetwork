name: macOS release live E2E

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag whose macOS asset will be installed
        required: true
        type: string
      source_ref:
        description: Commit or tag containing the matching E2E driver
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    heteronet-macos-live-overlay-e2e-${{
      github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_ref
    }}
  cancel-in-progress: false

jobs:
  live-overlay:
    name: Install release and join the live overlay
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: macos-15
    timeout-minutes: 30
    environment: heteronet-e2e
    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.release_tag }}
      SOURCE_REF: >-
        ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_ref }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}

      - name: Validate release inputs
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo 'Release tag must start with v followed by a digit.' >&2; exit 1 ;;
          esac
          source_sha="$(git rev-parse HEAD)"
          test -n "$source_sha"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Materialize protected sponsor access
        env:
          HNN_E2E_SSH_PRIVATE_KEY: ${{ secrets.HNN_E2E_SSH_PRIVATE_KEY }}
          HNN_E2E_BECOME_PASSWORD: ${{ secrets.HNN_E2E_BECOME_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HNN_E2E_SSH_PRIVATE_KEY"
          test -n "$HNN_E2E_BECOME_PASSWORD"
          e2e_root="$RUNNER_TEMP/heteronetwork-macos-live-e2e"
          install -d -m 0700 "$e2e_root"
          umask 077
          printf '%s\n' "$HNN_E2E_SSH_PRIVATE_KEY" > "$e2e_root/id_ed25519"
          printf '%s\n' "$HNN_E2E_BECOME_PASSWORD" > "$e2e_root/sudo-password"
          cat > "$e2e_root/known_hosts" <<'EOF'
          163.220.236.45 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK038K5HfhW5BFKcXXK22/AunAU2mk2osPM98e0eZ1VI
          EOF
          chmod 0600 "$e2e_root/id_ed25519" "$e2e_root/sudo-password" "$e2e_root/known_hosts"
          echo "MACOS_E2E_ROOT=$e2e_root" >> "$GITHUB_ENV"
          echo 'HETERONETWORK_LIVE_E2E=1' >> "$GITHUB_ENV"

      - name: Find the previous complete macOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$RUNNER_TEMP/releases.json"
          previous=$(python3 - "$RUNNER_TEMP/releases.json" "$RELEASE_TAG" <<'PY'
          import json
          import sys

          releases = json.load(open(sys.argv[1], encoding="utf-8"))
          current = sys.argv[2]
          current_published_at = next(
              (
                  release.get("published_at")
                  for release in releases
                  if release.get("tag_name") == current
              ),
              None,
          )
          required = {
              "heteronetwork-client-macos-arm64.zip",
              "heteronetwork-client-macos-arm64.zip.sha256",
          }
          candidates = []
          for release in releases:
              published_at = release.get("published_at")
              if (
                  release.get("draft")
                  or release.get("tag_name") == current
                  or not published_at
                  or not current_published_at
                  or published_at >= current_published_at
              ):
                  continue
              names = {asset.get("name") for asset in release.get("assets", [])}
              if required <= names:
                  candidates.append((published_at, release["tag_name"]))
          print(max(candidates)[1] if candidates else "")
          PY
          )
          echo "PREVIOUS_MACOS_RELEASE=$previous" >> "$GITHUB_ENV"

      - name: Exercise automatic update from the previous release
        run: |
          set -euo pipefail
          if test -z "$PREVIOUS_MACOS_RELEASE"; then
            echo 'No earlier complete macOS release is available; skipping upgrade-path E2E.'
            exit 0
          fi
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 60 --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/install-client.sh" \
            | HETERONETWORK_VERSION="$PREVIOUS_MACOS_RELEASE" sh -s -- --no-launch
          app="$HOME/Applications/HeteroNetwork.app"
          info="$app/Contents/Info.plist"
          if ! previous_tag=$(/usr/libexec/PlistBuddy \
              -c 'Print :HeteroNetworkReleaseTag' "$info" 2>/dev/null)
          then
            echo "${PREVIOUS_MACOS_RELEASE} predates automatic updates; skipping upgrade-path E2E."
            exit 0
          fi
          test "$previous_tag" = "$PREVIOUS_MACOS_RELEASE"
          rm -f "$HOME/Library/Application Support/HeteroNetwork/updater.log"
          "$app/Contents/MacOS/HeteroNetwork" \
            > "$MACOS_E2E_ROOT/upgrade.stdout" \
            2> "$MACOS_E2E_ROOT/upgrade.stderr" &
          previous_pid=$!
          upgraded=0
          for _ in $(seq 1 900); do
            if test -f "$info"; then
              installed_tag=$(/usr/libexec/PlistBuddy \
                -c 'Print :HeteroNetworkReleaseTag' "$info" 2>/dev/null || true)
              if test "$installed_tag" = "$RELEASE_TAG"; then
                upgraded=1
                break
              fi
            fi
            sleep 0.2
          done
          if test "$upgraded" -ne 1; then
            kill "$previous_pid" 2>/dev/null || true
            wait "$previous_pid" 2>/dev/null || true
            cat "$HOME/Library/Application Support/HeteroNetwork/updater.log" 2>/dev/null || true
            exit 1
          fi
          wait "$previous_pid" 2>/dev/null || true
          codesign --verify --deep --strict "$app"
          restarted=0
          for _ in $(seq 1 50); do
            if /usr/bin/pgrep -U "$(id -u)" -x HeteroNetwork >/dev/null 2>&1; then
              restarted=1
              break
            fi
            sleep 0.1
          done
          test "$restarted" -eq 1
          /usr/bin/osascript \
            -e 'tell application id "jp.go.ipa.cyberlab.heteronetwork" to quit' \
            >/dev/null 2>&1 || true
          for _ in $(seq 1 50); do
            if ! /usr/bin/pgrep -U "$(id -u)" -x HeteroNetwork >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          ! /usr/bin/pgrep -U "$(id -u)" -x HeteroNetwork >/dev/null 2>&1
          printf '{"automatic_update_from":"%s","automatic_update_to":"%s"}\n' \
            "$PREVIOUS_MACOS_RELEASE" "$RELEASE_TAG" \
            | tee "$MACOS_E2E_ROOT/upgrade-report.json"

      - name: Install the published release with the public shell installer
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 60 --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SOURCE_SHA}/install-client.sh" \
            | HETERONETWORK_VERSION="$RELEASE_TAG" sh -s -- --no-launch
          test -x "$HOME/Applications/HeteroNetwork.app/Contents/MacOS/HeteroNetwork"
          test -x /Library/PrivilegedHelperTools/jp.go.ipa.cyberlab.heteronetwork.root-helper
          installed_tag=$(/usr/libexec/PlistBuddy -c 'Print :HeteroNetworkReleaseTag' \
            "$HOME/Applications/HeteroNetwork.app/Contents/Info.plist")
          test "$installed_tag" = "$RELEASE_TAG"
          printf '{"installed_release_tag":"%s","automatic_updates_enabled":true}\n' \
            "$installed_tag"

      - name: Compile the live driver from the exact release source
        run: |
          set -euo pipefail
          framework_dir="$HOME/Applications/HeteroNetwork.app/Contents/Frameworks"
          test -d "$framework_dir/HeteroNetworkCore.framework"
          xcrun swiftc -parse-as-library \
            clients/macos/Sources/Core/*.swift \
            clients/macos/LiveE2E/LiveE2E.swift \
            -o "$MACOS_E2E_ROOT/macos-live-e2e"
          codesign --force --sign - \
            --identifier jp.go.ipa.cyberlab.heteronetwork \
            "$MACOS_E2E_ROOT/macos-live-e2e"

      - name: Create a registration and sponsor the installed macOS client
        run: |
          set -euo pipefail
          umask 077
          "$MACOS_E2E_ROOT/macos-live-e2e" request "$MACOS_E2E_ROOT/request-uri"
          python3 scripts/macos-client-live-e2e.py sponsor \
            --request-file "$MACOS_E2E_ROOT/request-uri" \
            --profile-file "$MACOS_E2E_ROOT/import-profile" \
            --ssh-key-file "$MACOS_E2E_ROOT/id_ed25519" \
            --known-hosts-file "$MACOS_E2E_ROOT/known_hosts" \
            --sudo-password-file "$MACOS_E2E_ROOT/sudo-password" \
            --host 163.220.236.45 \
            --user mizuame
          touch "$MACOS_E2E_ROOT/sponsored"

      - name: Import through Keychain and establish the real macOS VPN
        run: |
          set -euo pipefail
          umask 077
          helper=/Library/PrivilegedHelperTools/jp.go.ipa.cyberlab.heteronetwork.root-helper
          "$MACOS_E2E_ROOT/macos-live-e2e" import \
            "$MACOS_E2E_ROOT/import-profile" "$MACOS_E2E_ROOT/tunnel.json"
          sudo "$helper" start "$MACOS_E2E_ROOT/tunnel.json" \
            > "$MACOS_E2E_ROOT/start-status.json"
          python3 - "$MACOS_E2E_ROOT/start-status.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              status = json.load(source)
          assert status.get("ok") is True
          assert status.get("status") == "connected"
          assert isinstance(status.get("interface"), str) and status["interface"]
          print('{"installed_release_helper_connected":true}')
          PY

      - name: Verify Keychain from the installed application process
        run: |
          set -euo pipefail
          report="$MACOS_E2E_ROOT/installed-app-report.json"
          app="$HOME/Applications/HeteroNetwork.app/Contents/MacOS/HeteroNetwork"
          app_pid=""
          stop_app() {
            if test -n "${app_pid:-}" && kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
          }
          trap stop_app EXIT HUP INT TERM
          HETERONETWORK_LIVE_E2E=1 \
          HETERONETWORK_LIVE_E2E_REPORT="$report" \
            "$app" >"$MACOS_E2E_ROOT/installed-app.stdout" \
              2>"$MACOS_E2E_ROOT/installed-app.stderr" &
          app_pid=$!
          report_ready=0
          for _ in $(seq 1 100); do
            kill -0 "$app_pid"
            if test -s "$report"; then
              report_ready=1
              break
            fi
            sleep 0.1
          done
          test "$report_ready" -eq 1
          python3 - "$report" "$RELEASE_TAG" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          assert report.get("installed_app_started") is True, report
          assert report.get("restore_succeeded") is True, report
          assert report.get("keychain_session_loaded") is True, report
          assert report.get("keychain_session_round_trip") is True, report
          assert report.get("automatic_updates_enabled") is True, report
          assert report.get("release_tag") == sys.argv[2], report
          print(json.dumps(report, sort_keys=True, separators=(",", ":")))
          PY
          stop_app
          trap - EXIT HUP INT TERM

      - name: Verify split DNS and the console within three seconds
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/macos-client-live-e2e.py verify \
            --helper /Library/PrivilegedHelperTools/jp.go.ipa.cyberlab.heteronetwork.root-helper \
            --deadline-seconds 90 \
            --max-open-seconds 3 \
            --output "$MACOS_E2E_ROOT/report.json"

      - name: Remove the live client registration
        run: |
          set -euo pipefail
          helper=/Library/PrivilegedHelperTools/jp.go.ipa.cyberlab.heteronetwork.root-helper
          "$MACOS_E2E_ROOT/macos-live-e2e" remove "$MACOS_E2E_ROOT/import-profile"
          touch "$MACOS_E2E_ROOT/removed"
          "$helper" stop > "$MACOS_E2E_ROOT/stop-status.json"

      - name: Publish sanitized macOS E2E result
        if: always()
        run: |
          if test -s "${MACOS_E2E_ROOT:-}/upgrade-report.json"; then
            {
              echo '### macOS automatic update E2E'
              echo '```json'
              cat "$MACOS_E2E_ROOT/upgrade-report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -s "${MACOS_E2E_ROOT:-}/installed-app-report.json"; then
            {
              echo '### Installed macOS application Keychain E2E'
              echo '```json'
              cat "$MACOS_E2E_ROOT/installed-app-report.json"
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -s "${MACOS_E2E_ROOT:-}/report.json"; then
            {
              echo '### macOS release install and live overlay E2E'
              echo '```json'
              cat "$MACOS_E2E_ROOT/report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove registration, tunnel, Keychain items, and private inputs
        if: always()
        run: |
          set +e
          cleanup_status=0
          e2e_root="${MACOS_E2E_ROOT:-$RUNNER_TEMP/heteronetwork-macos-live-e2e}"
          helper=/Library/PrivilegedHelperTools/jp.go.ipa.cyberlab.heteronetwork.root-helper
          driver="$e2e_root/macos-live-e2e"
          /usr/bin/pkill -U "$(id -u)" -x HeteroNetwork >/dev/null 2>&1 || true
          if test -x "$driver" && test -s "$e2e_root/import-profile" \
            && ! test -e "$e2e_root/removed"
          then
            rm -f "$e2e_root/cleanup-tunnel.json"
            if "$driver" configure "$e2e_root/import-profile" \
                "$e2e_root/cleanup-tunnel.json" >/dev/null \
              && sudo "$helper" start "$e2e_root/cleanup-tunnel.json" >/dev/null \
              && "$driver" remove "$e2e_root/import-profile" >/dev/null
            then
              touch "$e2e_root/removed"
            else
              echo 'Live macOS client cleanup could not confirm remote registration removal.' >&2
              cleanup_status=1
            fi
          fi
          if test -x "$helper"; then
            "$helper" stop >/dev/null 2>&1 || cleanup_status=1
          fi
          if test -x "$driver"; then
            "$driver" purge >/dev/null 2>&1 || cleanup_status=1
          fi
          sudo rm -f "$helper"
          sudo rm -rf /var/run/heteronetwork-client
          rm -rf "$HOME/Applications/HeteroNetwork.app"
          python3 scripts/macos-client-live-e2e.py wipe \
            "$e2e_root/id_ed25519" \
            "$e2e_root/sudo-password" \
            "$e2e_root/request-uri" \
            "$e2e_root/import-profile" \
            "$e2e_root/tunnel.json" \
            "$e2e_root/cleanup-tunnel.json" \
            "$e2e_root/start-status.json" \
            "$e2e_root/stop-status.json" \
            "$e2e_root/installed-app-report.json" \
            "$e2e_root/installed-app.stdout" \
            "$e2e_root/installed-app.stderr" \
            "$e2e_root/upgrade.stdout" \
            "$e2e_root/upgrade.stderr" \
            "$e2e_root/upgrade-report.json" \
            "$e2e_root/report.json" || cleanup_status=1
          rm -rf "$e2e_root"
          exit "$cleanup_status"
