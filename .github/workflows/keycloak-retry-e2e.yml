name: Keycloak placement retry checks

on:
  push:
    paths:
      - 'crates/ipars-control-plane/**'
      - 'crates/ipars-control-plane-http/**'
      - 'crates/ipars-store/**'
      - 'scripts/keycloak-autopilot*.sh'
      - '.github/workflows/keycloak-retry-e2e.yml'
  pull_request:
    paths:
      - 'crates/ipars-control-plane/**'
      - 'crates/ipars-control-plane-http/**'
      - 'crates/ipars-store/**'
      - 'scripts/keycloak-autopilot*.sh'
      - '.github/workflows/keycloak-retry-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry-and-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: ipars_admin_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipars_admin_ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CARGO_INCREMENTAL: 0
      IPARS_TEST_POSTGRES_URL: postgres://postgres:fixture-only@127.0.0.1:5432/ipars_admin_ledger_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.96.1 fmt --all -- --check
      - name: Exercise SQLite and PostgreSQL retries and lease fencing
        run: |
          cargo +1.96.1 test --locked -p ipars-store sqlite_keycloak
          cargo +1.96.1 test --locked -p ipars-store postgres_keycloak_retries_preserve_original_fenced_lease -- --ignored
      - name: Exercise authenticated control-plane HTTP and node fallback
        run: |
          cargo +1.96.1 test --locked -p ipars-control-plane-http explicit_autopilot_bearers_work_without_node_enrollment
          scripts/keycloak-autopilot-smoke.sh
