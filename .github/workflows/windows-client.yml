name: Windows client

on:
  push:
    branches:
      - master
    paths:
      - "clients/windows/**"
      - "install-client.sh"
      - ".github/workflows/windows-client.yml"
      - ".github/workflows/windows-release-update-e2e.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "clients/windows/**"
      - "install-client.sh"
      - ".github/workflows/windows-client.yml"
      - ".github/workflows/windows-release-update-e2e.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test, and package (x64)
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 9.0.x

      - name: Install WireGuard-compatible Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.20.14
          cache: false

      - name: Validate the public installer
        shell: bash
        run: |
          set -euo pipefail
          sh -n install-client.sh
          sh install-client.sh --self-test

      - name: Build, test, and publish a self-contained client
        shell: pwsh
        run: >-
          ./clients/windows/build.ps1 -SelfContained
          -ReleaseTag "v0.0.0-ci.${{ github.run_number }}"

      - name: Validate published update identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $published = Join-Path $PWD "clients/windows/artifacts/win-x64"
          $executable = Join-Path $published "HeteroNetwork.exe"
          $expected = "v0.0.0-ci.${{ github.run_number }}"
          if ((Get-Item -LiteralPath $executable).VersionInfo.ProductVersion -ne $expected) {
            throw "The published executable does not contain $expected."
          }
          $process = Start-Process `
            -FilePath $executable `
            -ArgumentList "--wireguard-self-test" `
            -WorkingDirectory $published `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "The published client self-test failed with $($process.ExitCode)."
          }

