name: Stopped-node firewall deduplication

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/reconcile-stopped-overlay-firewall.py'
      - 'scripts/test_reconcile_stopped_overlay_firewall.py'
      - 'scripts/stopped_firewall_namespace_e2e.py'
      - 'scripts/node_lifecycle.py'
      - '.github/workflows/stopped-firewall-e2e.yml'
  pull_request:
    paths:
      - 'scripts/reconcile-stopped-overlay-firewall.py'
      - 'scripts/test_reconcile_stopped_overlay_firewall.py'
      - 'scripts/stopped_firewall_namespace_e2e.py'
      - 'scripts/node_lifecycle.py'
      - '.github/workflows/stopped-firewall-e2e.yml'

permissions:
  contents: read

jobs:
  namespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Test firewall reconciliation and failure paths
        run: python3 -B -m unittest discover -s scripts -p test_reconcile_stopped_overlay_firewall.py -v
      - name: Remove over ten thousand duplicate rules in an isolated namespace
        run: sudo unshare --net env HNN_FIREWALL_TEST_NAMESPACE=1 python3 -B scripts/stopped_firewall_namespace_e2e.py
