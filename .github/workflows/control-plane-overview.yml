name: Control plane overview regression

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/ipars-control-plane/**'
      - 'crates/ipars-control-plane-http/**'
      - 'crates/ipars-store/**'
      - 'crates/ipars-types/**'
      - '.github/workflows/control-plane-overview.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/ipars-control-plane/**'
      - 'crates/ipars-control-plane-http/**'
      - 'crates/ipars-store/**'
      - 'crates/ipars-types/**'
      - '.github/workflows/control-plane-overview.yml'

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.96.1
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  overview-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ipars
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ipars_admin_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipars -d ipars_admin_ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Verify PostgreSQL token metrics against record semantics
        env:
          IPARS_TEST_POSTGRES_URL: postgresql://ipars:test-only@127.0.0.1:5432/ipars_admin_ledger_test
        run: cargo test --locked -p ipars-store postgres_token_metrics_match_record_status_and_tombstones -- --ignored
      - name: Verify authenticated overview and node details
        run: cargo test --locked -p ipars-control-plane-http http_admin_overview_updates_for_three_node_nat_discovery
