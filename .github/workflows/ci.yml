name: CI

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: 1.96.1
  RUST_MSRV_TOOLCHAIN: 1.88.0
  RUST_EBPF_TOOLCHAIN: nightly-2026-07-05
  BPF_LINKER_VERSION: 0.10.3

jobs:
  rust-quality:
    name: Rust quality and MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust components
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test release artifact contract
        run: |
          node --test scripts/release-artifact-manifest.test.mjs scripts/release-channels.test.mjs scripts/package-native-release.test.mjs scripts/bind-sudo-release-artifact.test.mjs
          python3 -B -m unittest discover -s scripts -p test_sudo_quorum_v2_artifact.py -v

      - name: Test desktop client installer
        run: |
          sh -n install-client.sh
          sh install-client.sh --self-test
          python3 -B -m unittest discover -s scripts -p test_macos_client_live_e2e.py -v

      - name: Validate native staging boundaries
        run: |
          # The validator deliberately ignores inherited PATH and NODE_OPTIONS.
          # Hosted runners keep Node outside the system path used on supported VMs.
          if ! env -i PATH=/bin:/usr/bin node --version >/dev/null 2>&1; then
            sudo install -m 0755 "$(node -p 'process.execPath')" /usr/bin/node
          fi
          python3 scripts/native-release-stage.test.py
          node --check scripts/native-release-stage.catalog.mjs

      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Validate kubeadm HA automation
        run: |
          bash -n scripts/kubeadm-ha-node.sh
          scripts/kubeadm-ha-node.sh self-test
          bash -n scripts/kubeadm-ha-autopilot.sh
          scripts/kubeadm-ha-autopilot.sh self-test

      - name: Validate PostgreSQL HA automation
        run: |
          bash -n scripts/postgres-ha-node.sh
          scripts/postgres-ha-node.sh self-test
          bash -n scripts/postgres-ha-autopilot.sh
          scripts/postgres-ha-autopilot.sh self-test

      - name: Validate automatic public-service promotion
        run: |
          sh -n scripts/public-services-autopilot.sh
          sh -n scripts/public-services-autopilot-smoke.sh
          sh -n scripts/public-services-bootstrap.sh
          sh -n scripts/public-services-bootstrap-smoke.sh
          scripts/public-services-autopilot-smoke.sh
          scripts/public-services-bootstrap-smoke.sh

      - name: Validate automatic Keycloak HA placement
        run: |
          bash -n scripts/keycloak-ha-node.sh
          bash -n scripts/keycloak-autopilot.sh
          bash -n scripts/keycloak-autopilot-smoke.sh
          bash -n scripts/keycloak-ha-e2e.sh
          bash -n scripts/heteronetwork-console-e2e.sh
          bash -n scripts/reconcile-owner-console-auth.sh
          bash -n scripts/rollout-console-owner-update.sh
          node --check scripts/keycloak-ha-e2e-smoke.mjs
          scripts/keycloak-autopilot-smoke.sh
          node scripts/keycloak-ha-e2e-smoke.mjs

      - name: Install minimum supported Rust
        run: rustup toolchain install "$RUST_MSRV_TOOLCHAIN" --profile minimal

      - name: Check all targets on MSRV
        run: cargo +"$RUST_MSRV_TOOLCHAIN" check --locked --workspace --all-targets

  sudo-quorum-e2e:
    name: Majority sudo end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned Rust components
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Check local approval prototype
        run: |
          cargo fmt --manifest-path prototypes/sudo-quorum/Cargo.toml -- --check
          cargo clippy --locked --manifest-path prototypes/sudo-quorum/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path prototypes/sudo-quorum/Cargo.toml

      - name: Run isolated real sudo and signing API integration
        run: bash scripts/test-sudo-quorum-v2.sh

  macos-client:
    name: Native macOS client (${{ matrix.client_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            client_arch: arm64
            machine_arch: arm64
          - runner: macos-15-intel
            client_arch: x64
            machine_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: 2.45.4
          XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_dir="$RUNNER_TEMP/xcodegen-install"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$archive" | shasum --algorithm 256 --check
          ditto -x -k "$archive" "$install_dir"
          printf '%s\n' "$install_dir/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Install WireGuard-compatible Go toolchain
        env:
          EXPECTED_MACHINE_ARCH: ${{ matrix.machine_arch }}
          GO_VERSION: 1.20.14
          GO_AMD64_SHA256: 754363489e2244e72cb49b4ec6ddfd6a2c60b0700f8c4876e11befb1913b11c5
          GO_ARM64_SHA256: 6da3f76164b215053daf730a9b8f1d673dbbaa4c61031374a6744b75cb728641
        run: |
          set -euo pipefail
          machine_arch="$(uname -m)"
          test "$machine_arch" = "$EXPECTED_MACHINE_ARCH"
          case "$machine_arch" in
            x86_64)
              go_arch=amd64
              expected_sha256="$GO_AMD64_SHA256"
              ;;
            arm64)
              go_arch=arm64
              expected_sha256="$GO_ARM64_SHA256"
              ;;
            *)
              echo "Unsupported macOS runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/go${GO_VERSION}.darwin-${go_arch}.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            --output "$archive" \
            "https://go.dev/dl/go${GO_VERSION}.darwin-${go_arch}.tar.gz"
          printf '%s  %s\n' "$expected_sha256" "$archive" | shasum --algorithm 256 --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"

      - name: Test privileged macOS network helper
        working-directory: clients/macos/RootHelper
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          test -z "$unformatted"
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/heteronetwork-root-helper-test" .
          "$RUNNER_TEMP/heteronetwork-root-helper-test" self-test

      - name: Run privileged macOS root-helper E2E
        working-directory: clients/macos/RootHelper
        run: ./e2e.sh "$RUNNER_TEMP/heteronetwork-root-helper-test"

      - name: Generate Xcode project
        working-directory: clients/macos
        run: ./scripts/bootstrap.sh

      - name: Run macOS client tests
        working-directory: clients/macos
        run: |
          set -euo pipefail
          xcodebuild test \
            -project HeteroNetwork.xcodeproj \
            -scheme HeteroNetwork \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/HeteroNetworkDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned Release app and root helper
        working-directory: clients/macos
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HeteroNetwork.xcodeproj \
            -scheme HeteroNetwork \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/HeteroNetworkDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package macOS client release asset
        env:
          CLIENT_ARCH: ${{ matrix.client_arch }}
          MACHINE_ARCH: ${{ matrix.machine_arch }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/HeteroNetworkDerivedData/Build/Products/Release/HeteroNetwork.app"
          helper="$app/Contents/Resources/heteronetwork-root-helper"
          test -x "$app/Contents/MacOS/HeteroNetwork"
          test -x "$helper"
          test -d "$app/Contents/Frameworks/HeteroNetworkCore.framework"
          xcrun lipo "$app/Contents/MacOS/HeteroNetwork" -verify_arch "$MACHINE_ARCH"
          xcrun lipo "$helper" -verify_arch "$MACHINE_ARCH"
          "$helper" self-test
          codesign --force --sign - "$helper"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          asset="heteronetwork-client-macos-${CLIENT_ARCH}.zip"
          asset_dir="$RUNNER_TEMP/desktop-assets"
          mkdir "$asset_dir"
          ditto -c -k --keepParent "$app" "$asset_dir/$asset"
          (
            cd "$asset_dir"
            shasum --algorithm 256 "$asset" > "$asset.sha256"
          )

      - name: Upload macOS client release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-client-macos-${{ matrix.client_arch }}
          path: |
            ${{ runner.temp }}/desktop-assets/heteronetwork-client-macos-${{ matrix.client_arch }}.zip
            ${{ runner.temp }}/desktop-assets/heteronetwork-client-macos-${{ matrix.client_arch }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  windows-client:
    name: Native Windows client (x64)
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 9.0.x

      - name: Install WireGuard-compatible Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.20.14
          cache: false

      - name: Build, test, and publish self-contained Windows client
        shell: pwsh
        run: ./clients/windows/build.ps1 -SelfContained

      - name: Package Windows client release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $published = Join-Path $PWD "clients/windows/artifacts/win-x64"
          $executable = Join-Path $published "HeteroNetwork.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "The published Windows client is missing."
          }
          $asset = "heteronetwork-client-windows-x64.zip"
          $assetDirectory = Join-Path $env:RUNNER_TEMP "desktop-assets"
          $assetPath = Join-Path $assetDirectory $asset
          New-Item -ItemType Directory -Path $assetDirectory | Out-Null
          Compress-Archive -Path (Join-Path $published "*") -DestinationPath $assetPath
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = Join-Path $assetDirectory "$asset.sha256"
          [IO.File]::WriteAllText(
            $checksum,
            "$hash  $asset`n",
            [Text.UTF8Encoding]::new($false))

      - name: Upload Windows client release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-client-windows-x64
          path: |
            ${{ runner.temp }}/desktop-assets/heteronetwork-client-windows-x64.zip
            ${{ runner.temp }}/desktop-assets/heteronetwork-client-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  netns-smoke:
    name: Privileged network namespace smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Install pinned eBPF build tools
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_EBPF_TOOLCHAIN" --profile minimal --component rust-src
          cargo install bpf-linker --version "$BPF_LINKER_VERSION" --locked

      - name: Install network tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            curl \
            iproute2 \
            iptables \
            iputils-ping \
            jq \
            kmod \
            procps \
            wireguard-tools
          if ! sudo modprobe wireguard; then
            module_package="linux-modules-extra-$(uname -r)"
            if ! apt-cache show "$module_package" >/dev/null 2>&1; then
              echo "WireGuard kernel support is unavailable and ${module_package} does not exist" >&2
              exit 1
            fi
            sudo apt-get install --yes --no-install-recommends "$module_package"
            sudo modprobe wireguard
          fi
          sudo modprobe tun
          sudo test -c /dev/net/tun
          if ! sudo test -r /sys/kernel/tracing/events/syscalls/sys_enter_sendto/id \
            && ! sudo test -r /sys/kernel/debug/tracing/events/syscalls/sys_enter_sendto/id; then
            sudo mount -t tracefs tracefs /sys/kernel/tracing
          fi

      - name: Build daemon
        run: cargo build --locked -p ipars-cli -p ipars-daemon

      - name: Build packet-flow eBPF object
        run: |
          set -euo pipefail
          HETERONETWORK_EBPF_TOOLCHAIN="$RUST_EBPF_TOOLCHAIN" \
          HETERONETWORK_EBPF_BPF_LINKER_VERSION="$BPF_LINKER_VERSION" \
            scripts/build-ebpf.sh

      - name: Run privileged namespace integration suite
        run: |
          set -euo pipefail
          sudo env \
            HOME="$HOME" \
            PATH="$PATH" \
            CARGO="$(command -v cargo)" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            RUSTUP_TOOLCHAIN="$RUSTUP_TOOLCHAIN" \
            HETERONETWORK_AGENT_NAT_SMOKE_HETERONETWORK_BIN="$PWD/target/debug/ipars" \
            HETERONETWORK_AGENT_NAT_SMOKE_IPARSD_BIN="$PWD/target/debug/iparsd" \
            HETERONETWORK_NETNS_SMOKE_IPARSD_BIN="$PWD/target/debug/iparsd" \
            HETERONETWORK_NETNS_SMOKE_EBPF_OBJECT_PATH="$PWD/target/ebpf/ipars-packet-flow.bpf.o" \
            bash -c 'scripts/agent-nat-smoke.sh && HETERONETWORK_AGENT_NAT_SMOKE_PROFILE=fixed-port scripts/agent-nat-smoke.sh && HETERONETWORK_AGENT_NAT_SMOKE_PROFILE=mixed-port scripts/agent-nat-smoke.sh && HETERONETWORK_AGENT_NAT_SMOKE_PROFILE=one-sided scripts/agent-nat-smoke.sh && HETERONETWORK_AGENT_NAT_SMOKE_PROFILE=one-sided-port-preserving scripts/agent-nat-smoke.sh && HETERONETWORK_AGENT_NAT_SMOKE_PROFILE=one-sided-symmetric scripts/agent-nat-smoke.sh && HETERONETWORK_AGENT_NAT_SMOKE_PROFILE=asymmetric scripts/agent-nat-smoke.sh && HETERONETWORK_AGENT_NAT_SMOKE_PROFILE=symmetric scripts/agent-nat-smoke.sh && scripts/netns-smoke.sh'

  docker-compose-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Ensure kernel WireGuard support
        run: |
          set -euo pipefail
          if sudo modprobe wireguard; then
            exit 0
          fi
          sudo apt-get update
          module_package="linux-modules-extra-$(uname -r)"
          if ! apt-cache show "$module_package" >/dev/null 2>&1; then
            echo "WireGuard kernel support is unavailable and ${module_package} does not exist" >&2
            exit 1
          fi
          sudo apt-get install --yes --no-install-recommends "$module_package"
          sudo modprobe wireguard

      - name: Run live Compose stack integration suite
        env:
          CARGO: cargo
        run: scripts/docker-smoke.sh

      - name: Run multi-Docker-Engine discovery and churn suite
        env:
          CARGO: cargo
        run: scripts/docker-multi-engine-smoke.sh

  rootless-docker-smoke:
    name: Rootless Docker BoringTun smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install rootless Docker helpers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fuse-overlayfs \
            jq \
            rootlesskit \
            slirp4netns \
            uidmap
          user_name="$(id -un)"
          if ! awk -F: -v user="$user_name" '$1 == user && $3 >= 65536 { found = 1 } END { exit !found }' /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$user_name"
          fi
          if ! awk -F: -v user="$user_name" '$1 == user && $3 >= 65536 { found = 1 } END { exit !found }' /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$user_name"
          fi
          command -v dockerd
          command -v rootlesskit
          command -v slirp4netns
          command -v fuse-overlayfs

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Enable TUN device
        run: |
          set -euo pipefail
          sudo modprobe tun
          sudo modprobe nf_conntrack
          sudo test -c /dev/net/tun

      - name: Run rootless BoringTun two-agent dataplane smoke
        env:
          CARGO: cargo
        run: scripts/rootless-docker-smoke.sh

  load-smoke:
    name: Scale and daemon failover smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ipars
          POSTGRES_PASSWORD: ipars-load-password
          POSTGRES_DB: ipars
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipars -d ipars"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Run scale, transport, and daemon failover suite
        env:
          CARGO: cargo
          HETERONETWORK_LOAD_SMOKE_BUILD_DAEMON: "1"
          HETERONETWORK_LOAD_SMOKE_POSTGRES_DATABASE_URL: postgresql://ipars:ipars-load-password@127.0.0.1:5432/ipars?sslmode=disable
        run: scripts/load-smoke.sh

  init-spawn-smoke:
    name: Bootstrap init process smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Run init spawn and readiness suite
        env:
          CARGO: cargo
        run: scripts/init-spawn-smoke.sh

  helm-smoke:
    name: Helm chart smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Helm lint and render suite
        env:
          HETERONETWORK_HELM_IMAGE: alpine/helm@sha256:31ce11c4ee98c5e1e13628ead9212e665f32c3277cae63bd55ced32989089f3e
        run: scripts/helm-smoke.sh

  kind-smoke:
    name: Kubernetes kind live smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Ensure kernel WireGuard support
        run: |
          set -euo pipefail
          if sudo modprobe wireguard; then
            exit 0
          fi
          sudo apt-get update
          module_package="linux-modules-extra-$(uname -r)"
          if ! apt-cache show "$module_package" >/dev/null 2>&1; then
            echo "WireGuard kernel support is unavailable and ${module_package} does not exist" >&2
            exit 1
          fi
          sudo apt-get install --yes --no-install-recommends "$module_package"
          sudo modprobe wireguard

      - name: Install pinned Kubernetes tools
        env:
          KIND_VERSION: v0.32.0
          KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
          HELM_VERSION: v3.14.4
          HELM_SHA256: a5844ef2c38ef6ddf3b5a8f7d91e7e0e8ebc39a38bb3fc8013d629c1ef29c259
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/ipars-tools"
          mkdir -p "$install_dir"

          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            --output "$install_dir/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          printf '%s  %s\n' "$KIND_SHA256" "$install_dir/kind" | sha256sum --check --strict
          chmod 0755 "$install_dir/kind"

          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            --output "$install_dir/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$install_dir/kubectl" | sha256sum --check --strict
          chmod 0755 "$install_dir/kubectl"

          helm_archive="$RUNNER_TEMP/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            --output "$helm_archive" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$HELM_SHA256" "$helm_archive" | sha256sum --check --strict
          tar --extract --gzip --file "$helm_archive" --directory "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$install_dir/helm"

          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Run three-node Kubernetes relay integration suite
        env:
          CARGO: cargo
          HETERONETWORK_KIND_K8S_SMOKE_AGENT_RUNTIME_BACKEND: linux-command
          HETERONETWORK_KIND_K8S_SMOKE_CLUSTER_WAIT_SECONDS: "300"
        run: scripts/kind-k8s-smoke.sh

  container-image:
    name: Publish release container
    needs:
      - rust-quality
      - macos-client
      - windows-client
      - netns-smoke
      - docker-compose-smoke
      - rootless-docker-smoke
      - load-smoke
      - init-spawn-smoke
      - helm-smoke
      - kind-smoke
      - sudo-quorum-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download desktop client release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-client-*
          path: ${{ runner.temp }}/desktop-release
          merge-multiple: true

      - name: Verify desktop client release assets
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/desktop-release"
          expected_assets='heteronetwork-client-macos-arm64.zip
          heteronetwork-client-macos-x64.zip
          heteronetwork-client-windows-x64.zip'
          printf '%s\n' "$expected_assets" | while IFS= read -r asset; do
            test -s "$asset_dir/$asset"
            test -s "$asset_dir/$asset.sha256"
            (
              cd "$asset_dir"
              sha256sum --check --strict "$asset.sha256"
            )
          done
          cp install-client.sh "$asset_dir/install-heteronetwork-client.sh"
          (
            cd "$asset_dir"
            sha256sum install-heteronetwork-client.sh > install-heteronetwork-client.sh.sha256
          )

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          node scripts/release-artifact-manifest.mjs validate

      - name: Refuse replacement of an existing release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          native_asset="heteronetwork-${RELEASE_TAG#v}-linux-amd64.tar.gz"
          sudo_asset="heteronetwork-${RELEASE_TAG#v}-sudo-v2-linux-amd64.tar.gz"
          desktop_assets='heteronetwork-client-macos-arm64.zip
          heteronetwork-client-macos-arm64.zip.sha256
          heteronetwork-client-macos-x64.zip
          heteronetwork-client-macos-x64.zip.sha256
          heteronetwork-client-windows-x64.zip
          heteronetwork-client-windows-x64.zip.sha256
          install-heteronetwork-client.sh
          install-heteronetwork-client.sh.sha256'
          desktop_asset_exists=0
          for desktop_asset in $desktop_assets; do
            if printf '%s\n' "$assets" | grep -Fxq "$desktop_asset"; then
              desktop_asset_exists=1
              break
            fi
          done
          if printf '%s\n' "$assets" | grep -Fxq 'heteronetwork-release-artifact.json' \
            || printf '%s\n' "$assets" | grep -Fxq "$native_asset" \
            || printf '%s\n' "$assets" | grep -Fxq "$sudo_asset" \
            || [ "$desktop_asset_exists" -eq 1 ]
          then
            echo 'Release artifact already exists; reuse it for promotion, do not rebuild.' >&2
            exit 1
          fi

      - name: Build inactive sudo release payload from exact source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/sudo-cargo-target
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = release
          node scripts/release-artifact-manifest.mjs validate
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 90 --retry 2 \
            'https://raw.githubusercontent.com/sudo-project/sudo/d1b48c651cec19fe37d1f0d3299d2283fb0f88e4/include/sudo_plugin.h' \
            --output "$RUNNER_TEMP/sudo_plugin.h"
          bash scripts/package-sudo-quorum-v2.sh \
            --sudo-header "$RUNNER_TEMP/sudo_plugin.h" --out-dir "$RUNNER_TEMP/sudo-release" \
            --profile release --source-commit "$GITHUB_SHA" --version "$RELEASE_TAG"

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable image
        env:
          IMAGE: ghcr.io/ipa-cyberlab/heteronetwork
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          docker build \
            --build-arg "HETERONETWORK_BUILD_VERSION=$version" \
            --build-arg "HETERONETWORK_BUILD_HASH=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:$RELEASE_TAG" \
            --file docker/Dockerfile \
            .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$RELEASE_TAG"
          docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/repo-digests.json"

      - name: Generate immutable release artifact
        env:
          IMAGE: ghcr.io/ipa-cyberlab/heteronetwork
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO_DIGESTS_FILE: ${{ runner.temp }}/repo-digests.json
        run: node scripts/release-artifact-manifest.mjs generate > "$RUNNER_TEMP/release-base.json"

      - name: Bind verified sudo payload into HeteroNetwork artifact
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          node scripts/bind-sudo-release-artifact.mjs bind \
            "$RUNNER_TEMP/release-base.json" "$RUNNER_TEMP/sudo-release/release-contract.json" \
            "$RUNNER_TEMP/sudo-release/heteronetwork-${RELEASE_TAG#v}-sudo-v2-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/release-with-sudo.json"

      - name: Package the same build for native VM staging
        env:
          IMAGE: ghcr.io/ipa-cyberlab/heteronetwork
        run: |
          set -euo pipefail
          test "$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{.Architecture}}')" = amd64
          container="$(docker create "$IMAGE:$GITHUB_SHA")"
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir "$RUNNER_TEMP/native-binaries" "$RUNNER_TEMP/native-release"
          for binary in ipars iparsd ipars-k8s-controller; do
            docker cp "$container:/usr/local/bin/$binary" "$RUNNER_TEMP/native-binaries/$binary"
          done
          node scripts/package-native-release.mjs \
            "$RUNNER_TEMP/release-with-sudo.json" "$RUNNER_TEMP/native-binaries" "$RUNNER_TEMP/native-release"

      - name: Verify final native and sudo release bindings
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          node scripts/release-artifact-manifest.mjs validate
          node scripts/bind-sudo-release-artifact.mjs verify \
            "$RUNNER_TEMP/native-release/heteronetwork-release-artifact.json" \
            "$RUNNER_TEMP/sudo-release/heteronetwork-${RELEASE_TAG#v}-sudo-v2-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/native-release/heteronetwork-${RELEASE_TAG#v}-linux-amd64.tar.gz"

      # The same digest-pinned artifact is promoted through dev and prod; no rebuild.
      - name: Attach immutable artifact to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/native-release/heteronetwork-release-artifact.json" \
            "$RUNNER_TEMP/native-release/heteronetwork-${RELEASE_TAG#v}-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/sudo-release/heteronetwork-${RELEASE_TAG#v}-sudo-v2-linux-amd64.tar.gz" \
            "$RUNNER_TEMP/desktop-release/heteronetwork-client-macos-arm64.zip" \
            "$RUNNER_TEMP/desktop-release/heteronetwork-client-macos-arm64.zip.sha256" \
            "$RUNNER_TEMP/desktop-release/heteronetwork-client-macos-x64.zip" \
            "$RUNNER_TEMP/desktop-release/heteronetwork-client-macos-x64.zip.sha256" \
            "$RUNNER_TEMP/desktop-release/heteronetwork-client-windows-x64.zip" \
            "$RUNNER_TEMP/desktop-release/heteronetwork-client-windows-x64.zip.sha256" \
            "$RUNNER_TEMP/desktop-release/install-heteronetwork-client.sh" \
            "$RUNNER_TEMP/desktop-release/install-heteronetwork-client.sh.sha256"

  macos-live-overlay-e2e:
    name: macOS release install and live overlay E2E
    needs: container-image
    runs-on: macos-15
    timeout-minutes: 20
    environment: heteronet-e2e
    concurrency:
      group: heteronet-macos-live-overlay-e2e
      cancel-in-progress: false
    steps:
      - name: Check out exact release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Materialize protected sponsor access
        env:
          HNN_E2E_SSH_PRIVATE_KEY: ${{ secrets.HNN_E2E_SSH_PRIVATE_KEY }}
          HNN_E2E_BECOME_PASSWORD: ${{ secrets.HNN_E2E_BECOME_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HNN_E2E_SSH_PRIVATE_KEY"
          test -n "$HNN_E2E_BECOME_PASSWORD"
          e2e_root="$RUNNER_TEMP/heteronetwork-macos-live-e2e"
          install -d -m 0700 "$e2e_root"
          umask 077
          printf '%s\n' "$HNN_E2E_SSH_PRIVATE_KEY" > "$e2e_root/id_ed25519"
          printf '%s\n' "$HNN_E2E_BECOME_PASSWORD" > "$e2e_root/sudo-password"
          cat > "$e2e_root/known_hosts" <<'EOF'
          163.220.236.45 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK038K5HfhW5BFKcXXK22/AunAU2mk2osPM98e0eZ1VI
          EOF
          chmod 0600 "$e2e_root/id_ed25519" "$e2e_root/sudo-password" "$e2e_root/known_hosts"
          echo "MACOS_E2E_ROOT=$e2e_root" >> "$GITHUB_ENV"
          echo 'HETERONETWORK_LIVE_E2E=1' >> "$GITHUB_ENV"

      - name: Install the published release with the public shell installer
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 60 --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install-client.sh" \
            | HETERONETWORK_VERSION="$RELEASE_TAG" sh -s -- --no-launch
          test -x "$HOME/Applications/HeteroNetwork.app/Contents/MacOS/HeteroNetwork"
          test -x /Library/PrivilegedHelperTools/jp.go.ipa.cyberlab.heteronetwork.root-helper

      - name: Compile the live driver against the installed release framework
        run: |
          set -euo pipefail
          framework_dir="$HOME/Applications/HeteroNetwork.app/Contents/Frameworks"
          test -d "$framework_dir/HeteroNetworkCore.framework"
          xcrun swiftc -parse-as-library \
            -F "$framework_dir" \
            -framework HeteroNetworkCore \
            -Xlinker -rpath -Xlinker "$framework_dir" \
            clients/macos/LiveE2E/LiveE2E.swift \
            -o "$MACOS_E2E_ROOT/macos-live-e2e"
          codesign --force --sign - "$MACOS_E2E_ROOT/macos-live-e2e"

      - name: Create a registration and sponsor the installed macOS client
        run: |
          set -euo pipefail
          umask 077
          "$MACOS_E2E_ROOT/macos-live-e2e" request "$MACOS_E2E_ROOT/request-uri"
          python3 scripts/macos-client-live-e2e.py sponsor \
            --request-file "$MACOS_E2E_ROOT/request-uri" \
            --profile-file "$MACOS_E2E_ROOT/import-profile" \
            --ssh-key-file "$MACOS_E2E_ROOT/id_ed25519" \
            --known-hosts-file "$MACOS_E2E_ROOT/known_hosts" \
            --sudo-password-file "$MACOS_E2E_ROOT/sudo-password" \
            --host 163.220.236.45 \
            --user mizuame
          touch "$MACOS_E2E_ROOT/sponsored"

      - name: Import through Keychain and establish the real macOS VPN
        run: |
          set -euo pipefail
          umask 077
          helper=/Library/PrivilegedHelperTools/jp.go.ipa.cyberlab.heteronetwork.root-helper
          "$MACOS_E2E_ROOT/macos-live-e2e" import \
            "$MACOS_E2E_ROOT/import-profile" "$MACOS_E2E_ROOT/tunnel.json"
          sudo "$helper" start "$MACOS_E2E_ROOT/tunnel.json" \
            > "$MACOS_E2E_ROOT/start-status.json"
          python3 - "$MACOS_E2E_ROOT/start-status.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              status = json.load(source)
          assert status.get("ok") is True
          assert status.get("status") == "connected"
          assert isinstance(status.get("interface"), str) and status["interface"]
          print('{"installed_release_helper_connected":true}')
          PY

      - name: Verify split DNS and the console within three seconds
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/macos-client-live-e2e.py verify \
            --helper /Library/PrivilegedHelperTools/jp.go.ipa.cyberlab.heteronetwork.root-helper \
            --deadline-seconds 90 \
            --max-open-seconds 3 \
            --output "$MACOS_E2E_ROOT/report.json"

      - name: Remove the live client registration
        run: |
          set -euo pipefail
          helper=/Library/PrivilegedHelperTools/jp.go.ipa.cyberlab.heteronetwork.root-helper
          "$MACOS_E2E_ROOT/macos-live-e2e" remove "$MACOS_E2E_ROOT/import-profile"
          touch "$MACOS_E2E_ROOT/removed"
          "$helper" stop > "$MACOS_E2E_ROOT/stop-status.json"

      - name: Publish sanitized macOS E2E result
        if: always()
        run: |
          if test -s "$MACOS_E2E_ROOT/report.json"; then
            {
              echo '### macOS release install and live overlay E2E'
              echo '```json'
              cat "$MACOS_E2E_ROOT/report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove registration, tunnel, Keychain items, and private inputs
        if: always()
        run: |
          set +e
          cleanup_status=0
          e2e_root="${MACOS_E2E_ROOT:-$RUNNER_TEMP/heteronetwork-macos-live-e2e}"
          helper=/Library/PrivilegedHelperTools/jp.go.ipa.cyberlab.heteronetwork.root-helper
          driver="$e2e_root/macos-live-e2e"
          if test -x "$driver" && test -s "$e2e_root/import-profile" \
            && ! test -e "$e2e_root/removed"
          then
            rm -f "$e2e_root/cleanup-tunnel.json"
            if "$driver" configure "$e2e_root/import-profile" \
                "$e2e_root/cleanup-tunnel.json" >/dev/null \
              && sudo "$helper" start "$e2e_root/cleanup-tunnel.json" >/dev/null \
              && "$driver" remove "$e2e_root/import-profile" >/dev/null
            then
              touch "$e2e_root/removed"
            else
              echo 'Live macOS client cleanup could not confirm remote registration removal.' >&2
              cleanup_status=1
            fi
          fi
          if test -x "$helper"; then
            "$helper" stop >/dev/null 2>&1 || cleanup_status=1
          fi
          if test -x "$driver"; then
            "$driver" purge >/dev/null 2>&1 || cleanup_status=1
          fi
          sudo rm -f "$helper"
          sudo rm -rf /var/run/heteronetwork-client
          rm -rf "$HOME/Applications/HeteroNetwork.app"
          python3 scripts/macos-client-live-e2e.py wipe \
            "$e2e_root/id_ed25519" \
            "$e2e_root/sudo-password" \
            "$e2e_root/request-uri" \
            "$e2e_root/import-profile" \
            "$e2e_root/tunnel.json" \
            "$e2e_root/cleanup-tunnel.json" \
            "$e2e_root/start-status.json" \
            "$e2e_root/stop-status.json" \
            "$e2e_root/report.json" || cleanup_status=1
          rm -rf "$e2e_root"
          exit "$cleanup_status"
