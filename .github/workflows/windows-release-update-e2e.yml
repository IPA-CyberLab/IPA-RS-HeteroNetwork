name: Windows release update E2E

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag whose Windows asset will be installed
        required: true
        type: string
      source_ref:
        description: Commit or tag containing the matching updater source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    heteronet-windows-release-update-${{
      github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_ref
    }}
  cancel-in-progress: false

jobs:
  update:
    name: Install and automatically update the published client
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.release_tag }}
      SOURCE_REF: >-
        ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_ref }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}

      - name: Validate release inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_TAG -notmatch '^v[0-9][A-Za-z0-9._-]*$') {
            throw "Release tag is invalid."
          }
          "SOURCE_SHA=$(git rev-parse HEAD)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Find the previous complete Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $releases = gh api `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2022-11-28" `
            "/repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
            ConvertFrom-Json
          $current = $releases | Where-Object tag_name -eq $env:RELEASE_TAG | Select-Object -First 1
          if (-not $current) {
            throw "The requested release was not found."
          }
          $required = @(
            "heteronetwork-client-windows-x64.zip",
            "heteronetwork-client-windows-x64.zip.sha256"
          )
          $previous = $releases |
            Where-Object {
              -not $_.draft -and
              $_.tag_name -ne $env:RELEASE_TAG -and
              [DateTimeOffset]$_.published_at -lt [DateTimeOffset]$current.published_at -and
              (@($_.assets.name | Where-Object { $_ -in $required }).Count -eq $required.Count)
            } |
            Sort-Object { [DateTimeOffset]$_.published_at } -Descending |
            Select-Object -First 1
          $tag = if ($previous) { $previous.tag_name } else { "" }
          "PREVIOUS_WINDOWS_RELEASE=$tag" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise automatic update from the previous release
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$PREVIOUS_WINDOWS_RELEASE"; then
            echo 'No earlier complete Windows release is available; skipping upgrade-path E2E.'
            exit 0
          fi
          HETERONETWORK_VERSION="$PREVIOUS_WINDOWS_RELEASE" \
            sh install-client.sh --no-launch

      - name: Wait for the installed application to replace itself
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PREVIOUS_WINDOWS_RELEASE) {
            return
          }
          $target = Join-Path $env:LOCALAPPDATA "Programs\HeteroNetwork"
          $executable = Join-Path $target "HeteroNetwork.exe"
          $previousVersion = (Get-Item -LiteralPath $executable).VersionInfo.ProductVersion
          if ($previousVersion -ne $env:PREVIOUS_WINDOWS_RELEASE) {
            Write-Host "$($env:PREVIOUS_WINDOWS_RELEASE) predates automatic updates; skipping upgrade-path E2E."
            return
          }
          $log = Join-Path $env:LOCALAPPDATA "HeteroNetwork\Updates\updater.log"
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $process = Start-Process `
            -FilePath $executable `
            -WorkingDirectory $target `
            -PassThru
          $deadline = [DateTimeOffset]::UtcNow.AddMinutes(8)
          do {
            Start-Sleep -Milliseconds 250
            $version = if (Test-Path -LiteralPath $executable -PathType Leaf) {
              (Get-Item -LiteralPath $executable).VersionInfo.ProductVersion
            } else {
              ""
            }
            if ($version -eq $env:RELEASE_TAG) {
              break
            }
          } while ([DateTimeOffset]::UtcNow -lt $deadline)
          if ($version -ne $env:RELEASE_TAG) {
            Get-Content -LiteralPath $log -ErrorAction SilentlyContinue
            throw "The Windows client did not activate $($env:RELEASE_TAG)."
          }
          $deadline = [DateTimeOffset]::UtcNow.AddSeconds(15)
          do {
            $restarted = @(
              Get-Process -Name HeteroNetwork -ErrorAction SilentlyContinue |
              Where-Object { $_.SessionId -eq [Diagnostics.Process]::GetCurrentProcess().SessionId }
            )
            if ($restarted.Count -gt 0) { break }
            Start-Sleep -Milliseconds 100
          } while ([DateTimeOffset]::UtcNow -lt $deadline)
          if ($restarted.Count -eq 0) {
            throw "The updated Windows application did not restart."
          }
          Get-Content -LiteralPath $log -ErrorAction Stop
          [pscustomobject]@{
            automatic_update_from = $env:PREVIOUS_WINDOWS_RELEASE
            automatic_update_to = $env:RELEASE_TAG
          } | ConvertTo-Json -Compress | Tee-Object `
            -FilePath (Join-Path $env:RUNNER_TEMP "windows-update-report.json")

      - name: Reinstall with the public shell installer and run the release self-test
        shell: bash
        run: |
          set -euo pipefail
          HETERONETWORK_VERSION="$RELEASE_TAG" sh install-client.sh --no-launch
          executable="$(cygpath -u "$LOCALAPPDATA")/Programs/HeteroNetwork/HeteroNetwork.exe"
          test -f "$executable"
          "$executable" --wireguard-self-test

      - name: Publish sanitized update result
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "windows-update-report.json"
          if (Test-Path -LiteralPath $report -PathType Leaf) {
            "### Windows automatic update E2E" | Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            Get-Content -LiteralPath $report | Out-File `
              -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Remove installed test application
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name HeteroNetwork -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq [Diagnostics.Process]::GetCurrentProcess().SessionId } |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Remove-Item `
            -LiteralPath (Join-Path $env:LOCALAPPDATA "Programs\HeteroNetwork") `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue
          Remove-Item `
            -LiteralPath (Join-Path $env:LOCALAPPDATA "HeteroNetwork\Updates") `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

