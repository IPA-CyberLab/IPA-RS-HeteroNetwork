name: Remove one stale 2026-11-09 E2E client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: heteronet-e2e
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Forward the private console through the verified sponsor
        env:
          HNN_E2E_SSH_PRIVATE_KEY: ${{ secrets.HNN_E2E_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/e2e-cleanup"
          printf '%s\n' "$HNN_E2E_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/e2e-cleanup/key"
          printf '%s\n' '163.220.236.45 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK038K5HfhW5BFKcXXK22/AunAU2mk2osPM98e0eZ1VI' > "$RUNNER_TEMP/e2e-cleanup/known_hosts"
          ssh -i "$RUNNER_TEMP/e2e-cleanup/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/e2e-cleanup/known_hosts" \
            -o ExitOnForwardFailure=yes -o ConnectTimeout=15 -fN \
            -L 127.0.0.1:9781:10.250.0.2:9781 mizuame@163.220.236.45
      - name: Remove and verify the exact disposable client
        env:
          HNN_E2E_CONSOLE_PASSWORD: ${{ secrets.HNN_E2E_CONSOLE_PASSWORD }}
        run: node scripts/cleanup-20261109-e2e-client.mjs
