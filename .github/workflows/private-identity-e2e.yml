name: Private identity connector E2E

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: &private_paths
      - '.github/workflows/private-identity-e2e.yml'
      - 'deploy/gitops/cluster-dns/keycloak-haproxy.cfg'
      - 'deploy/gitops/cluster-dns/keycloak-ha-connector.yaml'
      - 'deploy/gitops/cluster-dns/test_overlay_dns_service_discovery.py'
      - 'scripts/private-identity-proxy-e2e.py'
      - 'scripts/private-identity-vpn-e2e.py'
      - 'scripts/reconcile-private-*.py'
      - 'scripts/verify-private-owner-proof.py'
      - 'scripts/private-owner-device-proof.py'
      - 'scripts/reconcile-heterocloud-owner-broker.py'
      - 'scripts/test_reconcile_heterocloud_owner_broker.py'
      - 'scripts/private-owner-broker-keycloak-e2e.py'
      - 'scripts/retire-public-owner-client.py'
      - 'scripts/test_reconcile_private_*.py'
      - 'scripts/test_verify_private_owner_proof.py'
      - 'scripts/test_private_owner_device_proof.py'
      - 'scripts/test_retire_public_owner_client.py'
      - 'scripts/reconcile-owner-console-auth.sh'
      - 'scripts/test_reconcile_owner_console_auth.py'
      - 'deploy/terraform/master-only/ansible/private-*.yaml'
  pull_request:
    paths: *private_paths

permissions:
  contents: read

jobs:
  connector:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl haproxy python3-yaml wireguard-tools
      - name: Verify private identity configuration
        run: |
          PYTHONPATH=scripts python3 -B -m unittest test_reconcile_private_oidc_client test_reconcile_private_console_auth test_reconcile_heterocloud_owner_broker test_verify_private_owner_proof test_private_owner_device_proof test_retire_public_owner_client
          python3 -B -m unittest discover -s deploy/gitops/cluster-dns -p test_overlay_dns_service_discovery.py
          python3 -B scripts/private-identity-proxy-e2e.py
          sudo env PYTHONPATH=scripts python3 -B -m unittest test_reconcile_owner_console_auth
      - name: Verify isolated WireGuard access
        run: sudo python3 -B scripts/private-identity-vpn-e2e.py
      - name: Verify owner broker against real Keycloak
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          archive="$RUNNER_TEMP/keycloak-26.6.4.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/keycloak/keycloak/releases/download/26.6.4/keycloak-26.6.4.tar.gz
          echo "386b566bbea05527226e275c43e5cf6f218896ad2441ac4be5c39f1226772e8f  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          export KEYCLOAK_TEST_KCADM="$RUNNER_TEMP/keycloak-26.6.4/bin/kcadm.sh"
          export KEYCLOAK_TEST_ADMIN_PASSWORD="$(openssl rand -hex 32)"
          export KEYCLOAK_TEST_CA="$RUNNER_TEMP/owner-broker-ca.crt"
          export KC_BOOTSTRAP_ADMIN_USERNAME=admin
          export KC_BOOTSTRAP_ADMIN_PASSWORD="$KEYCLOAK_TEST_ADMIN_PASSWORD"
          sudo sh -c 'printf "127.0.0.1 cloud.example.test console.heteronetwork.internal\n" >> /etc/hosts'
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/owner-broker.key" -out "$KEYCLOAK_TEST_CA" \
            -subj '/CN=cloud.example.test' -addext 'subjectAltName=DNS:cloud.example.test' > /dev/null 2>&1
          cat "$RUNNER_TEMP/owner-broker.key" "$KEYCLOAK_TEST_CA" > "$RUNNER_TEMP/owner-broker.pem"
          chmod 600 "$RUNNER_TEMP/owner-broker.pem"
          cat > "$RUNNER_TEMP/owner-broker-haproxy.cfg" <<EOF
          global
              maxconn 64
          defaults
              mode http
              timeout connect 5s
              timeout client 30s
              timeout server 30s
          frontend cloud
              bind 127.0.0.1:18443 ssl crt $RUNNER_TEMP/owner-broker.pem
              http-request set-path %[path,regsub(^/id/,/)]
              http-request set-header X-Forwarded-Proto https
              default_backend keycloak
          frontend private
              bind 127.0.0.1:18079
              http-request set-header X-Forwarded-Proto http
              default_backend keycloak
          backend keycloak
              server local 127.0.0.1:18080
          EOF
          haproxy -c -f "$RUNNER_TEMP/owner-broker-haproxy.cfg"
          haproxy -f "$RUNNER_TEMP/owner-broker-haproxy.cfg" -db > "$RUNNER_TEMP/owner-broker-haproxy.log" 2>&1 &
          proxy_pid=$!
          "$RUNNER_TEMP/keycloak-26.6.4/bin/kc.sh" start-dev \
            --http-host=127.0.0.1 --http-port=18080 --hostname-strict=false --proxy-headers=xforwarded \
            > "$RUNNER_TEMP/keycloak-e2e.log" 2>&1 &
          keycloak_pid=$!
          trap 'kill "$keycloak_pid" "$proxy_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:18080/realms/master/.well-known/openid-configuration > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            tail -n 30 "$RUNNER_TEMP/keycloak-e2e.log"
            exit 1
          fi
          python3 -B scripts/private-owner-broker-keycloak-e2e.py
