name: HeteroNetwork

options:
  bundleIdPrefix: jp.go.ipa.cyberlab
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  HeteroNetworkCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.go.ipa.cyberlab.heteronetwork.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  HeteroNetwork:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
    dependencies:
      - target: HeteroNetworkCore
        embed: true
    postBuildScripts:
      - name: Embed privileged network helper
        script: |
          set -euo pipefail
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/heteronetwork-root-helper"
          "$PROJECT_DIR/scripts/build-root-helper.sh" "$destination"
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: HeteroNetwork
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: jp.go.ipa.cyberlab.heteronetwork.enrollment
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - heteronetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.go.ipa.cyberlab.heteronetwork
        PRODUCT_NAME: HeteroNetwork

  HeteroNetworkCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CoreTests
    dependencies:
      - target: HeteroNetworkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.go.ipa.cyberlab.heteronetwork.core-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HeteroNetwork:
    build:
      targets:
        HeteroNetwork: all
        HeteroNetworkCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HeteroNetworkCoreTests
    archive:
      config: Release
