image:
  repository: ghcr.io/ipa-cyberlab/heteronetwork
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

cluster:
  controlPlaneUrl: "http://heteronetwork-control-plane:8443"
  signalUrl: "http://heteronetwork-signal:9443"
  stunEndpoint: ""

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

kubernetesPlugin:
  enabled: true
  loadBalancerClass: heteronetwork.io/public
  controller:
    replicas: 2
    reconcileIntervalSeconds: 30
    webhookBind: "0.0.0.0:9443"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: ""
        memory: ""
    probes:
      liveness:
        enabled: true
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 1
        failureThreshold: 3
      readiness:
        enabled: true
        initialDelaySeconds: 2
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 3
      startup:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 2
        timeoutSeconds: 1
        failureThreshold: 30
  nodeReporter:
    reconcileIntervalSeconds: 10
    fullReconcileIntervalSeconds: 300
    publicCandidateMaxAgeSeconds: 180
    publishNodeExternalIp: true
    healthBind: "127.0.0.1:19089"
    # Host-networked node reporters can use the per-node HAProxy endpoint when
    # the node's physical default route cannot reach the Kubernetes Service IP.
    kubernetesServiceHost: ""
    kubernetesServicePort: ""
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: ""
        memory: ""
  webhook:
    servicePort: 443
    timeoutSeconds: 10
  agones:
    enabled: false
    portRangeStart: 20000
    portRangeEnd: 65535

agent:
  mode: managed
  hostAgent:
    apiBearerTokenFile: /etc/heteronetwork/kubernetes/agent-api-token
  overlayDns:
    enabled: false
    records: {}
    gatewayRecords: {}
  interfaceName: heteronetwork0
  wireguardListenPort: 51820
  overlayTransitPort: 51822
  stunBind: "0.0.0.0:51820"
  natDiscovery:
    intervalSeconds: 60
  runtimeBackend: linux-command
  routeBackend: command
  peerMap:
    enabled: true
    pollIntervalSeconds: 30
  http:
    connectTimeoutSeconds: 5
    requestTimeoutSeconds: 30
  directPathVerification:
    probeTimeoutSeconds: 120
    handshakeMaxAgeSeconds: 180
  peerProbe:
    enabled: true
    port: 51821
    intervalSeconds: 30
    sampleCount: 5
    responseTimeoutMillis: 500
    sampleIntervalMillis: 20
    maxConcurrency: 32
    responderMaxRequestsPerSecond: 100
    observationMaxAgeSeconds: 120
  joinTokenSecretName: heteronetwork-join-token
  joinTokenSecretKey: token
  apiBearerTokenSecretKey: agent-api-token
  routeProvider: true
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  automountServiceAccountToken: true
  state:
    hostPath: /var/lib/heteronetwork
    hostPathType: DirectoryOrCreate
    mountPath: /var/lib/heteronetwork
  probes:
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
    readiness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
    startup:
      enabled: true
      path: /healthz
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 1
      failureThreshold: 30
  lifecycle:
    preStopSleepSeconds: ""
  terminationGracePeriodSeconds: ""
  privileged: false
  securityContext:
    allowPrivilegeEscalation: ""
    readOnlyRootFilesystem: ""
    seccompProfile:
      type: ""
      localhostProfile: ""
    capabilities:
      add:
        - NET_ADMIN
        - NET_RAW
      drop: []
  podSecurityContext:
    runAsUser: ""
    runAsGroup: ""
    runAsNonRoot: ""
    fsGroup: ""
    fsGroupChangePolicy: ""
    supplementalGroups: []
  podLabels: {}
  podAnnotations: {}
  priorityClassName: ""
  schedulerName: ""
  runtimeClassName: ""
  nodeSelector: {}
  nodeAffinity:
    required:
      matchExpressions: []
    preferred: []
  podAffinity:
    required: []
    preferred: []
  podAntiAffinity:
    required: []
    preferred: []
  tolerations: []
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: ""
      memory: ""
    limits:
      cpu: ""
      memory: ""
  rollout:
    updateStrategy: ""
    maxUnavailable: ""
    maxSurge: ""
    minReadySeconds: ""
    revisionHistoryLimit: ""
  podDisruptionBudget:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""
  apiService:
    enabled: false
    exposureAcknowledged: false
    allowUnrestrictedLoadBalancer: false
    allowClusterExternalTrafficPolicy: false
    type: ClusterIP
    clusterIP: ""
    clusterIPs: []
    annotations: {}
    loadBalancerSourceRanges: []
    loadBalancerClass: ""
    loadBalancerIP: ""
    externalIPs: []
    healthCheckNodePort: 0
    allocateLoadBalancerNodePorts: true
    ipFamilyPolicy: ""
    ipFamilies: []
    internalTrafficPolicy: ""
    trafficDistribution: ""
    sessionAffinity: ""
    sessionAffinityTimeoutSeconds: 0
    externalTrafficPolicy: Local
    appProtocol: http
    publishNotReadyAddresses: false
    port: 9780
    targetPort: 9780
    nodePort: 0
  relayForwarder:
    enabled: false
    endpoint: ""
    bind: ""
    wireguardEndpoint: ""
    maxSessions: 1024
    restartBackoffSeconds: 5
    crashWindowSeconds: 60
    maxCrashesPerWindow: 3
    crashCooldownSeconds: 60
    netns: ""
  relayAdmissionBearerTokenSecret:
    name: ""
    key: ""
  relayAdvertisement:
    enabled: false
    publicEndpoint: ""
    admissionUrl: ""
    statusUrl: ""
    maxSessions: 10000
    maxMbps: 1000
  relayService:
    enabled: false
    exposureAcknowledged: false
    allowUnrestrictedLoadBalancer: false
    allowClusterExternalTrafficPolicy: false
    type: LoadBalancer
    clusterIP: ""
    clusterIPs: []
    annotations: {}
    loadBalancerSourceRanges: []
    loadBalancerClass: ""
    loadBalancerIP: ""
    externalIPs: []
    healthCheckNodePort: 0
    allocateLoadBalancerNodePorts: true
    ipFamilyPolicy: ""
    ipFamilies: []
    internalTrafficPolicy: ""
    trafficDistribution: ""
    sessionAffinity: ""
    sessionAffinityTimeoutSeconds: 0
    externalTrafficPolicy: Local
    udpAppProtocol: heteronetwork.io/relay-udp
    httpAppProtocol: http
    publishNotReadyAddresses: false
    udpPort: 51820
    udpTargetPort: 51830
    httpPort: 9580
    httpTargetPort: 9580
    udpNodePort: 0
    httpNodePort: 0

serviceExposure:
  enabled: true
  discoverServices: false
  discoverApiServer: true
  apiServerCidrs: []
  serviceCidrs:
    - 10.96.0.0/12
  namespaces: []
  serviceLabelSelector: ""
  routeProviderNodeId: ""
  routeIntervalSeconds: 60

networkPolicy:
  enabled: false
  acknowledgeHostNetwork: false
  agentApi:
    enabled: false
    allowedCidrs: []
  relay:
    enabled: false
    allowedCidrs: []
