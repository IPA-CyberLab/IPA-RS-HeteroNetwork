{{- include "heteronetwork.validateChartMetadata" . -}}
{{- include "heteronetwork.validateKubernetesPlugin" . -}}
{{- $pluginEnabled := eq (printf "%v" .Values.kubernetesPlugin.enabled) "true" -}}
{{- $rbacCreate := eq (printf "%v" .Values.rbac.create) "true" -}}
{{- if and $pluginEnabled $rbacCreate -}}
{{- $customerResourcesEnabled := eq (printf "%v" .Values.kubernetesPlugin.customerResources.enabled) "true" -}}
{{- $controllerName := include "heteronetwork.kubernetesPluginControllerName" . -}}
{{- $reporterName := printf "%s-node-reporter" $controllerName -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $reporterName }}
  labels:
    app.kubernetes.io/name: {{ include "heteronetwork.name" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: node-reporter
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - nodes/status
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $reporterName }}
  labels:
    app.kubernetes.io/name: {{ include "heteronetwork.name" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: node-reporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $reporterName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "heteronetwork.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $controllerName }}
  labels:
    app.kubernetes.io/name: {{ include "heteronetwork.name" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: kubernetes-controller
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - patch
      {{- if or $customerResourcesEnabled (eq (printf "%v" .Values.kubernetesPlugin.agones.enabled) "true") }}
      - create
      - delete
      {{- end }}
  {{- if $customerResourcesEnabled }}
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - create
      - patch
  {{- end }}
  - apiGroups:
      - ""
    resources:
      - services/status
    verbs:
      - patch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
  {{- if eq (printf "%v" .Values.kubernetesPlugin.agones.enabled) "true" }}
  - apiGroups:
      - agones.dev
    resources:
      - gameservers
    verbs:
      - list
      - patch
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $controllerName }}
  labels:
    app.kubernetes.io/name: {{ include "heteronetwork.name" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: kubernetes-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $controllerName }}
subjects:
  - kind: ServiceAccount
    name: {{ $controllerName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
