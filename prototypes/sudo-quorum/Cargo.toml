[package]
name = "ipars-host-authorization-prototype"
version = "0.0.0"
edition = "2021"
publish = false

# Deliberately outside the daemon workspace and release graph.
[workspace]

[dependencies]
ipars-quorum = { path = "../../crates/ipars-quorum" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
zeroize = "1.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.30", features = ["user"] }
socket2 = { version = "0.6", features = ["all"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
